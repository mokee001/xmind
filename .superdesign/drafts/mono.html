  <style>
    :root {
      font-family: Arial, "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;

      background: #F2F2F2;
      font-synthesis: none;
      --ink: #111111;
      --muted: #666666;
      --line: #CFCFCF;
      --paper: #F2F2F2;
      --semantic-green: #60836B;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); }
    button, a { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    h1, h2, p { margin: 0; }
    svg { display: inline-block; flex-shrink: 0; vertical-align: middle; }
    
    .phone-status {
      height: 45px;
      padding: env(safe-area-inset-top) 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }
    .status-symbols { display: flex; align-items: center; gap: 5px; font-size: 8px; letter-spacing: -1px; }
    
    .app-header {
      height: 64px;
      padding: 8px 24px 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--paper);
      z-index: 4;
    }
    .header-action { min-height: 42px; display: flex; align-items: center; gap: 7px; padding: 0 4px; font-size: 12px; font-weight: 500; white-space: nowrap; }
    .header-action.icon-button { width: 42px; justify-content: center; border: 1px solid var(--line); border-radius: 4px; padding: 0; }
    .status-pill { font-size: 12px; display: flex; align-items: center; gap: 7px; font-weight: 500; }
    .status-pill i { width: 6px; height: 6px; border-radius: 0; background: var(--semantic-green); display: inline-block; }
    .status-pill small { font-size: 9px; color: var(--muted); font-weight: 400; margin-left: 2px; }
    
    #screen { height: calc(844px - 45px - 64px); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; scroll-behavior: smooth; position: relative; }
    #screen::-webkit-scrollbar { display: none; }
    
    .calendar-hero {
      padding: 12px 24px 24px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .calendar-hero .eyebrow { font-size: 9px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
    .calendar-hero h1 { font-size: 34px; line-height: 1.2; font-weight: 700; margin-top: 8px; letter-spacing: -0.5px; }
    .calendar-hero p { font-size: 12px; line-height: 1.6; color: var(--muted); margin-top: 8px; max-width: 200px; }
    .today-button { height: 36px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; font-size: 12px; font-weight: 500; background: var(--paper); margin-bottom: 2px; transition: background 0.2s; }
    .today-button:active { background: #e5e5e5; }
    
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin: 0 24px;
      padding: 16px 0 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      background: var(--paper);
      position: sticky;
      top: 120px; /* Approx hero height */
      z-index: 3;
    }
    
    .calendar-months { padding: 0 24px; }
    .month-section { padding: 0 0 32px; scroll-margin-top: 42px; }
    .month-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0 16px; }
    .month-name { display: flex; align-items: baseline; gap: 8px; }
    .month-name h2 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
    .month-name span { font-size: 11px; font-weight: 700; color: var(--muted); }
    .month-meta { font-size: 10px; font-weight: 500; color: var(--muted); }
    
    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 2px; row-gap: 0; border-top: 1px solid var(--line); }
    .day {
      position: relative;
      min-height: 72px;
      padding: 8px 2px 12px;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    .day-number { height: 24px; width: 24px; display: grid; place-items: center; font-size: 14px; font-weight: 500; line-height: 1; position: relative; z-index: 1; }
    .day.future { color: #A0A0A0; }
    .day.today .day-number { background: var(--ink); color: #fff; }
    
    .day-art {
      width: 36px;
      height: 32px;
      overflow: hidden;
      border-radius: 2px;
      display: grid;
      place-items: center;
      filter: grayscale(100%) contrast(1.1);
    }
    .day-art svg { width: 36px; height: 32px; display: block; }
    .day-empty-marker { height: 3px; width: 3px; background: #CFCFCF; margin-top: 8px; }
    
    .month-empty { text-align: center; padding: 24px 0 8px; font-size: 11px; font-weight: 500; color: var(--muted); }
    .calendar-hint { padding: 32px 0 0; display: flex; align-items: center; gap: 12px; font-size: 10px; font-weight: 500; color: var(--muted); text-transform: uppercase; }
    .calendar-hint .hint-line { height: 1px; flex: 1; background: var(--line); }
    .calendar-bottom-note { padding: 16px 0 32px; font-size: 10px; color: var(--muted); text-align: center; line-height: 1.6; }
    
    .calendar-edge { width: 100%; padding: 24px 0; color: var(--muted); font-size: 11px; font-weight: 500; display: flex; justify-content: center; align-items: center; gap: 8px; }
  </style>
</head>
