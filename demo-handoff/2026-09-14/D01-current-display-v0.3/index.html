<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echooo · 当前展示</title><link rel="stylesheet" href="style.css"></head><body><aside class="notes"><a class="brand" href="./">echooo<span>●</span></a><p class="kicker">YOUR EVERYDAY MOMENTS</p><h1>熟悉的片段，<br>重新回到生活里。</h1><p>从授权相册，到第一面照片墙。<br>完成后直接进入当前展示。</p><div class="demo-controls"><button id="replay">↺ 重新体验完整流程</button><button id="walltoggle">查看实体屏模拟</button></div><small>交互 Demo · 图片为无私人照片的示意素材<br>生成与设备回执为模拟，不修改真实设备</small><section id="wallpanel" hidden><p class="kicker">实体屏 · 模拟</p><div class="wallframe"><img src="wall.svg" alt="实体屏模拟画面"></div><p id="wallstate">正在展示当前画面</p></section></aside><main class="phone"><header><span class="brand">echooo<span>●</span></span><button id="settings" aria-label="展示安排">•••</button></header><div class="scroll"><section id="onboarding"></section><div id="dashboard" hidden><div class="page-heading"><h2>此刻，墙上。</h2><span id="device-status">客厅照片墙 · 已更新</span></div><section id="stage" aria-live="polite"><button id="current-image" aria-label="放大当前照片墙"><img id="current-photo" src="wall.svg" alt="当前展示的完整照片墙"></button><div id="waiting" hidden><div class="color-field"><i></i><i></i><i></i></div><h2 id="waiting-title">正在搭配你的第一面照片墙</h2><p id="waiting-caption">从熟悉的照片里，找到新的相遇。</p></div></section><div id="current-meta"><div class="under"><span id="updated-at">今天 08:30 更新</span><span id="next-time">明天 08:30 换一组</span></div><div class="actions"><button id="hold">多留几天</button><button id="next">换一组</button></div></div></div></div><footer><span>照片自然更新，生活慢慢发生。</span><span>✳</span></footer><div id="toast" role="status"></div><section id="sheet" hidden><button id="close-sheet" aria-label="关闭">×</button><h2>展示安排</h2><label>每天自动更新<input id="daily" type="checkbox" checked></label><label>更新时间<input id="update-time" type="time" value="08:30"></label><p>仅对本次演示有效。</p></section><dialog id="viewer"><button id="close-viewer" aria-label="关闭大图">×</button><img id="large-photo" alt="照片墙大图"><p id="large-caption"></p></dialog></main><script src="app.js"></script></body></html>
