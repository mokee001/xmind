<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D02 · 安静首页</title><style>body{margin:0;padding:24px 12px;background:#eeeee8;color-scheme:light}button{font:inherit}</style></head><body><style>
#pw-demo{--paper:light-dark(#f6f5ef,#222621);--ink:light-dark(#28352e,#edf0e8);--muted:light-dark(#687269,#aeb9ad);--line:light-dark(#dde1d6,#41483f);--soft:light-dark(#e9eddf,#343e30);--accent:light-dark(#526c42,#bacd9c);--onaccent:light-dark(#fff,#202c19);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink);max-width:440px;margin:auto}#pw-demo *{box-sizing:border-box}#pw-demo button,#pw-demo input,#pw-demo select{font:inherit}#pw-demo button{cursor:pointer}#pw-demo .demo-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}#pw-demo select{max-width:180px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:7px;border-radius:8px}#pw-demo .phone{background:var(--paper);border:1px solid var(--line);border-radius:36px;overflow:hidden;box-shadow:0 16px 45px #0000000c}#pw-demo .status{height:45px;padding:16px 25px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:500}#pw-demo .island{width:80px;height:21px;background:var(--ink);border-radius:20px;margin-top:-5px}#pw-demo .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 27px 0;height:53px;font-size:11px;letter-spacing:2px}#pw-demo .nav button{border:0;background:none;color:var(--muted);padding:8px;letter-spacing:0}#pw-demo .screen{min-height:590px;padding:26px 28px 22px;display:flex;flex-direction:column}#pw-demo .eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:15px}#pw-demo h2{font-family:'Songti SC',STSong,serif;font-weight:500;font-size:29px;line-height:1.45;letter-spacing:1px;margin:0 0 13px}#pw-demo p{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 18px}#pw-demo .art{height:170px;display:flex;align-items:center;justify-content:center;position:relative;margin:12px 0 22px}#pw-demo .envelope{width:184px;height:120px;background:var(--soft);border:1px solid var(--line);transform:rotate(-7deg);position:relative;box-shadow:7px 10px 0 color-mix(in srgb,var(--ink) 5%,transparent)}#pw-demo .envelope:before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 62%);background:color-mix(in srgb,var(--accent) 16%,var(--paper))}#pw-demo .seal{position:absolute;left:76px;top:52px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;font-size:14px}#pw-demo .stamp{position:absolute;right:16px;bottom:8px;color:var(--muted);font-size:10px;letter-spacing:2px}#pw-demo .bottom{margin-top:auto;padding-top:22px}#pw-demo .primary{width:100%;border:0;background:var(--accent);color:var(--onaccent);padding:16px;border-radius:12px;font-size:15px}#pw-demo .secondary{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink);padding:14px;border-radius:12px;margin-top:10px;font-size:14px}#pw-demo .link{display:block;margin:9px auto 0;background:transparent;border:0;color:var(--muted);padding:10px;font-size:12px}#pw-demo .note{font-size:11px;text-align:center;margin-top:13px;line-height:1.65;color:var(--muted)}#pw-demo .row{width:100%;background:transparent;border:1px solid var(--line);border-radius:14px;padding:17px;text-align:left;color:var(--ink);display:flex;align-items:center;gap:14px;margin:10px 0}#pw-demo .row small{display:block;color:var(--muted);margin-top:5px;font-size:11px}#pw-demo .row .chev{margin-left:auto}#pw-demo .device{width:40px;height:49px;border:4px solid var(--ink);border-radius:3px;background:var(--soft)}#pw-demo .processing{padding:14px 0;border-top:1px solid var(--line);margin-top:22px;font-size:12px;color:var(--muted)}#pw-demo .track{height:3px;background:var(--line);margin-top:10px;border-radius:4px;overflow:hidden}#pw-demo .fill{height:100%;background:var(--accent);transition:width .5s}#pw-demo .permission{border:1px solid var(--line);border-radius:20px;padding:24px 18px;background:var(--soft);margin:14px 0}#pw-demo .permission h3{font-size:17px;font-weight:500;margin:0 0 12px}#pw-demo label{font-size:13px;display:block;margin-top:20px}#pw-demo input[type=password],#pw-demo input[type=text]{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px;margin-top:8px}#pw-demo .check{display:flex;gap:9px;align-items:center;padding:12px 0;margin:0}#pw-demo .circle{width:116px;height:116px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--soft);font-size:33px;color:var(--accent)}#pw-demo .error{font-size:13px;color:light-dark(#a34933,#ffb69f);margin:12px 0}#pw-demo .homebar{width:100px;height:4px;background:var(--ink);border-radius:10px;margin:0 auto 10px}#pw-demo .frame{border:12px solid #b29b79;padding:17px;background:#f9f6e9;box-shadow:0 10px 20px #0002;transform:rotate(-2deg);color:#354838;margin:26px 0}#pw-demo .landscape{height:150px;background:linear-gradient(175deg,#c6d7d5 0 46%,#8aab9a 47% 59%,#e7d7ad 60%);position:relative;overflow:hidden}#pw-demo .landscape:after{content:'';position:absolute;width:120px;height:60px;border-radius:50%;background:#667f62;right:-20px;top:70px;transform:rotate(-15deg)}#pw-demo .frame-title{font-family:'Songti SC',serif;font-size:22px;margin-top:16px}#pw-demo .frame-date{font-size:10px;letter-spacing:2px;margin-top:9px}#pw-demo .feedback{display:flex;gap:10px}#pw-demo .feedback button{flex:1}#pw-demo button:disabled{opacity:.45;cursor:default}@media(max-width:360px){#pw-demo .screen{padding:22px 21px;min-height:570px}#pw-demo h2{font-size:26px}}
#pw-demo .quiet-art{overflow:hidden;height:180px}#pw-demo .sunlight{position:absolute;width:130px;height:200px;background:color-mix(in srgb,var(--accent) 8%,transparent);transform:skew(-25deg);right:20px;top:-20px}#pw-demo .quiet-frame{width:88px;height:109px;border:7px solid color-mix(in srgb,var(--ink) 50%,var(--paper));background:var(--paper);position:relative;margin-top:10px}#pw-demo .shelf-line{position:absolute;width:230px;height:2px;background:var(--line);bottom:24px}#pw-demo .setting-row{width:100%;padding:18px 0;display:flex;justify-content:space-between;gap:8px;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);font-size:13px}#pw-demo .setting-row span{color:var(--muted);font-size:12px}#pw-demo .outside{font-size:12px;color:var(--muted);margin-top:18px}#pw-demo .outside summary{cursor:pointer;padding:10px 0}#pw-demo .room{background:var(--soft);padding:35px 50px;border-radius:16px;min-height:290px;display:grid;place-items:center}#pw-demo .room .frame{width:100%;margin:0}#pw-demo .room .frame-title{font-size:17px}#pw-demo .empty-wall{width:170px;height:210px;display:grid;place-items:center;border:10px solid #b29b79;background:var(--paper);font-size:12px;letter-spacing:3px}#pw-demo .soft-request p{font-size:12px;margin:8px 0 0}#pw-demo .soft-request .link{margin:0;padding-left:0}@media(max-width:360px){#pw-demo .room{padding:30px}} </style>
<div id="pw-demo" aria-label="照片墙首次使用原型">
 <div class="demo-tools"><span>交互 Demo · 模拟数据</span><select id="scenario" aria-label="体验场景"><option value="normal">近期多为截图</option><option value="few">授权范围照片不足</option><option value="fail">首次连接失败</option></select></div>
 <div class="phone"><div class="status"><span>09:41</span><span class="island"></span><span>▮▮▮  ▰</span></div><div class="nav"><span>PHOTO WALL</span><button id="restart">重新体验</button></div><main class="screen" id="pw-screen" aria-live="polite"></main><div class="homebar"></div></div><details class="outside"><summary>观察照片墙 · Demo 环境</summary><div id="ambient-wall"></div></details>
</div>
<script>
(()=>{const root=document.getElementById('pw-demo'),screen=root.querySelector('#pw-screen');let stage='intro',scenario='normal',progress=0,authorized=false,connected=false,failed=false,scope='',timer=null,delay=null,network='家里的 Wi-Fi',resume='intro',feedback='',alternate=false,displayed=false,autoUpdate=true;
const options={tone:'苔绿'};
const button=(text,action,cls='primary')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const heading=(n,title,desc)=>`<div class="eyebrow">${n}</div><h2>${title}</h2><p>${desc}</p>`;
const envelope=()=>'<div class="art quiet-art" aria-hidden="true"><div class="sunlight"></div><div class="quiet-frame"></div><div class="shelf-line"></div></div>';
const progressText=()=>progress<30?'正在本机整理照片':progress<65?'正在跳过截图与重复照片':progress<100?'正在寻找值得重逢的日常':'本机整理已完成';
const processing=()=>authorized?`<div class="processing"><span id="proc-text">${progressText()}</span><div class="track"><div id="proc-fill" class="fill" style="width:${progress}%"></div></div></div>`:'';
function startScan(){clearInterval(timer);timer=setInterval(()=>{progress=Math.min(100,progress+5);const txt=root.querySelector('#proc-text'),fill=root.querySelector('#proc-fill');if(txt)txt.textContent=progressText();if(fill)fill.style.width=progress+'%';if(progress===100){clearInterval(timer);if(stage==='home')finish();}},500)}
function paintWall(){root.querySelector('#ambient-wall').innerHTML=displayed?`<div class="room"><div class="frame"><div class="landscape" role="img" aria-label="照片墙示意画面"></div><div class="frame-title">${alternate?'慢慢走过的日子':'一个有海风的下午'}</div><div class="frame-date">日常片段 · 示例画面</div></div></div>`:'<div class="room"><div class="empty-wall">照片墙</div></div>';}
function finish(){if(!connected||progress<100)return;if(scenario==='few'){if(stage==='home'){render()}return}clearTimeout(delay);delay=setTimeout(()=>{displayed=true;paintWall();},2200)}
function render(){let html='';if(stage==='intro')html=heading('日常，自有值得停留的瞬间','让生活里的照片，<br>成为家里的风景。','允许照片墙认识你的相册。那些熟悉的、忘记的日常，会慢慢出现在家里。')+envelope()+'<div class="bottom">'+button('选择照片范围','permission')+'<div class="note">照片先在本机整理。你只需决定可访问的范围。<br>入选照片将上传，用于生成画面并送到设备。</div>'+button('稍后开始','pause','link')+'</div>';
if(stage==='permission')html=heading('01 / 照片','从你的相册，<br>开始。','只会从你允许访问的范围里挑选。')+'<div class="permission"><div class="eyebrow">系统授权弹窗 · 模拟</div><h3>允许照片墙访问你的照片</h3><p>选择部分照片，或允许访问全部照片。你可以随时调整。</p>'+button('允许访问全部照片','allow')+button('选择部分照片','limited','secondary')+'</div><div class="bottom">'+button('暂不允许','pause','link')+'</div>';
if(stage==='limited')html=heading('01 / 照片','选一些生活照片。','模拟选择照片范围，不展示候选或具体入选照片。')+'<label class="check"><input type="checkbox" checked disabled> 日常与旅行 · 示例范围</label><p>正式版本在系统照片选择器中选择。</p><div class="bottom">'+button('允许所选照片','allow-limited')+'</div>';
if(stage==='device')html=heading('02 / 连接','让照片墙，<br>加入这个家。','给照片墙通电，让手机靠近它。')+'<div class="art"><div class="circle"><i data-lucide="bluetooth"></i></div></div><button class="row" data-action="device"><span class="device"></span><span>照片墙 A6F2<small>在你附近 · 可连接</small></span><span class="chev">›</span></button>'+processing()+'<div class="bottom">'+button('设备不在身边，稍后连接','pause','link')+'</div>';
if(stage==='wifi'||stage==='error')html=heading('02 / 连接','连上家里的网络。','照片正在本机整理，你可以继续配网。')+`<label>Wi-Fi<select id="wifi" style="display:block;max-width:none;width:100%;margin-top:8px;padding:14px"><option>家里的 Wi-Fi</option><option>客厅网络</option></select></label><label for="password">网络密码</label><input id="password" type="password" placeholder="任意输入 8 位字符以体验" autocomplete="off"><div class="note">模拟配网，请勿输入真实密码。</div>`+(stage==='error'?'<div class="error" role="alert">未能连接网络。照片整理进度已保留，请重试。</div>':'')+processing()+'<div class="bottom">'+button(stage==='error'?'重试连接':'连接照片墙','connect')+button('返回设备列表','back-device','link')+'</div>';
if(stage==='connecting')html=heading('02 / 连接','正在连接。','请保持照片墙通电，暂时停留在这里。')+'<div class="art"><div class="circle"><i data-lucide="wifi"></i></div></div><p>正在加入 '+network+'…</p>'+processing();
if(stage==='insufficient')html=heading('再多一点回忆','这里的生活照片，<br>还不太够。','已跳过截图、文档和重复照片。试试添加一些日常或旅行照片。')+envelope()+'<div class="bottom">'+button('扩大照片范围','expand')+button('稍后添加','pause','link')+'</div>';
if(stage==='home')html=heading('家里的照片墙','让它，<br>慢慢成为日常。','偶尔抬头，或许会遇见一段熟悉的时光。')+envelope()+`<div class="row"><span class="device"></span><span>家里的照片墙<small>已连接</small></span><span class="chev">✓</span></div>`+(scenario==='few'&&progress===100?`<div class="soft-request"><p>当前范围里生活照片较少，可以再添加一些。</p>${button('调整照片范围','expand','link')}</div>`:'')+`<div class="bottom"><button class="setting-row" data-action="scope">照片范围<span>${scope}　›</span></button><button class="setting-row" data-action="toggle">自动更新<span>${autoUpdate?'每天早上 · 已开启':'已暂停'}　›</span></button><button class="setting-row" data-action="history">过去的画面<span>›</span></button></div>`;
if(stage==='history')html=heading('过去的画面','留在这里的日常。',displayed?'想起的时候，再翻一翻。':'以后展示过的画面，会留在这里。')+(displayed?`<div class="frame"><div class="landscape" role="img" aria-label="已展示画面示意"></div><div class="frame-title">一个有海风的下午</div><div class="frame-date">日常片段</div></div><div class="feedback">${button('喜欢这次','like','secondary')}${button('少出现这类照片','less','secondary')}</div><div class="note">${feedback}</div>`:envelope())+'<div class="bottom">'+button('返回','home','secondary')+'</div>';
if(stage==='scope')html=heading('照片范围','由你决定，<br>哪些日常可以出现。','当前范围：'+scope)+button('添加生活照片','expand','secondary')+'<div class="bottom">'+button('返回','home','secondary')+'</div>';
if(stage==='reason')html=heading('轻轻调整','下次，<br>更合你心意。','选一个原因，也可以直接换一组。')+button('不喜欢这些照片','new-photos','secondary')+button('不喜欢排版','new-layout','secondary')+'<div class="bottom">'+button('直接换一组','new-photos')+button('取消','home','link')+'</div>';
if(stage==='paused')html=heading('随时回来','不急，<br>回忆可以等一等。',authorized?'照片授权和整理进度已保留。':'准备好后，再选择照片范围。')+envelope()+'<div class="bottom">'+button('继续设置','resume')+'</div>';
screen.innerHTML=html;paintWall();if(globalThis.lucide)lucide.createIcons();}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='permission')stage='permission';if(a==='limited')stage='limited';if(a==='allow'||a==='allow-limited'){authorized=true;scope=a==='allow'?'全部已授权照片':'所选照片';startScan();stage='device'}if(a==='device')stage='wifi';if(a==='back-device')stage='device';if(a==='connect'){const p=root.querySelector('#password');if(p.value.length<8){p.setCustomValidity('请任意输入至少 8 位字符');p.reportValidity();p.oninput=()=>p.setCustomValidity('');return}network=root.querySelector('#wifi').value;stage='connecting';clearTimeout(delay);delay=setTimeout(()=>{if(scenario==='fail'&&!failed){failed=true;stage='error';render()}else{connected=true;stage='home';render();finish()}},2500)}if(a==='pause'){resume=stage==='insufficient'?'insufficient':authorized?'device':'intro';stage='paused'}if(a==='resume')stage=resume;if(a==='expand'){scenario='normal';root.querySelector('#scenario').value='normal';progress=45;scope='扩大后的授权照片';startScan();stage='home'}if(a==='home')stage='home';if(a==='like')feedback='已记下，会为你寻找更多这样的回忆。';if(a==='replace')stage='reason';if(a==='new-photos'||a==='new-layout'){alternate=true;stage='home';delay=setTimeout(()=>{displayed=true;paintWall()},1800)}if(a==='toggle')autoUpdate=!autoUpdate;if(a==='history')stage='history';if(a==='scope')stage='scope';if(a==='less')feedback='已记下，将减少类似照片。';render()});
function reset(){clearInterval(timer);clearTimeout(delay);stage='intro';progress=0;authorized=false;connected=false;failed=false;feedback='';alternate=false;displayed=false;autoUpdate=true;paintWall();render()}
root.querySelector('#restart').onclick=reset;root.querySelector('#scenario').onchange=e=>{scenario=e.target.value;reset()};render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--accent',options.tone==='墨黑'?'light-dark(#28352e,#d5dfce)':'light-dark(#526c42,#bacd9c)')}});tweak.addSelect(options,'tone',{label:'按钮色调',options:['苔绿','墨黑']})}
})();
</script>
</body></html>
