<body>
<div class="app" id="app">
<header class="topbar"><button class="connection" data-open="connection"><i></i>已连接 <small>· 示例</small></button><div class="top-actions"><button data-open="preferences">偏好</button><button data-open="settings" aria-label="设置"><iconify-icon icon="lucide:settings-2"></iconify-icon><span class="fallback">设置</span></button></div></header>
<main class="journal" id="journal" aria-label="生活画布，回看已展示的示例回忆">

<div class="canvas-wrap" id="canvasWrap"><div class="canvas" id="canvas">
<h1>这些日子</h1><p class="canvas-context">屏幕上留下的片刻</p>
<p class="date sea-date">09.12 — 09.13</p>
<button class="fragment stairs" data-photo="1" aria-label="放大照片：通向海边的台阶"><span class="image" data-scene="4"></span></button>
<button class="fragment sea" data-photo="0" aria-label="放大照片：海里的蓝色身影"><span class="image" data-scene="0"></span></button>
<p class="note stair-note">台阶尽头，是海。</p>
<svg class="thread sea-thread" viewBox="0 0 101 68" aria-hidden="true"><path d="M5 4C-5 48 22 67 39 51S36 16 26 33s37 39 64 25m-6-4 8 4-9 3"/></svg>
<button class="fragment water" data-photo="0" aria-label="放大海水细节所在的照片"><span class="image" data-scene="0" data-zoom="2.8" data-fx=".04" data-fy=".42"></span></button>
<p class="note sea-note">蓝色，<br>穿到了海里。</p>
<p class="date picnic-date">09.08</p>
<button class="fragment picnic" data-photo="2" aria-label="放大照片：树荫下的两个人"><span class="image" data-scene="3" data-fx=".5" data-fy=".33"></span></button>
<p class="note picnic-note">笑得停不下来。<small>坐在树荫下的下午</small></p>
<button class="fragment table" data-photo="3" aria-label="放大照片：蓝色桌上的柿子"><span class="image" data-scene="1"></span></button>
<button class="fragment cutout fruit" data-cut="0" data-photo="3" aria-label="查看水果碗所在的原照片"><span class="cut-image"></span></button>
<svg class="thread fruit-thread" viewBox="0 0 77 100" aria-hidden="true"><path d="M63 4C66 40 25 33 36 52S62 38 50 29 7 55 8 85m-4-7 4 9 5-7"/></svg>
<p class="note fruit-note">还有，一碗柿子。</p>
<p class="date home-date">09.05</p>
<button class="fragment cutout dog" data-cut="1" data-photo="4" aria-label="查看小狗所在的原照片"><span class="cut-image"></span></button>
<button class="fragment dog-context" data-photo="4" aria-label="放大照片：院子里的小狗"><span class="image" data-scene="2"></span></button>
<svg class="thread dog-thread" viewBox="0 0 62 47" aria-hidden="true"><path d="M57 41C32 44 46 6 7 7m5-4-6 4 6 4"/></svg>
<p class="note dog-note">它也看镜头了。</p>
<button class="fragment branch-context" data-photo="5" aria-label="放大照片：阳光下的枝叶和白花"><span class="image" data-scene="5"></span></button>
<button class="fragment cutout branch" data-cut="2" data-photo="5" aria-label="查看白花所在的原照片"><span class="cut-image"></span></button>
<p class="note branch-note">枝头的小白花</p>
</div></div>
<footer class="canvas-tail"><p>这一页，先留在这里。</p><button id="backTop">回到上面 ↑</button><small>照片、日期、批注和展示状态均为演示示例</small></footer>
</main><div class="page-position" aria-hidden="true"><i id="pageProgress"></i></div>
<dialog class="viewer" id="viewer" aria-labelledby="viewerTitle"><div class="viewer-top"><button id="closeViewer"><iconify-icon icon="lucide:arrow-left"></iconify-icon>收起</button><small id="viewerCount">1 / 6</small></div><header class="viewer-heading"><h2 id="viewerTitle"></h2><p id="viewerDate"></p></header><div class="view-stage" id="viewStage"><div class="view-image" id="viewImage" role="img"></div></div><footer class="viewer-foot"><p class="view-description" id="viewDescription"></p><nav class="viewer-nav" aria-label="浏览画布里的照片"><button id="previousPhoto" aria-label="上一张"><iconify-icon icon="lucide:arrow-left"></iconify-icon></button><div class="dots" id="photoDots"></div><button id="nextPhoto" aria-label="下一张"><iconify-icon icon="lucide:arrow-right"></iconify-icon></button></nav><p class="viewer-sample">示例回忆 · 仅回看已展示内容</p></footer></dialog>
<dialog id="infoSheet" aria-labelledby="infoTitle"><div class="sheet-head"><h2 id="infoTitle"></h2><button data-close>关闭</button></div><p class="sheet-copy" id="infoCopy"></p><div id="infoRows"></div></dialog>
<dialog id="preferenceSheet" aria-labelledby="prefsTitle"><div class="sheet-head"><h2 id="prefsTitle">偏好</h2><button data-close>关闭</button></div><div class="prefs-top"><button class="manage" id="managePrefs">管理偏好</button></div><h3 class="section-title">想多看到什么</h3><p class="preference-note">未选择时，由我们安排。</p><div class="pref-grid" id="topics"></div><h3 class="section-title">不想看到谁</h3><p class="preference-note">默认所有人都可出现，只选择想避开的人。</p><div class="pref-grid" id="people"></div><p class="prefs-note">人物与偏好均为示例。设置只保存在本预览，不改变真实图库或设备。</p></dialog>
<p class="sr" id="announcement" role="status"></p>
<script>
(()=>{
const $=s=>document.querySelector(s),journal=$('#journal'),viewer=$('#viewer'),image=$('#viewImage'),canvas=$('#canvas');
const photos=[{scene:0,title:'海里的蓝色身影',date:'09.12 — 09.13'},{scene:4,title:'通向海边的台阶',date:'09.12 — 09.13'},{scene:3,title:'树荫下的两个人',date:'09.08'},{scene:1,title:'蓝色桌上的柿子',date:'09.08'},{scene:2,title:'院子里的小狗',date:'09.05'},{scene:5,title:'阳光下的枝叶和白花',date:'09.05'}];
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fitCanvas(){const scale=$('#canvasWrap').clientWidth/393;canvas.style.transform=`scale(${scale})`;$('#canvasWrap').style.height=1730*scale+'px';}new ResizeObserver(fitCanvas).observe($('#canvasWrap'));fitCanvas();
function crop(el,scene){const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const tw=Math.max(w,h*.75)*Number(el.dataset.zoom||1),th=tw/.75,fx=Number(el.dataset.fx||.5),fy=Number(el.dataset.fy||.5);el.style.backgroundSize=`${tw*3}px ${th*2}px`;el.style.backgroundPosition=`${-(scene%3*tw+(tw-w)*fx)}px ${-(Math.floor(scene/3)*th+(th-h)*fy)}px`;el.dataset.scene=scene;}
const cropObserver=new ResizeObserver(entries=>entries.forEach(e=>{if(e.target.dataset.scene!==undefined)crop(e.target,Number(e.target.dataset.scene));}));document.querySelectorAll('.image').forEach(el=>cropObserver.observe(el));cropObserver.observe(image);
let index=0,returnScroll=0,opener=null,drag=null;
function render(){const p=photos[index];$('#viewerTitle').textContent=p.title;$('#viewerDate').textContent=p.date+' · 示例回忆';$('#viewerCount').textContent=`${index+1} / ${photos.length}`;$('#viewDescription').textContent='';image.dataset.scene=p.scene;image.setAttribute('aria-label','示例照片：'+p.title);crop(image,p.scene);$('#previousPhoto').disabled=index===0;$('#nextPhoto').disabled=index===photos.length-1;viewer.dataset.index=index;$('#photoDots').innerHTML='';photos.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`查看第${i+1}张`);b.setAttribute('aria-current',String(i===index));b.innerHTML='<i></i>';b.onclick=()=>change(i);$('#photoDots').appendChild(b);});$('#announcement').textContent=p.title;}
function sizeFull(){const h=$('#viewStage').clientHeight,w=Math.min($('#viewStage').clientWidth-46,h*.75);image.style.width=Math.max(1,w)+'px';image.style.height=Math.max(1,w/.75)+'px';crop(image,photos[index].scene);}
function change(next){next=Math.max(0,Math.min(photos.length-1,next));image.classList.remove('is-dragging');if(next===index){image.style.transform='';return;}const dir=next>index?1:-1;index=next;image.style.transition='none';image.style.transform=`translateX(${reduced?0:dir*24}px)`;image.style.opacity=reduced?'1':'.55';render();requestAnimationFrame(()=>requestAnimationFrame(()=>{image.style.transition='';image.style.transform='';image.style.opacity='1';}));}
document.querySelectorAll('.fragment[data-photo]').forEach(b=>b.addEventListener('click',()=>{index=Number(b.dataset.photo);opener=b;returnScroll=journal.scrollTop;render();viewer.showModal();sizeFull();}));
$('#closeViewer').onclick=()=>viewer.close();viewer.addEventListener('close',()=>{drag=null;image.style.transform='';image.classList.remove('is-dragging');journal.scrollTop=returnScroll;opener?.focus({preventScroll:true});});
$('#previousPhoto').onclick=()=>change(index-1);$('#nextPhoto').onclick=()=>change(index+1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(index+(e.key==='ArrowLeft'?-1:1));}});
image.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,moved:false};});image.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dy)>Math.abs(dx)+8){drag=null;return;}if(!drag.moved&&Math.abs(dx)<7)return;drag.moved=true;drag.dx=dx;image.setPointerCapture(e.pointerId);image.classList.add('is-dragging');image.style.transform=`translateX(${dx*.6}px) rotate(${dx*.008}deg)`;});
function release(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;image.classList.remove('is-dragging');if(image.hasPointerCapture(e.pointerId))image.releasePointerCapture(e.pointerId);if(!cancel&&Math.abs(d.dx)>45)change(index+(d.dx<0?1:-1));else image.style.transform='';}
image.addEventListener('pointerup',e=>release(e));image.addEventListener('pointercancel',e=>release(e,true));new ResizeObserver(()=>{if(viewer.open)sizeFull();}).observe($('#viewStage'));
$('#backTop').onclick=()=>journal.scrollTo({top:0,behavior:reduced?'instant':'smooth'});
journal.addEventListener('scroll',()=>{const p=journal.scrollTop/Math.max(1,journal.scrollHeight-journal.clientHeight);$('#pageProgress').style.setProperty('--progress',p*49+'px');},{passive:true});
const infos={connection:['照片墙连接','连接状态会常驻首页。这是演示连接，未连接到真实照片墙。',[['客厅的照片墙','示例设备'],['设备回执','本 Demo 未接入']]],settings:['设置','设备与账户管理，与偏好保持同级入口。',[['设备管理','1 台示例设备'],['账户','演示账户'],['照片权限','示例授权状态']]]};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='preferences'){renderPrefs(false);$('#preferenceSheet').showModal();return;}const info=infos[b.dataset.open];$('#infoTitle').textContent=info[0];$('#infoCopy').textContent=info[1];$('#infoRows').innerHTML=info[2].map(([a,v])=>`<div class="sheet-row"><span>${a}</span><span>${v}</span></div>`).join('');$('#infoSheet').showModal();});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
let saved={topics:[],excluded:[]},draft,editing=false;try{const v=JSON.parse(localStorage.getItem('echooo-canvas-v2-prefs')||'null');if(v&&Array.isArray(v.topics)&&Array.isArray(v.excluded))saved=v;}catch{}
function renderPrefs(edit){editing=edit;draft=JSON.parse(JSON.stringify(saved));$('#preferenceSheet').classList.toggle('editing',edit);$('#managePrefs').textContent=edit?'保存':'管理偏好';for(const [id,key,names] of [['topics','topics',['家人朋友','小动物','一起出游','自然风景','日常生活','节日聚会']],['people','excluded',['人物 1（示例）','人物 2（示例）']]]){const host=$('#'+id);host.innerHTML='';names.forEach((name,i)=>{const label=document.createElement('label');label.className='pref';label.dataset.selected=String(draft[key].includes(i));label.innerHTML=`<span>${name}</span><input type="checkbox" ${draft[key].includes(i)?'checked':''} ${edit?'':'disabled'}>`;label.querySelector('input').onchange=e=>{draft[key]=e.target.checked?[...draft[key],i]:draft[key].filter(n=>n!==i);label.dataset.selected=String(e.target.checked);};host.appendChild(label);});}}
$('#managePrefs').onclick=()=>{if(!editing)renderPrefs(true);else{saved=draft;try{localStorage.setItem('echooo-canvas-v2-prefs',JSON.stringify(saved));}catch{}renderPrefs(false);}};
})();
</script>
