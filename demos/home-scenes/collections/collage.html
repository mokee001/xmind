dialog{border:0;background:var(--paper);color:var(--ink);width:calc(100% - 28px);max-width:360px;max-height:85dvh;padding:24px;overflow:auto;border-radius:16px;box-shadow:0 20px 80px #111b2020}dialog::backdrop{background:#18241c55;backdrop-filter:blur(6px)}.sheet-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.sheet-head h2{margin:0;font-size:23px;letter-spacing:-.7px;font-weight:550}.sheet-head button{min-height:44px;min-width:44px;font-size:12px}.sheet-copy{font-size:12px;line-height:1.85;color:#717c67;margin:0 0 20px}.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;min-height:53px;border-bottom:1px solid #e5e8de}.sheet-row span:last-child{font-size:11px;color:#808a76}.prefs-top{display:flex;justify-content:flex-end;margin:-6px 0 20px}.manage{font-size:12px;background:#20271e;color:#fff;min-height:40px;padding:0 15px;border-radius:22px}.section-title{font-size:14px;margin:24px 0 8px;font-weight:550}.preference-note{font-size:11px;line-height:1.7;color:#838c79;margin:0 0 12px}.pref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pref{font-size:12px;min-height:45px;display:flex;align-items:center;justify-content:space-between;gap:5px;background:#f0f1ea;border-radius:8px;padding:9px 12px;cursor:default}.pref[data-selected=true]{background:#e4ecda}.pref input{accent-color:#547140;display:none}.editing .pref{cursor:pointer}.editing .pref input{display:inline-block}.prefs-note{font-size:10px;line-height:1.8;color:#92998a;margin-top:25px}
.viewer{position:fixed;inset:0;margin:0 auto;width:min(100%,480px);height:100dvh;max-height:100dvh;max-width:480px;padding:0;border-radius:0;overflow:hidden;box-shadow:none;background:#faf9f6}.viewer[open]{display:flex;flex-direction:column;animation:reveal 280ms var(--ease)}.viewer-top{padding:17px 23px 0;display:flex;align-items:center;justify-content:space-between;flex:none;gap:15px}.viewer-top button{display:flex;align-items:center;min-height:44px;gap:6px;font-size:12px}.viewer-top iconify-icon{font-size:16px}.viewer-top small{font-size:10px;color:#959c8a}.viewer-heading{padding:13px 26px 16px;flex:none}.viewer-heading h2{font-size:27px;letter-spacing:-1px;font-weight:600;margin:0 0 7px}.viewer-heading p{font-size:11px;color:#8b9380;margin:0}.view-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y;display:flex;align-items:center;justify-content:center}.view-image{width:calc(100% - 46px);aspect-ratio:3/4;background-image:url('../studies/assets/life-scenes.png');background-repeat:no-repeat;flex:none;will-change:transform;transition:transform 350ms var(--ease),opacity 300ms;cursor:grab}.view-image.is-dragging{transition:none;cursor:grabbing}.viewer-foot{padding:16px 26px 26px;flex:none}.view-description{font-size:12px;margin:0 0 10px}.viewer-nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.viewer-nav button{min-width:44px;min-height:44px;font-size:12px;display:flex;align-items:center;justify-content:center}.viewer-nav .dots{display:flex;align-items:center;gap:3px}.dots button{min-width:28px;min-height:40px}.dots i{display:block;width:4px;height:4px;border-radius:50%;background:#c1c9b5;transition:width 200ms}.dots button[aria-current=true] i{width:16px;border-radius:4px;background:#3a4b2b}.viewer-sample{font-size:9px;color:#949e89;margin:7px 0 0;text-align:center}.viewer-nav iconify-icon{font-size:19px}@keyframes reveal{from{opacity:.3;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:350px){.topbar{padding-left:17px;padding-right:14px}.intro{padding-left:20px;padding-right:20px}.intro h1{font-size:23px}.chapter-heading h2{font-size:27px}.collage{height:457px}.seaside .p0{height:251px}.seaside .p1{height:143px}.seaside .p2{top:224px;height:171px}.seaside .annotation{top:348px}.seaside .scribble{top:116px;left:41%;width:78px}.picnic .collage{height:467px}.picnic .p0{height:250px}.picnic .p1{height:193px}.picnic .p2{top:278px;height:146px}.picnic .annotation{top:379px;left:53%}.home .collage{height:433px}.home .p0{height:240px}.home .p1{top:245px;height:164px}.home .p2{top:200px;height:145px}.home .annotation{top:344px}.chapter{margin-bottom:28px}.chapter-heading .when{font-size:9px}.photo .caption{font-size:10px}.viewer-heading h2{font-size:24px}.viewer-top{padding-top:8px}.viewer-foot{padding-bottom:16px}}@media(prefers-reduced-motion:reduce){.journal{scroll-behavior:auto}.photo,.view-image,.dots i{transition:none}.viewer[open]{animation:none}dialog::backdrop{backdrop-filter:none}}
</style>

<body>
<div class="app" id="app">
<main class="journal" id="journal" aria-label="按内容回看已展示的回忆">
<header class="topbar"><button class="connection" data-open="connection"><i></i>已连接 <small>· 示例</small></button><div class="top-actions"><button data-open="preferences">偏好</button><button data-open="settings" aria-label="设置"><iconify-icon icon="lucide:settings-2"></iconify-icon><span class="fallback">设置</span></button></div></header>
<div class="intro"><h1>回忆</h1><p>屏幕上留下的片刻</p></div>
<section class="chapter seaside" id="seaside" aria-labelledby="title-seaside">
<header class="chapter-heading"><p class="when">9月12—13日</p><h2 id="title-seaside">海边的周末</h2><span class="short-line" aria-hidden="true"></span></header>
<div class="collage">
<button class="photo p0" data-group="0" data-photo="0" aria-label="看海边的周末，海里的蓝色身影"><span class="image" data-scene="0"></span><span class="caption">海风，和蓝色。</span></button>
<button class="photo p1" data-group="0" data-photo="1" aria-label="看海边的周末，沿着阶梯走向海"><span class="image" data-scene="4"></span><span class="caption">沿着海走</span></button>
<button class="photo p2" data-group="0" data-photo="2" aria-label="看海边的周末，抬头看到枝叶"><span class="image" data-scene="5"></span><span class="caption">抬头看一眼</span></button>
<svg class="scribble" viewBox="0 0 100 105" aria-hidden="true"><path d="M11 92C8 56 15 27 37 22S70 40 60 49 38 38 55 25 84 13 91 9M83 8l9 0-1 10"/></svg>
<span class="annotation" aria-hidden="true">周末的颜色<strong>是蓝色。</strong></span>
</div><div class="chapter-footer"><button class="open-chapter" data-group="0" data-photo="0"><span>看看这段回忆</span><iconify-icon icon="lucide:arrow-up-right" aria-hidden="true"></iconify-icon></button></div>
</section>
<section class="chapter picnic" id="picnic" aria-labelledby="title-picnic">
<header class="chapter-heading"><p class="when">9月8日</p><h2 id="title-picnic">一起吃顿饭</h2><span class="short-line" aria-hidden="true"></span></header>
<div class="collage">
<button class="photo p0" data-group="1" data-photo="0" aria-label="看一起吃顿饭，草坪上的两个人"><span class="image" data-scene="3"></span><span class="caption">坐下来，聊聊天。</span></button>
<button class="photo p1" data-group="1" data-photo="1" aria-label="看一起吃顿饭，桌上的水果"><span class="image" data-scene="1"></span><span class="caption">水果准备好了</span></button>
<button class="photo p2" data-group="1" data-photo="2" aria-label="看一起吃顿饭，枝叶下的阳光"><span class="image" data-scene="5"></span><span class="caption">有一点阳光</span></button>
<svg class="scribble" viewBox="0 0 110 45" aria-hidden="true"><path d="M4 28C24 4 50 8 47 27S19 38 28 18 76 7 101 17M91 10l12 7-12 4"/></svg>
<span class="annotation" aria-hidden="true">一桌水果，<strong>一起分享。</strong></span>
</div><div class="chapter-footer"><button class="open-chapter" data-group="1" data-photo="0"><span>看看这段回忆</span><iconify-icon icon="lucide:arrow-up-right" aria-hidden="true"></iconify-icon></button></div>
</section>
<section class="chapter home" id="home" aria-labelledby="title-home">
<header class="chapter-heading"><p class="when">9月5日</p><h2 id="title-home">在家的小事</h2><span class="short-line" aria-hidden="true"></span></header>
<div class="collage">
<button class="photo p0" data-group="2" data-photo="0" aria-label="看在家的小事，院子里的小狗"><span class="image" data-scene="2"></span><span class="caption">它也在看你。</span></button>
<button class="photo p1" data-group="2" data-photo="1" aria-label="看在家的小事，蓝色桌上的水果"><span class="image" data-scene="1"></span><span class="caption">一点甜</span></button>
<button class="photo p2" data-group="2" data-photo="2" aria-label="看在家的小事，院子里的枝叶"><span class="image" data-scene="5"></span><span class="caption">一点绿</span></button>
<span class="annotation" aria-hidden="true">小小的，<strong>日常。</strong></span>
</div><div class="chapter-footer"><button class="open-chapter" data-group="2" data-photo="0"><span>看看这段回忆</span><iconify-icon icon="lucide:arrow-up-right" aria-hidden="true"></iconify-icon></button></div>
</section>
<footer class="end-note"><p>回忆，慢慢留下。</p><button id="backTop">回到上面</button><p class="demo">照片、文字与展示记录均为演示示例</p></footer>
</main>
<dialog class="viewer" id="viewer" aria-labelledby="viewerTitle"><div class="viewer-top"><button id="closeViewer"><iconify-icon icon="lucide:arrow-left"></iconify-icon>收起</button><small id="viewerCount">1 / 3</small></div><header class="viewer-heading"><h2 id="viewerTitle"></h2><p id="viewerDate"></p></header><div class="view-stage" id="viewStage"><div class="view-image" id="viewImage" role="img"></div></div><footer class="viewer-foot"><p class="view-description" id="viewDescription"></p><nav class="viewer-nav" aria-label="浏览这段回忆"><button id="previousPhoto" aria-label="上一张"><iconify-icon icon="lucide:arrow-left"></iconify-icon></button><div class="dots" id="photoDots"></div><button id="nextPhoto" aria-label="下一张"><iconify-icon icon="lucide:arrow-right"></iconify-icon></button></nav><p class="viewer-sample">示例回忆 · 仅回看已展示内容</p></footer></dialog>
<dialog id="infoSheet" aria-labelledby="infoTitle"><div class="sheet-head"><h2 id="infoTitle"></h2><button data-close>关闭</button></div><p class="sheet-copy" id="infoCopy"></p><div id="infoRows"></div></dialog>
<dialog id="preferenceSheet" aria-labelledby="prefsTitle"><div class="sheet-head"><h2 id="prefsTitle">偏好</h2><button data-close>关闭</button></div><div class="prefs-top"><button class="manage" id="managePrefs">管理偏好</button></div><h3 class="section-title">想多看到什么</h3><p class="preference-note">未选择时，由我们安排。</p><div class="pref-grid" id="topics"></div><h3 class="section-title">不想看到谁</h3><p class="preference-note">默认所有人都可出现，只选择想避开的人。</p><div class="pref-grid" id="people"></div><p class="prefs-note">人物与偏好均为示例。设置只保存在本预览，不改变真实图库或设备。</p></dialog>
<p class="sr" id="announcement" role="status"></p>
<script>
(()=>{
const $=s=>document.querySelector(s),journal=$('#journal'),viewer=$('#viewer'),image=$('#viewImage');
const groups=[{title:'海边的周末',date:'9月12—13日',scenes:[0,4,5],captions:['海里的蓝色身影','沿着阶梯，走向海边','抬头看到的枝叶']},{title:'一起吃顿饭',date:'9月8日',scenes:[3,1,5],captions:['坐下来，一起聊聊天','桌上的水果','枝叶下的阳光']},{title:'在家的小事',date:'9月5日',scenes:[2,1,5],captions:['院子里的小狗','蓝色桌上的水果','一点绿色']}];
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function crop(el,scene){const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const tw=Math.max(w,h*.75),th=tw/.75;el.style.backgroundSize=`${tw*3}px ${th*2}px`;el.style.backgroundPosition=`${-(scene%3*tw+(tw-w)/2)}px ${-(Math.floor(scene/3)*th+(th-h)/2)}px`;el.dataset.scene=scene;}
const cropObserver=new ResizeObserver(entries=>entries.forEach(e=>{if(e.target.dataset.scene!==undefined)crop(e.target,Number(e.target.dataset.scene));}));document.querySelectorAll('.image').forEach(el=>cropObserver.observe(el));cropObserver.observe(image);
let group=0,index=0,returnScroll=0,opener=null,drag=null,transitionTimer=null;
function render(){const g=groups[group];$('#viewerTitle').textContent=g.title;$('#viewerDate').textContent=g.date+' · 已展示的示例回忆';$('#viewerCount').textContent=`${index+1} / ${g.scenes.length}`;$('#viewDescription').textContent=g.captions[index];image.dataset.scene=g.scenes[index];image.setAttribute('aria-label','示例照片：'+g.captions[index]);crop(image,g.scenes[index]);$('#previousPhoto').disabled=index===0;$('#nextPhoto').disabled=index===g.scenes.length-1;viewer.dataset.group=group;viewer.dataset.index=index;$('#photoDots').innerHTML='';g.scenes.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`查看第${i+1}张`);b.setAttribute('aria-current',String(i===index));b.innerHTML='<i></i>';b.onclick=()=>change(i);$('#photoDots').appendChild(b);});$('#announcement').textContent=g.title+'，'+g.captions[index];}
function sizeFull(){const h=$('#viewStage').clientHeight,w=Math.min($('#viewStage').clientWidth-46,h*.75);image.style.width=Math.max(1,w)+'px';image.style.height=Math.max(1,w/.75)+'px';crop(image,groups[group].scenes[index]);}
function change(next){next=Math.max(0,Math.min(groups[group].scenes.length-1,next));clearTimeout(transitionTimer);image.classList.remove('is-dragging');if(next===index){image.style.transform='';return;}const dir=next>index?1:-1;index=next;image.style.transition='none';image.style.transform=`translateX(${reduced?0:dir*24}px)`;image.style.opacity=reduced?'1':'.55';render();requestAnimationFrame(()=>requestAnimationFrame(()=>{image.style.transition='';image.style.transform='';image.style.opacity='1';}));}
document.querySelectorAll('[data-group]').forEach(b=>b.addEventListener('click',()=>{group=Number(b.dataset.group);index=Number(b.dataset.photo);opener=b;returnScroll=journal.scrollTop;render();viewer.showModal();sizeFull();}));
$('#closeViewer').onclick=()=>viewer.close();viewer.addEventListener('close',()=>{drag=null;image.style.transform='';image.classList.remove('is-dragging');journal.scrollTop=returnScroll;opener?.focus({preventScroll:true});});
$('#previousPhoto').onclick=()=>change(index-1);$('#nextPhoto').onclick=()=>change(index+1);viewer.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();change(index+(e.key==='ArrowLeft'?-1:1));}});
image.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,moved:false};});image.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dy)>Math.abs(dx)+8){drag=null;return;}if(!drag.moved&&Math.abs(dx)<7)return;drag.moved=true;drag.dx=dx;image.setPointerCapture(e.pointerId);image.classList.add('is-dragging');image.style.transform=`translateX(${dx*.6}px) rotate(${dx*.008}deg)`;});
function release(e,cancel=false){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;image.classList.remove('is-dragging');if(image.hasPointerCapture(e.pointerId))image.releasePointerCapture(e.pointerId);if(!cancel&&Math.abs(d.dx)>45)change(index+(d.dx<0?1:-1));else image.style.transform='';}
image.addEventListener('pointerup',e=>release(e));image.addEventListener('pointercancel',e=>release(e,true));new ResizeObserver(()=>{if(viewer.open)sizeFull();}).observe($('#viewStage'));
$('#backTop').onclick=()=>journal.scrollTo({top:0,behavior:reduced?'instant':'smooth'});
const infos={connection:['照片墙连接','连接状态会常驻首页。这是演示连接，未连接到真实照片墙。',[['客厅的照片墙','示例设备'],['设备回执','本 Demo 未接入']]],settings:['设置','设备与账户管理，与偏好保持同级入口。',[['设备管理','1 台示例设备'],['账户','演示账户'],['照片权限','示例授权状态']]]};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='preferences'){renderPrefs(false);$('#preferenceSheet').showModal();return;}const info=infos[b.dataset.open];$('#infoTitle').textContent=info[0];$('#infoCopy').textContent=info[1];$('#infoRows').innerHTML=info[2].map(([a,v])=>`<div class="sheet-row"><span>${a}</span><span>${v}</span></div>`).join('');$('#infoSheet').showModal();});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
let saved={topics:[],excluded:[]},draft,editing=false;try{const v=JSON.parse(localStorage.getItem('echooo-collage-v1-prefs')||'null');if(v&&Array.isArray(v.topics)&&Array.isArray(v.excluded))saved=v;}catch{}
function renderPrefs(edit){editing=edit;draft=JSON.parse(JSON.stringify(saved));$('#preferenceSheet').classList.toggle('editing',edit);$('#managePrefs').textContent=edit?'保存':'管理偏好';for(const [id,key,names] of [['topics','topics',['家人朋友','小动物','一起出游','自然风景','日常生活','节日聚会']],['people','excluded',['人物 1（示例）','人物 2（示例）']]]){const host=$('#'+id);host.innerHTML='';names.forEach((name,i)=>{const label=document.createElement('label');label.className='pref';label.dataset.selected=String(draft[key].includes(i));label.innerHTML=`<span>${name}</span><input type="checkbox" ${draft[key].includes(i)?'checked':''} ${edit?'':'disabled'}>`;label.querySelector('input').onchange=e=>{draft[key]=e.target.checked?[...draft[key],i]:draft[key].filter(n=>n!==i);label.dataset.selected=String(e.target.checked);};host.appendChild(label);});}}
$('#managePrefs').onclick=()=>{if(!editing)renderPrefs(true);else{saved=draft;try{localStorage.setItem('echooo-collage-v1-prefs',JSON.stringify(saved));}catch{}renderPrefs(false);}};
})();
</script>
