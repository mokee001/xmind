<script>
const quietMath={clamp:(value,min,max)=>Math.min(max,Math.max(min,value)),cover:(width,height,scene)=>{const tileW=1330/3,tileH=1182/2,scale=Math.max(width/tileW,height/tileH);return{width:1330*scale,height:1182*scale,x:-(scene%3)*tileW*scale-(tileW*scale-width)/2,y:-Math.floor(scene/3)*tileH*scale-(tileH*scale-height)/2};}};
document.addEventListener('DOMContentLoaded',()=>{
 const groups=[{id:'sea',title:'海边的周末',date:'9月12—13日',photos:[0,4,5]},{id:'meal',title:'一起吃顿饭',date:'9月8日',photos:[3,1,5]},{id:'home',title:'在家的小事',date:'9月5日',photos:[2,1,5]}];
 const descriptions=['海水中的蓝衣身影','蓝桌上的柿子','阳光下的小白狗','树下相伴的午后','通往海边的阶梯','蓝天下的枝叶'];
 const root=document.querySelector('.app'),gallery=document.querySelector('.collections'),dialog=document.querySelector('.deck-dialog'),canvas=document.querySelector('.viewer-canvas'),viewerCards=[...document.querySelectorAll('.viewer-card')],preferences=document.querySelector('.preferences'),settings=document.querySelector('.settings'),connection=document.querySelector('.connection-sheet');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)');
 let activeGroup=0,current=0,origin=null,savedScroll=0,drag=null,pending=null,transitionTimer=null,openingAnimation=null,closing=false;
 let saved={topics:['家人朋友','宠物','旅行','自然风景','日常生活','节日聚会'],excluded:[]},draft=null,editing=false;
 try{const data=JSON.parse(localStorage.getItem('quiet-collections-prefs-v1')||'null');if(data&&Array.isArray(data.topics)&&Array.isArray(data.excluded))saved=data;}catch{}
 function crop(element,scene){const w=element.clientWidth,h=element.clientHeight;if(!w||!h||scene===undefined)return;const c=quietMath.cover(w,h,scene);element.style.backgroundSize=`${c.width}px ${c.height}px`;element.style.backgroundPosition=`${c.x}px ${c.y}px`;element.dataset.scene=scene;}
 const cropObserver=new ResizeObserver(entries=>entries.forEach(entry=>{const element=entry.target;if(element.dataset.scene!==undefined)crop(element,Number(element.dataset.scene));}));
 groups.forEach((group,index)=>{const section=document.createElement('section');section.className='collection';section.setAttribute('aria-labelledby','group-title-'+group.id);const button=document.createElement('button');button.type='button';button.className='deck-button';button.dataset.group=group.id;button.setAttribute('aria-label',`打开示例回忆：${group.title}，${group.date}`);[2,1,0].forEach(depth=>{const photo=document.createElement('span');photo.className='deck-photo depth-'+depth;photo.setAttribute('aria-hidden','true');photo.dataset.scene=group.photos[depth];button.appendChild(photo);cropObserver.observe(photo);});section.appendChild(button);const label=document.createElement('div');label.className='collection-label';label.innerHTML=`<h2 id="group-title-${group.id}">${group.title}</h2><p>${group.date}</p>`;section.appendChild(label);gallery.appendChild(section);button.addEventListener('click',()=>openGroup(index,button));});
 viewerCards.forEach(card=>cropObserver.observe(card));
 function drawViewer(){
   const group=groups[activeGroup];root.dataset.group=group.id;root.dataset.photo=current;
   viewerCards.forEach((card,i)=>{card.dataset.depth=(i-current+3)%3;card.style.removeProperty('transform');card.style.removeProperty('opacity');crop(card,group.photos[i]);card.setAttribute('aria-hidden',String(i!==current));card.setAttribute('aria-label','示例照片：'+descriptions[group.photos[i]]);});
   document.querySelector('.photo-index').textContent=`${current+1} / ${group.photos.length}`;
   document.querySelector('.previous-photo').disabled=current===0;document.querySelector('.next-photo').disabled=current===group.photos.length-1;
   canvas.setAttribute('aria-label',`${group.title}，第${current+1}张，共3张示例照片。左右轻拨或按左右方向键翻看。`);
   document.querySelector('.announcement').textContent=`${group.title}，第${current+1}张，${descriptions[group.photos[current]]}`;
 }
 function finishPending(){if(transitionTimer)clearTimeout(transitionTimer);transitionTimer=null;if(pending!==null){current=pending;pending=null;}canvas.classList.remove('is-dragging');drawViewer();}
 function openGroup(groupIndex,button){
   activeGroup=groupIndex;current=0;origin=button;savedScroll=window.scrollY;closing=false;drag=null;pending=null;
   const from=button.getBoundingClientRect(),group=groups[groupIndex];document.querySelector('.viewer-meta h2').textContent=group.title;document.querySelector('.viewer-meta p').textContent=group.date+' · 演示展示时间';dialog.showModal();drawViewer();
   if(!reduce.matches){const to=canvas.getBoundingClientRect();openingAnimation=canvas.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width})`,opacity:.5},{transform:'none',opacity:1}],{duration:320,easing:'cubic-bezier(.2,.7,.2,1)'});}
 }
 function closeViewer(){
   if(closing)return;closing=true;drag=null;finishPending();openingAnimation?.cancel();
   if(reduce.matches||!origin){dialog.close();return;}
   const from=canvas.getBoundingClientRect(),to=origin.getBoundingClientRect();const animation=canvas.animate([{transform:'none',opacity:1},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) scale(${to.width/from.width})`,opacity:.35}],{duration:240,easing:'cubic-bezier(.4,0,.7,.6)'});animation.onfinish=()=>dialog.close();
 }
 function goBy(direction){
   if(closing)return;finishPending();const target=quietMath.clamp(current+direction,0,2);if(target===current)return;
   if(reduce.matches){current=target;drawViewer();return;}
   pending=target;const card=viewerCards[current];card.style.transform=`translateX(${-direction*canvas.clientWidth*1.06}px) rotate(${-direction*7}deg)`;card.style.opacity='0';transitionTimer=setTimeout(finishPending,230);
 }
 document.querySelector('.previous-photo').addEventListener('click',()=>goBy(-1));document.querySelector('.next-photo').addEventListener('click',()=>goBy(1));
 document.querySelectorAll('[data-close-viewer]').forEach(button=>button.addEventListener('click',closeViewer));dialog.addEventListener('cancel',event=>{event.preventDefault();closeViewer();});
 dialog.addEventListener('close',()=>{closing=false;drag=null;finishPending();window.scrollTo({top:savedScroll,behavior:'instant'});origin?.focus({preventScroll:true});});
 canvas.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();goBy(-1);}if(event.key==='ArrowRight'){event.preventDefault();goBy(1);}if(event.key==='Home'){event.preventDefault();finishPending();current=0;drawViewer();}if(event.key==='End'){event.preventDefault();finishPending();current=2;drawViewer();}});
 canvas.addEventListener('pointerdown',event=>{if(event.button!==0||closing)return;finishPending();drag={id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,moved:false,blocked:false,start:performance.now()};});
 canvas.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId||drag.blocked)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(!drag.moved&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){drag.blocked=true;return;}if(!drag.moved&&Math.abs(dx)<7)return;if(!drag.moved){drag.moved=true;canvas.classList.add('is-dragging');canvas.setPointerCapture(event.pointerId);}drag.dx=dx;const edge=(current===0&&dx>0)||(current===2&&dx<0),travel=edge?dx*.2:dx;viewerCards[current].style.transform=`translateX(${travel}px) rotate(${travel/canvas.clientWidth*6}deg)`;viewerCards[current].style.opacity=String(1-Math.min(Math.abs(travel)/canvas.clientWidth*.28,.35));event.preventDefault();});
 canvas.addEventListener('pointerup',event=>{if(!drag||drag.id!==event.pointerId)return;const gesture=drag;drag=null;canvas.classList.remove('is-dragging');if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);if(gesture.moved){const fast=Math.abs(gesture.dx)/(performance.now()-gesture.start)>.42;if(Math.abs(gesture.dx)>48||Math.abs(gesture.dx)>24&&fast)goBy(gesture.dx<0?1:-1);else drawViewer();}});
 function cancelGesture(event){if(!drag||event&&event.pointerId!==undefined&&event.pointerId!==drag.id)return;drag=null;canvas.classList.remove('is-dragging');drawViewer();}
 canvas.addEventListener('pointercancel',cancelGesture);canvas.addEventListener('lostpointercapture',cancelGesture);window.addEventListener('blur',()=>cancelGesture());
 function addOption(label,kind){const row=document.createElement('label');row.className='preference-option';row.dataset.kind=kind;row.dataset.value=label;row.innerHTML=`<span class="option-label">${label}</span><input type="checkbox" aria-label="${kind==='people'?'不展示':'优先展示'}${label}">`;row.querySelector('input').addEventListener('change',event=>{if(!editing)return;const key=kind==='people'?'excluded':'topics';draft[key]=event.target.checked?[...new Set([...draft[key],label])]:draft[key].filter(item=>item!==label);row.dataset.on=String(event.target.checked);updatePeopleSummary();});document.querySelector(kind==='people'?'.people-options':'.topic-options').appendChild(row);}
 ['家人朋友','宠物','旅行','自然风景','日常生活','节日聚会'].forEach(label=>addOption(label,'topics'));['人物 1（示例）','人物 2（示例）'].forEach(label=>addOption(label,'people'));
 function updatePeopleSummary(){const value=editing?draft:saved;document.querySelector('.people-summary').textContent=value.excluded.length?`已选择 ${value.excluded.length} 位不希望展示的人物`:'默认全部允许，没有排除人物';}
 function paintPreferences(){const value=editing?draft:saved;preferences.dataset.editing=String(editing);document.querySelector('.manage-preferences').textContent=editing?'保存':'管理';preferences.querySelectorAll('.preference-option').forEach(row=>{const on=value[row.dataset.kind==='people'?'excluded':'topics'].includes(row.dataset.value);row.dataset.on=String(on);const input=row.querySelector('input');input.checked=on;input.disabled=!editing;});updatePeopleSummary();}
 document.querySelector('[data-open-preferences]').addEventListener('click',()=>{editing=false;draft=null;document.querySelector('.save-note').textContent='';paintPreferences();preferences.showModal();});
 document.querySelector('.manage-preferences').addEventListener('click',()=>{if(editing){saved={topics:[...draft.topics],excluded:[...draft.excluded]};try{localStorage.setItem('quiet-collections-prefs-v1',JSON.stringify(saved));}catch{}editing=false;draft=null;document.querySelector('.save-note').textContent='已保存 · 仅此 Demo';}else{editing=true;draft={topics:[...saved.topics],excluded:[...saved.excluded]};document.querySelector('.save-note').textContent='';}paintPreferences();});preferences.addEventListener('close',()=>{editing=false;draft=null;});
 function settingsHome(){document.querySelector('.settings-title').textContent='设置';document.querySelector('.settings-home').hidden=false;document.querySelector('.settings-detail').hidden=true;document.querySelector('.settings-back').hidden=true;}
 const details={device:{title:'照片墙',rows:[['设备名称','客厅照片墙 · 示例'],['连接状态','演示连接'],['展示记录','本地示例回忆']]},account:{title:'账户',rows:[['账户','体验账号'],['同步','仅此 Demo'],['真实数据','未读取']]},scope:{title:'照片范围',rows:[['照片来源','演示素材'],['本机相册','未读取'],['访问权限','由正式 App 管理']]}};
 document.querySelector('[data-open-settings]').addEventListener('click',()=>{settingsHome();settings.showModal();});document.querySelector('.settings-back').addEventListener('click',settingsHome);
 document.querySelectorAll('[data-setting]').forEach(button=>button.addEventListener('click',()=>{const data=details[button.dataset.setting];document.querySelector('.settings-title').textContent=data.title;document.querySelector('.settings-home').hidden=true;document.querySelector('.settings-detail').hidden=false;document.querySelector('.settings-back').hidden=false;document.querySelector('.settings-detail').innerHTML=data.rows.map(([label,value])=>`<div class="detail-line"><strong>${label}</strong><span>${value}</span></div>`).join('');}));
 document.querySelector('.connection').addEventListener('click',()=>connection.showModal());document.querySelectorAll('[data-close-sheet]').forEach(button=>button.addEventListener('click',()=>button.closest('dialog').close()));
 [preferences,settings,connection].forEach(sheet=>sheet.addEventListener('click',event=>{if(event.target!==sheet)return;const r=sheet.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)sheet.close();}));
});
</script>
</head>
<body>
<div class="app">
 <header class="topbar"><button class="connection" type="button"><i aria-hidden="true"></i>已连接 · 示例</button><div class="top-actions"><button type="button" data-open-preferences>偏好</button><button type="button" data-open-settings aria-label="设置"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:settings"></iconify-icon><span class="fallback">⚙</span></span></button></div></header>
 <main><div class="intro"><h1>回忆</h1><p>已经展示过的生活片段</p></div><div class="collections" aria-label="示例回忆集合"></div><p class="page-note">示例回忆 · 日期为演示展示时间</p></main>
 <p class="announcement sr-only" role="status"></p>
 <dialog class="deck-dialog" aria-labelledby="viewer-title"><div class="viewer-toolbar"><button class="back-to-memories" type="button" data-close-viewer><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:chevron-left"></iconify-icon><span class="fallback">‹</span></span>回忆</button><button class="close-viewer" type="button" data-close-viewer aria-label="收起回忆，返回原位置"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:x"></iconify-icon><span class="fallback">×</span></span></button></div><div class="viewer-meta"><h2 id="viewer-title"></h2><p></p></div><div class="viewer-canvas" tabindex="0" role="group" aria-label="左右轻拨翻看这组示例照片"><div class="viewer-card" data-depth="0" role="img"></div><div class="viewer-card" data-depth="1" role="img" aria-hidden="true"></div><div class="viewer-card" data-depth="2" role="img" aria-hidden="true"></div></div><nav class="viewer-controls" aria-label="翻看组内照片"><button class="previous-photo" type="button" aria-label="上一张示例照片" disabled><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:arrow-left"></iconify-icon><span class="fallback">←</span></span></button><span class="photo-index">1 / 3</span><button class="next-photo" type="button" aria-label="下一张示例照片"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:arrow-right"></iconify-icon><span class="fallback">→</span></span></button></nav><p class="viewer-hint">左右轻拨，翻看这组回忆</p></dialog>
 <dialog class="sheet preferences" data-editing="false" aria-labelledby="preferences-title"><div class="sheet-header"><h2 id="preferences-title">偏好</h2><div class="pref-tools"><button class="manage-preferences" type="button">管理</button><button class="sheet-close" type="button" data-close-sheet aria-label="关闭偏好"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:x"></iconify-icon><span class="fallback">×</span></span></button></div></div><p>喜欢的内容，让它多一点。</p><section class="sheet-section"><h3>想看什么</h3><div class="preference-options topic-options"></div></section><section class="sheet-section"><h3>不想看到谁</h3><p>默认全部允许。勾选你不希望展示的人物。</p><div class="preference-options people-options"></div><p class="people-summary"></p></section><p class="save-note" role="status"></p><p class="fineprint">人物与选择均为本地示例，不会更改真实图库或设备。</p></dialog>
 <dialog class="sheet settings" aria-labelledby="settings-title"><div class="sheet-header"><div><button class="settings-back" type="button" hidden>‹ 设置</button><h2 class="settings-title" id="settings-title">设置</h2></div><button class="sheet-close" type="button" data-close-sheet aria-label="关闭设置"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:x"></iconify-icon><span class="fallback">×</span></span></button></div><div class="settings-home"><button class="settings-row" type="button" data-setting="device"><span><strong>照片墙</strong><small>客厅照片墙 · 示例</small></span><span aria-hidden="true">›</span></button><button class="settings-row" type="button" data-setting="account"><span><strong>账户</strong><small>体验账号</small></span><span aria-hidden="true">›</span></button><button class="settings-row" type="button" data-setting="scope"><span><strong>照片范围</strong><small>当前使用演示素材</small></span><span aria-hidden="true">›</span></button></div><div class="settings-detail" hidden></div><p class="fineprint">本页演示管理入口，不读取设备或账户。</p></dialog>
 <dialog class="sheet connection-sheet" aria-labelledby="connection-title"><div class="sheet-header"><h2 id="connection-title">照片墙连接</h2><button class="sheet-close" type="button" data-close-sheet aria-label="关闭连接详情"><span class="ui-icon" aria-hidden="true"><iconify-icon icon="lucide:x"></iconify-icon><span class="fallback">×</span></span></button></div><p>当前为演示连接。正式产品会显示照片墙的实际连接状态。</p><button class="simple-done" type="button" data-close-sheet>知道了</button></dialog>
</div>
</body>
</html>
