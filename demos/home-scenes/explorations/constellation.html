<script>
document.addEventListener('DOMContentLoaded',()=>{
  const $=id=>document.getElementById(id), viewport=$('viewport'),world=$('world'),stars=$('starLayer'),focus=$('focusWindow'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const entries=[{day:2,x:95,y:467,scene:2,title:'山林里的周末',caption:'日光，穿过林间。'},{day:5,x:244,y:382,scene:0,title:'潮水的声音',caption:'那个下午，走得很慢。'},{day:8,x:153,y:249,scene:2,title:'走进一片绿',caption:'沿着树影，慢慢走。'},{day:11,x:372,y:146,scene:1,title:'窗边的午后',caption:'一杯咖啡，把下午留长。'},{day:13,x:459,y:326,scene:0,title:'去看海',caption:'还记得，那天的海风。'},{day:15,x:462,y:59,title:'今天'}];
  const state={x:0,y:0,zoom:1},limits={min:1,max:2},dayMap=new Map(entries.map(item=>[item.day,item]));
  let base=1,gesture=null,suppressClick=false,raf=0,animationToken=0,selected=null,savedView=null,lastStar=null,lastDialogFocus=null;
  const imageObserver=new ResizeObserver(items=>items.forEach(({target})=>{const w=target.clientWidth,h=target.clientHeight,d=Math.max(w,h),index=Number(target.dataset.scene);target.style.backgroundSize=`${d*3}px ${d}px`;target.style.backgroundPosition=`${-(index*d+(d-w)/2)}px ${(h-d)/2}px`;}));
  function bounds(){return{x:Math.max(74,viewport.clientWidth*(state.zoom-1)*.6+74),y:Math.max(72,viewport.clientHeight*(state.zoom-1)*.55+72)};}
  function constrain(){const b=bounds();state.x=Math.max(-b.x,Math.min(b.x,state.x));state.y=Math.max(-b.y,Math.min(b.y,state.y));}
  function paint(){
    const scale=base*state.zoom;world.style.transform=`translate3d(${viewport.clientWidth/2+state.x}px,${viewport.clientHeight/2+state.y}px,0) scale(${scale}) translate(-300px,-290px)`;
    world.style.setProperty('--inverse',String(1/scale));world.style.setProperty('--panel-width',`${Math.min(286,viewport.clientWidth-56,Math.max(164,viewport.clientHeight-141))}px`);
    $('zoomLevel').textContent=Math.round(state.zoom*100)+'%';$('zoomOut').disabled=selected!==null||state.zoom<=limits.min+.001;$('zoomIn').disabled=selected!==null||state.zoom>=limits.max-.001;$('resetView').disabled=selected!==null;
  }
  function stopAnimation(){animationToken++;if(raf)cancelAnimationFrame(raf);raf=0;}
  function cancelGesture(){const previous=gesture;gesture=null;if(previous&&viewport.hasPointerCapture(previous.id))viewport.releasePointerCapture(previous.id);}
  function animateTo(target,finish){
    stopAnimation();cancelGesture();const token=animationToken,start={...state},started=performance.now();
    if(reduced.matches){Object.assign(state,target);paint();finish?.();return;}
    function frame(now){if(token!==animationToken)return;const progress=Math.min(1,(now-started)/320),t=1-Math.pow(1-progress,3);state.x=start.x+(target.x-start.x)*t;state.y=start.y+(target.y-start.y)*t;state.zoom=start.zoom+(target.zoom-start.zoom)*t;paint();if(progress<1)raf=requestAnimationFrame(frame);else{raf=0;finish?.();}}
    raf=requestAnimationFrame(frame);
  }
  function resize(){base=Math.min((viewport.clientWidth-56)/520,(viewport.clientHeight-44)/550);if(selected!==null){const item=dayMap.get(selected);state.x=-(item.x-300)*base*state.zoom;state.y=-(item.y-290)*base*state.zoom;}else constrain();paint();}
  function focusDay(day,button){
    stopAnimation();cancelGesture();const item=dayMap.get(day);if(!item)return;
    if(selected===null){savedView={...state};lastStar=button||document.activeElement;}
    selected=day;world.classList.add('map-focus');stars.inert=true;viewport.setAttribute('aria-label',`聚焦 9 月 ${day} 日回忆。按 Escape 返回星图`);
    stars.querySelectorAll('.star').forEach(star=>star.setAttribute('aria-pressed',String(Number(star.dataset.day)===day)));
    focus.style.left=item.x+'px';focus.style.top=item.y+'px';focus.hidden=false;focus.inert=false;
    const photo=item.scene!==undefined?`<div class="focus-photo" data-scene="${item.scene}" role="img" aria-label="${item.title}，示例照片"></div>`:`<div class="empty-today"><div class="empty-circle">15</div><p class="focus-caption">今天还没有留下回忆</p></div>`;
    imageObserver.disconnect();stars.querySelectorAll('.star-photo[data-scene]').forEach(el=>imageObserver.observe(el));
    focus.innerHTML=`<article class="focus-card"><div class="focus-meta"><span>09 / ${String(day).padStart(2,'0')}</span><span>${day===15?'2026 · 今天':'已展示 · 示例'}</span></div>${photo}<h2 class="focus-title">${day===15?'空白，也属于这一天':item.title}</h2><p class="focus-caption">${day===15?'回忆出现时，这里会多一颗星。':item.caption}</p><button class="back-map" id="backToMap"><iconify-icon icon="lucide:arrow-left" aria-hidden="true"></iconify-icon>返回星图</button></article>`;
    focus.querySelectorAll('.focus-photo').forEach(el=>imageObserver.observe(el));$('backToMap').addEventListener('click',closeFocus);$('backToMap').focus({preventScroll:true});
    const zoom=Math.max(1.35,state.zoom),target={zoom,x:-(item.x-300)*base*zoom,y:-(item.y-290)*base*zoom};
    animateTo(target);$('instruction').textContent=day===15?'今天留白，未来的回忆还没有到来':'从星图展开的，是已经展示过的示例回忆';$('announcement').textContent=`9 月 ${day} 日，${item.title}`;
  }
  function closeFocus(){
    if(selected===null)return;stopAnimation();selected=null;focus.inert=true;focus.hidden=true;focus.querySelectorAll('.focus-photo').forEach(el=>imageObserver.unobserve(el));world.classList.remove('map-focus');stars.inert=false;stars.querySelectorAll('.star').forEach(star=>star.setAttribute('aria-pressed','false'));viewport.setAttribute('aria-label','九月回忆星图，可拖动平移，方向键移动，加减号缩放');$('instruction').textContent='移动星图，点亮一个日子';const restore=savedView?{...savedView}:{x:0,y:0,zoom:1};savedView=null;animateTo(restore);lastStar?.focus({preventScroll:true});
  }
  for(const item of entries){
    const button=document.createElement('button');button.className='star';button.dataset.day=item.day;button.id='star'+item.day;button.style.left=item.x+'px';button.style.top=item.y+'px';button.setAttribute('aria-label',`查看 9 月 ${item.day} 日，${item.scene===undefined?'今天，暂无回忆':item.title+'，示例回忆'}`);button.setAttribute('aria-pressed','false');button.innerHTML=`<span class="star-photo" ${item.scene===undefined?'':`data-scene="${item.scene}"`}></span><span class="star-date">${item.day===15?'今天 · ':''}09 / ${String(item.day).padStart(2,'0')}</span>${item.day===13?'<span class="star-title">最近一次回忆</span>':''}`;button.addEventListener('click',()=>{if(!suppressClick)focusDay(item.day,button);});stars.appendChild(button);if(item.scene!==undefined)imageObserver.observe(button.querySelector('.star-photo'));
  }
  viewport.addEventListener('pointerdown',event=>{
    if(selected!==null||gesture||event.button!==0||event.isPrimary===false||event.target.closest('.focus-window'))return;
    stopAnimation();suppressClick=false;gesture={id:event.pointerId,startX:event.clientX,startY:event.clientY,view:{...state},moved:false};
  });
  viewport.addEventListener('pointermove',event=>{
    const active=gesture;if(!active||active.id!==event.pointerId)return;const dx=event.clientX-active.startX,dy=event.clientY-active.startY;if(Math.hypot(dx,dy)>6&&!active.moved){active.moved=true;viewport.setPointerCapture(active.id);}if(active.moved){state.x=active.view.x+dx;state.y=active.view.y+dy;constrain();paint();}
  });
  function endPointer(event){const active=gesture;if(!active||active.id!==event.pointerId)return;gesture=null;suppressClick=active.moved;if(viewport.hasPointerCapture(active.id))viewport.releasePointerCapture(active.id);}
  viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',event=>{if(gesture?.id===event.pointerId){suppressClick=true;cancelGesture();}});viewport.addEventListener('lostpointercapture',event=>{if(gesture?.id===event.pointerId)cancelGesture();});
  viewport.addEventListener('click',event=>{if(suppressClick&&event.detail!==0){suppressClick=false;event.preventDefault();event.stopImmediatePropagation();}else suppressClick=false;},true);
  function zoomBy(delta){if(selected!==null)return;stopAnimation();cancelGesture();const next=Math.max(limits.min,Math.min(limits.max,Math.round((state.zoom+delta)*100)/100));const ratio=next/state.zoom;animateTo({x:state.x*ratio,y:state.y*ratio,zoom:next},()=>{constrain();paint();});}
  $('zoomOut').addEventListener('click',()=>zoomBy(-.5));$('zoomIn').addEventListener('click',()=>zoomBy(.5));$('resetView').addEventListener('click',()=>{if(selected===null)animateTo({x:0,y:0,zoom:1});});$('todayButton').addEventListener('click',()=>focusDay(15,$('todayButton')));
  viewport.addEventListener('keydown',event=>{
    if(!$('dialogShade').hidden)return;if(event.key==='Escape'&&selected!==null){event.preventDefault();closeFocus();return;}if(selected!==null)return;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){event.preventDefault();stopAnimation();cancelGesture();const step=35;state.x+=event.key==='ArrowLeft'?step:event.key==='ArrowRight'?-step:0;state.y+=event.key==='ArrowUp'?step:event.key==='ArrowDown'?-step:0;constrain();paint();}
    if(event.key==='+'||event.key==='='){event.preventDefault();zoomBy(.5);}if(event.key==='-'){event.preventDefault();zoomBy(-.5);}if(event.key==='Home'){event.preventDefault();animateTo({x:0,y:0,zoom:1});}
  });
  const info={connection:['照片墙连接','连接状态始终在左上角。本 Demo 的“已连接”为演示状态，没有连接真实设备，也没有真实上屏回执。'],preferences:['偏好','偏好是独立入口，用来管理内容偏好与不想看到的人物。此版只演示星图首页，沿用现有偏好流程。'],settings:['设置','这里管理设备和账户，与偏好同级。当前页面为首页交互 Demo，设置数据不会被修改。']};
  function closeDialog(){$('dialogShade').hidden=true;$('dialogShade').inert=true;$('appContent').inert=false;if(selected!==null){const item=dayMap.get(selected);animateTo({zoom:state.zoom,x:-(item.x-300)*base*state.zoom,y:-(item.y-290)*base*state.zoom});}lastDialogFocus?.focus({preventScroll:true});}
  document.querySelectorAll('[data-info]').forEach(button=>button.addEventListener('click',()=>{stopAnimation();cancelGesture();const item=info[button.dataset.info];lastDialogFocus=button;$('dialogTitle').textContent=item[0];$('dialogCopy').textContent=item[1];$('appContent').inert=true;$('dialogShade').hidden=false;$('dialogShade').inert=false;$('closeDialog').focus();}));
  $('closeDialog').addEventListener('click',closeDialog);$('dialogShade').addEventListener('click',event=>{if(event.target===$('dialogShade'))closeDialog();});document.addEventListener('keydown',event=>{if(!$('dialogShade').hidden){if(event.key==='Escape'){event.preventDefault();closeDialog();}if(event.key==='Tab'){event.preventDefault();$('closeDialog').focus();}}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAnimation();cancelGesture();if(selected!==null)resize();}});reduced.addEventListener('change',()=>{stopAnimation();cancelGesture();paint();});new ResizeObserver(()=>{stopAnimation();cancelGesture();resize();}).observe(viewport);resize();
});
</script>
