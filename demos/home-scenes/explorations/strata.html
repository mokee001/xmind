<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5d9c3"><title>时间地层 · 拉开某一天</title>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js" defer></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;color:#302c29;background:#d5c6af;font-synthesis:none;--fast:120ms;--slow:320ms;--ease:cubic-bezier(.2,.7,.2,1)}*{box-sizing:border-box}html,body{margin:0;min-width:300px}button{font:inherit;border:0;cursor:pointer;color:inherit;background:transparent;-webkit-tap-highlight-color:transparent}button:focus-visible,[tabindex]:focus-visible{outline:2px solid currentColor;outline-offset:-5px}button:disabled{cursor:default;opacity:.3}iconify-icon{display:inline-block;font-size:18px;vertical-align:middle}button:active:not(:disabled){filter:brightness(.92)}[hidden]{display:none!important}.app{max-width:480px;min-height:100dvh;position:relative;margin:auto;background:#e5d9c3;isolation:isolate;overflow:hidden}.utility{position:sticky;top:0;z-index:10;background:#e5d9c3f5;display:flex;align-items:center;justify-content:space-between;height:79px;padding:14px 21px 0;backdrop-filter:blur(12px)}.connection{min-height:44px;font-size:11px;display:flex;align-items:center;gap:6px;padding:0}.connection i{width:5px;height:5px;background:#426754;border-radius:50%}.connection small{font-size:9px;color:#6e675a}.actions{display:flex;align-items:center;gap:9px}.actions button{min-height:44px;min-width:44px;font-size:12px}.actions .settings{border:1px solid #8e7c603b;border-radius:50%;display:grid;place-items:center}.intro{padding:27px 27px 24px}.eyebrow{font-size:10px;letter-spacing:2px;margin:0 0 9px;color:#7c6d5c}.intro-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.intro h1{font-size:31px;font-weight:450;letter-spacing:-1.3px;line-height:1.3;margin:0}.intro h1 span{display:block;font-size:12px;letter-spacing:.4px;font-weight:400;margin-top:9px;color:#766653}.month{font-size:11px;font-variant-numeric:tabular-nums;line-height:1.6;min-height:44px;min-width:44px;display:flex;flex-direction:column;justify-content:center;text-align:right}.month strong{font-size:25px;line-height:1;font-weight:300}.section-label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:#7c6d5c;margin:0 27px 8px}.section-label span:last-child{font-size:9px;letter-spacing:0}.layers{position:relative;display:flex;flex-direction:column;height:clamp(445px,59dvh,550px);isolation:isolate;background:#36535c;clip-path:polygon(0 2%,10% 1.1%,23% 2.1%,41% 0,62% 1.4%,81% .2%,100% 1.1%,100% 100%,0 100%);overflow:hidden;touch-action:pan-y}.layer{position:relative;min-height:48px;flex:1 1 0;isolation:isolate;overflow:hidden;background:var(--color);color:var(--ink,#fff6ea);transition:flex-grow var(--slow) var(--ease);--slant:0px}.layer:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background-image:repeating-linear-gradient(171deg,transparent 0px,transparent 17px,#ffffff08 18px,transparent 19px,transparent 27px,#0000000c 28px,transparent 29px);opacity:.9}.layer:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:11px;background:var(--next-color);clip-path:polygon(0 60%,14% 18%,33% 70%,49% 5%,66% 50%,85% 25%,100% 65%,100% 100%,0 100%);pointer-events:none;z-index:4}.layer:nth-child(2n):after{clip-path:polygon(0 20%,13% 55%,29% 5%,43% 35%,62% 80%,77% 25%,91% 60%,100% 15%,100% 100%,0 100%)}.layer:last-child:after{display:none}.layer-button{position:relative;z-index:5;width:100%;min-height:48px;height:100%;padding:0 27px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:16px}.layer-button .day{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px;width:45px;flex:none;line-height:1.1}.label{flex:1;min-width:0;line-height:1.4}.label strong{display:block;font-size:13px;font-weight:450;letter-spacing:.5px}.label small{display:block;font-size:9px;letter-spacing:.2px;margin-top:4px;opacity:.76}.layer-button .plus{display:grid;place-items:center;border:1px solid #ffffff40;width:27px;height:27px;border-radius:50%;flex:none}.layer-button .plus iconify-icon{font-size:14px}.layer.is-today .plus{border-color:#61524455}.seam{position:absolute;inset:0;background-image:url('../interactions/assets/memory-scenes.png');background-repeat:no-repeat;opacity:.17;mix-blend-mode:luminosity;pointer-events:none;transition:opacity var(--slow) var(--ease)}.layer.is-open{flex-grow:5.5}.layers.has-open .layer:not(.is-open) .label small{display:none}.layers.has-open .layer:not(.is-open) .day{font-size:25px}.layer.is-open .layer-button{height:63px;align-items:center;min-height:63px}.layer.is-open .day{font-size:34px}.layer.is-open .seam{opacity:0}.layer.is-open:before{opacity:.45}.photo{position:absolute;left:0;right:0;top:60px;bottom:0;background-image:url('../interactions/assets/memory-scenes.png');background-repeat:no-repeat;opacity:0;visibility:hidden;transition:opacity 220ms var(--ease);overflow:hidden;z-index:3}.layer.is-open .photo{opacity:1;visibility:visible}.photo:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#101b20bd,transparent 55%);pointer-events:none}.photo:after{content:"";position:absolute;left:0;top:-1px;right:0;height:10px;background:var(--color);clip-path:polygon(0 0,100% 0,100% 38%,82% 68%,66% 15%,48% 72%,29% 17%,12% 55%,0 22%);pointer-events:none}.photo-caption{position:absolute;bottom:20px;left:27px;right:23px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fffaf3}.photo-caption p{font-size:11px;line-height:1.7;margin:0;max-width:230px}.photo-caption button{min-width:44px;min-height:44px;border:1px solid #ffffff73;border-radius:50%;display:grid;place-items:center;background:#10202822;flex:none}.today-copy{position:absolute;left:27px;right:27px;top:92px;color:#635640;opacity:0;visibility:hidden}.today-copy strong{font-size:22px;font-weight:350;letter-spacing:1px}.today-copy p{font-size:12px;line-height:1.9;color:#7a6b55;max-width:260px}.today-copy button{font-size:11px;min-height:44px;border-bottom:1px solid #94816a77;padding:0}.layer.is-open .today-copy{opacity:1;visibility:visible}.subsoil{height:28px;background:repeating-linear-gradient(175deg,#284752 0 5px,#2b4a54 6px,#2b4a54 10px,#25434f 11px,#284752 12px);position:relative}.subsoil:after{content:"";height:10px;position:absolute;bottom:0;left:0;right:0;background:#e5d9c3;clip-path:polygon(0 80%,12% 55%,29% 94%,47% 35%,62% 70%,82% 40%,100% 73%,100% 100%,0 100%)}.footer{padding:19px 27px 23px;display:flex;align-items:center;justify-content:space-between;gap:10px}.footer-copy{font-size:10px;line-height:1.7;color:#7c6d5c;margin:0}.footer-copy strong{display:block;color:#5f5144;font-weight:450;font-size:11px}.footer button{border:1px solid #a6977d80;border-radius:50%;height:46px;width:46px;display:grid;place-items:center;flex:none;font-size:10px}.fineprint{font-size:8px;letter-spacing:.2px;color:#8e7e69;margin:-3px 27px 19px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}dialog{border:1px solid #af9e8370;background:#eee5d5;color:#372f28;width:calc(100% - 34px);max-width:440px;max-height:85dvh;padding:24px;border-radius:3px;margin:auto;box-shadow:0 20px 70px #171e2440}dialog::backdrop{background:#2827238a;backdrop-filter:blur(4px)}.dialog-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}dialog h2{font-size:21px;line-height:1.4;font-weight:450;margin:0}dialog p{font-size:12px;line-height:1.9;color:#766653;margin:15px 0 0}.close{min-width:44px;min-height:44px;border:1px solid #b4a58c80;border-radius:50%;display:grid;place-items:center}.full-photo{width:100%;height:clamp(230px,43dvh,380px);background-image:url('../interactions/assets/memory-scenes.png');background-repeat:no-repeat;margin:18px 0 0}button:hover .plus{background:#fff1}@media(max-width:350px){.intro,.footer{padding-left:22px;padding-right:22px}.layer-button{padding-left:22px;padding-right:22px}.intro h1{font-size:28px}.label strong{font-size:12px}.layer-button .day{width:40px}.layers{height:470px}}@media(max-height:740px){.utility{height:67px;padding-top:4px}.intro{padding-top:19px;padding-bottom:20px}.intro h1{font-size:28px}.layers{height:445px}.footer{padding-top:14px;padding-bottom:16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const records=[{day:15,scene:null,title:'今天',note:'留给今天的空白',color:'#d9c8a6',ink:'#564b3c'},{day:13,scene:0,title:'去看海',note:'风把下午吹得很慢',color:'#ac603d'},{day:11,scene:1,title:'窗边的午后',note:'一杯咖啡的时间',color:'#c4825f',ink:'#352a23'},{day:8,scene:2,title:'有光的森林',note:'放慢脚步',color:'#a59b83',ink:'#302f29'},{day:5,scene:0,title:'再看一眼海',note:'日子里的片刻',color:'#4f6b73'},{day:2,scene:2,title:'走进一片绿',note:'林间散步',color:'#355562'}];
 const layers=document.querySelector('#layers'),dialog=document.querySelector('#info'),reduce=matchMedia('(prefers-reduced-motion:reduce)');let selected=null,lastFocus=null;
 function crop(el){const i=Number(el.dataset.scene);if(!Number.isInteger(i)||i<0)return;const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const size=Math.max(w,h);el.style.backgroundSize=`${size*3}px ${size}px`;el.style.backgroundPosition=`${-i*size-(size-w)/2}px ${(h-size)/2}px`;}
 const resize=new ResizeObserver(entries=>entries.forEach(e=>crop(e.target)));
 records.forEach((r,i)=>{const section=document.createElement('section');section.className='layer'+(r.scene===null?' is-today':'');section.id='stratum-'+r.day;section.style.setProperty('--color',r.color);section.style.setProperty('--ink',r.ink||'#fff6ea');section.style.setProperty('--next-color',records[i+1]?.color||r.color);section.innerHTML=`${r.scene===null?'':`<div class="seam" aria-hidden="true" data-scene="${r.scene}"></div>`}<button class="layer-button" id="day-${r.day}" aria-expanded="false" aria-controls="content-${r.day}" aria-label="展开9月${r.day}日${r.scene===null?'，今天暂无记录':'，'+r.title}"><span class="day">${String(r.day).padStart(2,'0')}</span><span class="label"><strong>${r.title}</strong><small>${r.scene===null?'今天暂未留下回忆':'9月 · 示例回忆'}</small></span><span class="plus" aria-hidden="true"><iconify-icon icon="lucide:plus"></iconify-icon></span></button>${r.scene===null?`<div class="today-copy" id="content-${r.day}" inert><strong>今天，正在发生。</strong><p>新的回忆会在展示后留在这里。下一次惊喜，留给照片墙。</p><button id="recent">回看最近的一层 ↗</button></div>`:`<div class="photo" id="content-${r.day}" data-scene="${r.scene}" role="group" aria-label="${r.title}，示例照片" inert><div class="photo-caption"><p>${r.note}</p><button class="open-photo" data-day="${r.day}" aria-label="展开9月${r.day}日完整照片"><iconify-icon icon="lucide:expand" aria-hidden="true"></iconify-icon></button></div></div>`}`;layers.appendChild(section);section.querySelector('.layer-button').onclick=()=>choose(selected===r.day?null:r.day);section.querySelectorAll('[data-scene]').forEach(el=>resize.observe(el));});
 function choose(day){selected=day;layers.classList.toggle('has-open',day!==null);layers.dataset.selected=day===null?'overview':day;records.forEach(r=>{const node=document.querySelector('#stratum-'+r.day),open=day===r.day;node.classList.toggle('is-open',open);const b=node.querySelector('.layer-button');b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',`${open?'收起':'展开'}9月${r.day}日${r.scene===null?'，今天暂无记录':'，'+r.title}`);b.querySelector('iconify-icon').setAttribute('icon',open?'lucide:minus':'lucide:plus');node.querySelector('#content-'+r.day).inert=!open;});document.querySelector('#instruction').textContent=day===null?'点开一层，回到某一天。':'再点日期，收回时间里。';document.querySelector('#overview').setAttribute('aria-label',day===null?'打开今天的空白层':'收起全部地层');document.querySelector('#overview').textContent=day===null?'今天':'收起';document.querySelector('#announcement').textContent=day===null?'已收起全部地层':`已展开9月${day}日${day===15?'，今天暂无记录':''}`;}
 document.querySelector('#overview').onclick=()=>choose(selected===null?15:null);document.querySelector('#recent').onclick=()=>choose(13);
 layers.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected!==null){const button=document.querySelector('#day-'+selected);choose(null);button.focus({preventScroll:true});}if(!e.target.matches('.layer-button'))return;const index=records.findIndex(r=>'day-'+r.day===e.target.id);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const next=Math.min(records.length-1,Math.max(0,index+(e.key==='ArrowDown'?1:-1)));document.querySelector('#day-'+records[next].day).focus({preventScroll:true});}});
 function info(title,copy,scene=null){lastFocus=document.activeElement;document.querySelector('#infoTitle').textContent=title;document.querySelector('#infoText').textContent=copy;const photo=document.querySelector('#fullPhoto');photo.hidden=scene===null;if(scene!==null){photo.dataset.scene=scene;photo.setAttribute('aria-label',title+'，示例照片');}dialog.showModal();if(scene!==null)crop(photo);}
 const messages={connection:['客厅照片墙','已连接 · 示例状态。本 Demo 没有连接真实设备，历史内容不代表真实上屏回执。'],preferences:['偏好','从这里进入已确认的偏好管理。本轮仅设计首页，保留现有偏好逻辑。'],settings:['设置','这里进入设备与账户管理。设置与偏好保持独立，连接状态固定显示在首页左上角。'],month:['2026 年 9 月','当前用 9 月的五段示例回忆比较交互。正式版本可按月份归档，时间从上方的今天向下累积。']};document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>info(...messages[b.dataset.info]));document.querySelectorAll('.open-photo').forEach(b=>b.onclick=()=>{const r=records.find(r=>r.day===Number(b.dataset.day));info(`9月${r.day}日 · ${r.title}`,r.note+'。照片与历史均为示例。',r.scene);});document.querySelector('#closeInfo').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastFocus?.focus({preventScroll:true}));dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});resize.observe(document.querySelector('#fullPhoto'));choose(null);
});
</script>
</head>
<body><div class="app">
 <header class="utility"><button class="connection" data-info="connection" aria-label="连接状态，已连接，示例"><i></i>已连接 <small>示例</small></button><nav class="actions" aria-label="首页功能"><button data-info="preferences">偏好</button><button class="settings" data-info="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button></nav></header>
 <div class="intro"><p class="eyebrow">回忆日历 / TIME STRATA</p><div class="intro-row"><h1>日子，层层留下<span>向下，是走过的时间。</span></h1><button class="month" data-info="month" aria-label="2026年9月，月份说明"><strong>09</strong><span>2026</span></button></div></div>
 <main aria-label="时间地层"><div class="section-label"><span>此刻 → 过去</span><span>五段示例回忆</span></div><div id="layers" class="layers" aria-label="9月回忆，按时间从新到旧"></div><div class="subsoil" aria-hidden="true"></div></main>
 <footer class="footer"><p class="footer-copy"><strong id="instruction">点开一层，回到某一天。</strong>每一层，都留着生活的痕迹。</p><button id="overview" aria-label="打开今天的空白层">今天</button></footer><p class="fineprint">只回看已展示的回忆 · 当前为示例内容</p><span id="announcement" class="sr-only" aria-live="polite" role="status"></span>
 <dialog id="info" aria-labelledby="infoTitle"><div class="dialog-heading"><h2 id="infoTitle">回忆</h2><button id="closeInfo" class="close" aria-label="关闭"><iconify-icon icon="lucide:x" aria-hidden="true"></iconify-icon></button></div><div id="fullPhoto" class="full-photo" role="img" hidden></div><p id="infoText"></p></dialog>
</div></body>
</html>
