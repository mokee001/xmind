<style>
:root{--surface:#ebedee;--ink:#202628;--muted:#788084;--line:#cdd2d5;--accent:#e95233;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1);--fast:120ms;--state:200ms;--large:320ms;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;color:var(--ink);background:var(--surface);font-synthesis:none;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}html,body{margin:0;min-width:300px;min-height:100%;background:var(--surface)}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,[tabindex]:focus-visible{outline:2px solid #364850;outline-offset:4px}button{transition:background-color var(--fast) var(--ease),opacity var(--fast) var(--ease)}button:disabled{opacity:.3;cursor:default}button:active:not(:disabled){opacity:.75}[hidden]{display:none!important}iconify-icon{font-size:19px;display:block;pointer-events:none}.app{width:min(100%,480px);min-height:max(100dvh,620px);margin:auto;padding:0 24px 24px;position:relative;background:linear-gradient(110deg,#f3f4f4 0%,#e7eaec 100%)}.topbar{height:78px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:9px;position:sticky;top:0;z-index:20;background:linear-gradient(#eff1f2f5,#eff1f2ed 75%,#eff1f200)}.connection{border:0;background:none;display:flex;align-items:center;gap:6px;min-height:44px;padding:0;font-size:10px;white-space:nowrap}.connection i{width:5px;height:5px;background:#668375;border-radius:50%}.top-actions{display:flex;align-items:center;gap:10px}.top-actions button{height:44px;min-width:44px;border:0;background:transparent;display:grid;place-items:center;font-size:12px}.top-actions .settings{width:44px;border:1px solid #ccd0d2;border-radius:50%;background:#f3f4f433}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:28px 0 31px}.intro h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.05em;font-weight:550}.intro p{margin:10px 0 0;color:#81888c;font-size:10px;letter-spacing:.02em}.month-label{font-family:var(--mono);font-size:11px;letter-spacing:-.04em;line-height:1.5;text-align:right;padding-bottom:2px;white-space:nowrap}.month-label span{display:block;font-size:8px;color:#8b9295;letter-spacing:.13em;margin-bottom:5px}.machine{position:relative;padding-top:12px}.machine-label{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:8px;color:#8c959a;letter-spacing:.11em;margin:0 2px 6px}.machine-label span:last-child{letter-spacing:.02em}.wheel{width:100%;aspect-ratio:1;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;outline-offset:0!important;cursor:grab;border-radius:50%;margin:0 auto;--rotation:240deg;--locator:90deg}.wheel.is-dragging{cursor:grabbing}.disc{position:absolute;inset:27px;border-radius:50%;background:#20272b;box-shadow:0 8px 16px #252d2d1e,inset 0 1px 1px #fff5,inset 0 -2px 5px #0005;overflow:hidden;pointer-events:none}.disc::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid #535a5d;box-shadow:inset 0 0 0 4px #161d20}.rotation-ring{position:absolute;inset:8px;transform:rotate(var(--rotation));border-radius:50%;background:repeating-conic-gradient(from 0deg,#c8cdcc00 0deg 5deg,#a8b1b95c 5deg 5.4deg,#0000 5.4deg 10deg);mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));transition:transform var(--large) var(--ease)}.rotation-grain{position:absolute;inset:19px;border:1px solid #67707433;border-radius:50%;transform:rotate(var(--rotation));transition:transform var(--large) var(--ease)}.rotation-grain::before,.rotation-grain::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#bcc4c570;top:6px;left:calc(50% - 1px)}.rotation-grain::after{top:auto;bottom:6px;background:#697373}.locator{position:absolute;inset:21px;border-radius:50%;transform:rotate(var(--locator));transition:transform var(--large) var(--ease);pointer-events:none}.locator::before{content:"";position:absolute;left:calc(50% - 1.5px);top:0;height:14px;width:3px;background:var(--accent);border-radius:1px;box-shadow:0 0 0 2px #ebeef1}.center-photo{position:absolute;inset:19.3%;border:0;padding:0;overflow:hidden;border-radius:50%;background:#758d90;box-shadow:0 0 0 1px #000,0 0 0 5px #20272b;cursor:zoom-in;isolation:isolate;touch-action:none}.photo-layer{position:absolute;inset:0;background-image:url('../interactions/assets/memory-scenes.png');background-repeat:no-repeat;background-size:300% 100%;background-position:0% center;transition:opacity var(--state) var(--ease)}.center-photo::after{content:"";pointer-events:none;position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 1px 8px #0003}.photo-expand{position:absolute;bottom:12px;left:calc(50% - 13px);width:26px;height:26px;display:grid;place-items:center;border:1px solid #fff5;border-radius:50%;background:#192b3552;color:#fff;backdrop-filter:blur(3px);pointer-events:none}.photo-expand iconify-icon{font-size:12px}.today-center{position:absolute;inset:0;background:#dce1e2;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#737f83}.today-center strong{font-family:var(--mono);font-size:55px;line-height:1;font-weight:300;letter-spacing:-.09em;color:#a4adb1}.today-center span{font-size:10px;letter-spacing:.03em;margin-top:15px}.date-marker{position:absolute;left:var(--x);top:var(--y);width:44px;height:44px;transform:translate(-50%,-50%);padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;z-index:5;border:0;border-radius:50%;background:transparent;font-family:var(--mono);font-size:11px;color:#7d878d;line-height:1}.date-marker small{font:7px/1.1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;position:absolute;top:31px;letter-spacing:0}.date-marker[aria-pressed="true"]{color:var(--accent);font-size:13px;font-weight:650}.date-marker:hover{background:#d0d6d66b}.date-marker:focus-visible{outline-offset:-5px}.wheel.is-dragging .rotation-ring,.wheel.is-dragging .rotation-grain,.wheel.is-dragging .locator{transition:none}.wheel.is-dragging .photo-expand{opacity:0}.detail{margin:21px 4px 0;padding-top:21px;border-top:1px solid #c5cbcd;display:grid;grid-template-columns:69px minmax(0,1fr);align-items:center;gap:17px;min-height:98px}.date-readout{font-family:var(--mono);font-size:53px;line-height:1;letter-spacing:-.1em;font-weight:400;color:var(--accent)}.record-info h2{margin:0;font-size:17px;line-height:1.4;font-weight:500;letter-spacing:-.03em}.record-info p{margin:8px 0 0;font-size:10px;line-height:1.55;color:#858d91;letter-spacing:.03em}.navigation{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;gap:11px;margin:23px 4px 0}.step{height:46px;border:1px solid #c2c9cd;background:#f1f3f433;border-radius:4px;font-size:11px;display:flex;justify-content:center;align-items:center;gap:7px}.step iconify-icon{font-size:15px}.today-button{font-size:11px;height:46px;border:0;background:none;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#a6afb3}.hint{display:flex;align-items:center;justify-content:center;gap:7px;margin:24px 0 0;color:#8b9499;font-size:10px;line-height:1.6}.hint iconify-icon{font-size:13px}.sample-note{font-family:var(--mono);font-size:8px;letter-spacing:.09em;color:#9ba3a7;text-align:center;margin:15px 0 0}.sr-only{position:absolute;height:1px;width:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}dialog{background:#edf0f1;color:var(--ink);border:1px solid #bcc5c8;border-radius:6px;padding:27px;max-width:350px;width:calc(100% - 44px);box-shadow:0 25px 70px #182e3330}dialog::backdrop{background:#13212678;backdrop-filter:blur(5px)}dialog h2{font-size:19px;font-weight:500;margin:0 0 12px;line-height:1.4}dialog p{font-size:12px;line-height:1.8;margin:0;color:#768187}.close-info{display:block;height:44px;padding:0 18px;background:#293235;color:#fff;border:0;border-radius:3px;margin:22px 0 0 auto;font-size:12px}.photo-dialog{position:fixed;inset:0;margin:0 auto;width:min(100%,480px);max-width:480px;height:100dvh;max-height:100dvh;overflow:auto;border:0;border-radius:0;padding:18px 24px 28px;box-shadow:none}.photo-dialog::backdrop{background:#12191bdc;backdrop-filter:blur(9px)}.photo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px;min-height:49px;gap:15px}.photo-header p{font-family:var(--mono);font-size:11px;color:#606e75}.close-photo{display:flex;align-items:center;gap:6px;border:0;background:none;min-height:44px;font-size:11px;padding:0}.close-photo iconify-icon{font-size:17px}.full-image{width:100%;height:min(64dvh,590px);background-image:url('../interactions/assets/memory-scenes.png');background-repeat:no-repeat;background-color:#859d9e;position:relative}.photo-dialog h2{font-size:25px;margin:27px 0 9px;font-weight:450;letter-spacing:-.04em}.photo-dialog .image-note{font-size:11px;line-height:1.8;max-width:31em}.photo-return{display:flex;align-items:center;justify-content:space-between;margin-top:30px;border-top:1px solid #c9d0d3;padding-top:16px;color:#869196;font:9px/1.5 var(--mono)}.photo-return button{border:0;background:none;min-height:44px;padding:0;font-family:inherit;font-size:10px}.photo-return button iconify-icon{font-size:16px}.app[data-today="true"] .center-photo{cursor:default}.app[data-today="true"] .photo-expand{display:none}@media(max-height:700px){.intro{margin:13px 0 17px}.intro h1{font-size:24px}.topbar{height:64px;padding-top:6px}.machine{padding-top:5px}.detail{margin-top:12px;padding-top:15px;min-height:88px}.navigation{margin-top:15px}.hint{margin-top:18px}.sample-note{margin-top:12px}}@media(max-height:650px){.app{padding-bottom:24px;min-height:690px}.intro{margin-top:12px}.wheel{max-width:340px}.detail{margin-top:9px}.date-readout{font-size:46px}.photo-dialog{min-height:0}.full-image{height:54dvh}}@media(max-width:350px){.app{padding-left:19px;padding-right:19px}.intro h1{font-size:24px}.month-label{font-size:10px}.top-actions{gap:5px}.connection{font-size:9px}.date-marker{font-size:10px}.date-marker[aria-pressed=true]{font-size:12px}.date-marker small{font-size:6px}.disc{inset:24px}.locator{inset:19px}.detail{grid-template-columns:60px minmax(0,1fr);gap:12px}.record-info h2{font-size:16px}.hint{font-size:9px}.navigation{gap:7px}.step{font-size:10px}.center-photo{inset:20%}}@media(prefers-reduced-motion:reduce){:root{--fast:0ms;--state:0ms;--large:0ms}.rotation-ring,.rotation-grain,.locator,.photo-layer{transition:none}dialog::backdrop,.photo-expand{backdrop-filter:none}}
</style>
<script>
const dialMath={
  clamp:(value,min,max)=>Math.min(max,Math.max(min,value)),
  delta:(previous,next)=>((next-previous+540)%360)-180,
  snap:angle=>Math.round(Math.min(300,Math.max(0,angle))/60),
  move:(angle,previous,next)=>Math.min(300,Math.max(0,angle+((next-previous+540)%360)-180))
};
document.addEventListener('DOMContentLoaded',()=>{
  const records=[{day:2,scene:2,title:'走进一片安静',note:'林间的光 · 示例回忆'},{day:5,scene:0,title:'风从海面吹来',note:'海边的一天 · 示例回忆'},{day:8,scene:2,title:'把绿色带回来',note:'散步的下午 · 示例回忆'},{day:11,scene:1,title:'一杯咖啡的时间',note:'不赶路的午后 · 示例回忆'},{day:13,scene:0,title:'海边的那一天',note:'9月13日 · 星期日 · 示例回忆'},{day:15,scene:null,title:'今天，留一点空白',note:'还没有展示记录 · 下一份惊喜留给照片墙'}];
  const root=document.querySelector('.app'),wheel=document.querySelector('.wheel'),centerPhoto=document.querySelector('.center-photo'),centerLayer=document.querySelector('.photo-layer'),markers=document.querySelector('.date-markers'),fullImage=document.querySelector('.full-image'),photoDialog=document.querySelector('.photo-dialog'),infoDialog=document.querySelector('.info-dialog');
  let angle=240,index=4,drag=null,suppressClickUntil=0;
  function crop(el,scene){if(scene===null)return;const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const d=Math.max(w,h);el.style.backgroundSize=`${d*3}px ${d}px`;el.style.backgroundPosition=`${-(scene*d+(d-w)/2)}px ${(h-d)/2}px`;el.dataset.scene=String(scene);}
  const resize=new ResizeObserver(()=>{crop(centerLayer,records[index].scene);if(photoDialog.open)crop(fullImage,records[index].scene);});resize.observe(centerPhoto);resize.observe(fullImage);
  function display(next){
    index=dialMath.clamp(next,0,records.length-1);const record=records[index];
    root.dataset.day=record.day;root.dataset.today=String(record.scene===null);root.dataset.index=index;
    document.querySelector('.date-readout').textContent=String(record.day).padStart(2,'0');
    document.querySelector('.record-info h2').textContent=record.title;document.querySelector('.record-info p').textContent=record.note;
    document.querySelector('.index-count').textContent=String(index+1).padStart(2,'0')+' / 06';
    document.querySelector('.today-center').hidden=record.scene!==null;
    centerLayer.hidden=record.scene===null;centerPhoto.setAttribute('aria-label',record.scene===null?'9月15日，今天暂无展示记录':`展开9月${record.day}日的示例回忆：${record.title}`);
    centerPhoto.setAttribute('aria-disabled',String(record.scene===null));
    document.querySelector('.previous').disabled=index===0;document.querySelector('.next').disabled=index===5;
    markers.querySelectorAll('button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
    wheel.setAttribute('aria-label',`时间转盘，当前9月${record.day}日。绕圆心旋转，或按左右方向键切换日期。`);
    crop(centerLayer,record.scene);
  }
  function rotate(value){angle=dialMath.clamp(value,0,300);wheel.style.setProperty('--rotation',angle+'deg');wheel.style.setProperty('--locator',(angle-150)+'deg');root.dataset.angle=angle.toFixed(2);const nearest=dialMath.snap(angle);if(nearest!==index)display(nearest);}
  function select(next,announce=true){drag=null;wheel.classList.remove('is-dragging');next=dialMath.clamp(next,0,5);rotate(next*60);display(next);if(announce)document.querySelector('.announcement').textContent=`9月${records[next].day}日，${records[next].title}`;}
  records.forEach((record,i)=>{const radians=(i*60-150)*Math.PI/180;const button=document.createElement('button');button.type='button';button.className='date-marker';button.style.setProperty('--x',(50+46*Math.sin(radians))+'%');button.style.setProperty('--y',(50-46*Math.cos(radians))+'%');button.dataset.index=i;button.dataset.day=record.day;button.setAttribute('aria-label',`定位到9月${record.day}日${record.scene===null?'，今天暂无记录':''}`);button.setAttribute('aria-pressed',String(i===4));button.innerHTML=String(record.day).padStart(2,'0')+(record.day===15?'<small>今天</small>':'');button.addEventListener('click',()=>{if(performance.now()<suppressClickUntil)return;select(i);});markers.appendChild(button);});
  function pointAngle(event){const r=wheel.getBoundingClientRect(),x=event.clientX-r.left-r.width/2,y=event.clientY-r.top-r.height/2;return{value:Math.atan2(y,x)*180/Math.PI,radius:Math.hypot(x,y)};}
  wheel.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('.date-marker'))return;const point=pointAngle(event);if(point.radius<22)return;drag={id:event.pointerId,last:point.value,originalAngle:angle,originalIndex:index,travel:0,moved:false};});
  wheel.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;const point=pointAngle(event);if(point.radius<22){drag.last=null;return;}if(drag.last===null){drag.last=point.value;return;}const delta=dialMath.delta(drag.last,point.value);drag.last=point.value;drag.travel+=Math.abs(delta);if(!drag.moved&&drag.travel<3)return;if(!drag.moved){drag.moved=true;wheel.classList.add('is-dragging');wheel.setPointerCapture(event.pointerId);}event.preventDefault();rotate(angle+delta);});
  wheel.addEventListener('pointerup',event=>{if(!drag||event.pointerId!==drag.id)return;const hadMoved=drag.moved;const target=dialMath.snap(angle);drag=null;wheel.classList.remove('is-dragging');if(wheel.hasPointerCapture(event.pointerId))wheel.releasePointerCapture(event.pointerId);if(hadMoved){suppressClickUntil=performance.now()+280;select(target);}});
  function cancelDrag(event){if(!drag||(event&&event.pointerId!==undefined&&event.pointerId!==drag.id))return;const original=drag.originalIndex;drag=null;wheel.classList.remove('is-dragging');suppressClickUntil=performance.now()+280;select(original);}
  wheel.addEventListener('pointercancel',cancelDrag);wheel.addEventListener('lostpointercapture',cancelDrag);window.addEventListener('blur',()=>cancelDrag());
  wheel.addEventListener('keydown',event=>{let target;if(event.key==='ArrowLeft'||event.key==='ArrowDown')target=index-1;else if(event.key==='ArrowRight'||event.key==='ArrowUp')target=index+1;else if(event.key==='Home')target=0;else if(event.key==='End')target=5;else return;event.preventDefault();select(target);});
  document.querySelector('.previous').addEventListener('click',()=>select(index-1));document.querySelector('.next').addEventListener('click',()=>select(index+1));document.querySelector('.today-button').addEventListener('click',()=>select(5));
  centerPhoto.addEventListener('click',()=>{if(performance.now()<suppressClickUntil||records[index].scene===null)return;const record=records[index];photoDialog.querySelector('.photo-date').textContent=`2026.09.${String(record.day).padStart(2,'0')} / 示例回忆`;photoDialog.querySelector('h2').textContent=record.title;fullImage.setAttribute('aria-label',record.scene===0?'示例海边照片':record.scene===1?'示例咖啡照片':'示例森林照片');photoDialog.showModal();crop(fullImage,record.scene);});
  document.querySelectorAll('[data-close-photo]').forEach(button=>button.addEventListener('click',()=>photoDialog.close()));
  photoDialog.addEventListener('close',()=>centerPhoto.focus({preventScroll:true}));
  const information={connection:['照片墙连接','此页面为独立首页 Demo，连接状态是示例。正式连接状态由设备回执更新。'],preferences:['偏好','正式 App 中从这里进入偏好管理。这个方案保留独立入口，重点体验用旋转来定位回忆。'],settings:['设置','这里进入设备与账户管理，与偏好处于同一级。此次 Demo 不会更改实际设置。']};
  document.querySelectorAll('[data-info]').forEach(button=>button.addEventListener('click',()=>{const [title,copy]=information[button.dataset.info];infoDialog.querySelector('h2').textContent=title;infoDialog.querySelector('p').textContent=copy;infoDialog.showModal();}));
  document.querySelector('.close-info').addEventListener('click',()=>infoDialog.close());
  [photoDialog,infoDialog].forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}));
  display(4);rotate(240);
});
</script>
</head>
<body>
<div class="app" data-day="13" data-today="false" data-index="4">
  <header class="topbar"><button class="connection" type="button" data-info="connection"><i aria-hidden="true"></i>已连接 · 示例</button><div class="top-actions"><button type="button" data-info="preferences">偏好</button><button class="settings" type="button" data-info="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button></div></header>
  <main>
    <div class="intro"><div><h1>回忆日历</h1><p>把时间，轻轻转回来。</p></div><div class="month-label"><span>SEPTEMBER</span>2026 / 09</div></div>
    <section class="machine" aria-label="时光转盘">
      <div class="machine-label" aria-hidden="true"><span>TIME DIAL</span><span class="index-count">05 / 06</span></div>
      <div class="wheel" tabindex="0" role="group" aria-label="时间转盘，当前9月13日。绕圆心旋转，或按左右方向键切换日期。">
        <div class="disc" aria-hidden="true"><div class="rotation-ring"></div><div class="rotation-grain"></div></div>
        <div class="locator" aria-hidden="true"></div>
        <button class="center-photo" type="button" aria-label="展开9月13日的示例回忆：海边的那一天"><span class="photo-layer" aria-hidden="true"></span><span class="today-center" hidden aria-hidden="true"><strong>15</strong><span>今天，还在继续。</span></span><span class="photo-expand" aria-hidden="true"><iconify-icon icon="lucide:expand"></iconify-icon></span></button>
        <div class="date-markers" role="group" aria-label="直接定位日期"></div>
      </div>
    </section>
    <section class="detail" aria-label="选中的日期"><div class="date-readout" aria-hidden="true">13</div><div class="record-info"><h2>海边的那一天</h2><p>9月13日 · 星期日 · 示例回忆</p></div></section>
    <nav class="navigation" aria-label="切换回忆日期"><button class="step previous" type="button"><iconify-icon icon="lucide:arrow-left" aria-hidden="true"></iconify-icon>上一个</button><button class="today-button" type="button">今天</button><button class="step next" type="button">下一个<iconify-icon icon="lucide:arrow-right" aria-hidden="true"></iconify-icon></button></nav>
    <p class="hint"><iconify-icon icon="lucide:rotate-cw" aria-hidden="true"></iconify-icon>沿圆盘转动，松手停在某一天</p><p class="sample-note">示例内容 · 仅回看已经展示过的回忆</p>
    <p class="announcement sr-only" role="status"></p>
  </main>
  <dialog class="info-dialog" aria-labelledby="info-title"><h2 id="info-title"></h2><p></p><button class="close-info" type="button">知道了</button></dialog>
