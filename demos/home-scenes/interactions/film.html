<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101313"><title>显影长卷 · 拖动回忆</title>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;color:#f2f1eb;background:#101313;font-synthesis:none;--line:#ffffff27;--ease:cubic-bezier(.2,.7,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #edd9b8;outline-offset:4px}button:disabled{opacity:.3;cursor:default}iconify-icon{display:block;font-size:20px}.app{position:relative;max-width:480px;height:100dvh;min-height:560px;margin:auto;overflow:hidden;background:#111515;isolation:isolate}.picture{position:absolute;inset:0 0 231px;overflow:hidden;background:#191d1d;touch-action:none;cursor:ew-resize}.photo-layer{position:absolute;inset:0;background-image:url('./assets/memory-scenes.png');background-repeat:no-repeat;will-change:opacity}.picture:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,#060c13bd 0%,#060c130a 40%,#080c1400 57%,#101313ec 100%)}.utility{position:absolute;inset:0 0 auto;height:83px;padding:17px 19px 0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:6px;background:linear-gradient(#06101860,#06101800)}.connection{display:flex;gap:6px;align-items:center;font-size:11px;height:44px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:#bde0c2}.sample{font-size:8px;opacity:.65}.nav{display:flex;align-items:center;gap:9px}.preferences{height:44px;padding:0 9px;font-size:12px}.settings{width:44px;height:44px;display:grid;place-items:center;border:1px solid #ffffff39;border-radius:50%;background:#0d191424;backdrop-filter:blur(10px)}.month-label{position:absolute;top:98px;left:24px;right:24px;z-index:5;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:2px;color:#eff0e4}.month-label strong{font-size:12px;font-weight:400;letter-spacing:1px}.film-corner{width:21px;height:21px;border-top:1px solid #ffffff75;border-right:1px solid #ffffff75}.caption{position:absolute;bottom:243px;left:25px;right:25px;z-index:6;pointer-events:none}.date{font-size:11px;letter-spacing:3px;display:flex;align-items:center;gap:10px;margin:0 0 13px}.date:before{content:"";display:block;width:19px;height:1px;background:#e7e7d9}.caption h1{font-size:29px;font-weight:350;letter-spacing:1px;line-height:1.2;margin:0}.caption p{font-size:10px;letter-spacing:1px;color:#c9d0c9;margin:11px 0 0;line-height:1.7}.empty-today{position:absolute;inset:148px 23px 41px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;visibility:hidden;pointer-events:none}.empty-today .line{width:1px;height:100px;background:linear-gradient(transparent,#c5af866e,transparent);transform:rotate(28deg);margin:0 0 29px}.empty-today strong{font-size:18px;font-weight:300;letter-spacing:2px}.empty-today p{font-size:11px;line-height:1.9;color:#a6aaa0;max-width:230px;margin-top:14px}.empty-today button{min-height:44px;color:#eee2c8;font-size:11px;margin-top:17px;pointer-events:auto;padding:0 13px;border-bottom:1px solid #c9bb972e}.app.is-today .caption h1{font-size:23px}.app.is-today .empty-today{opacity:1;visibility:visible}.app.is-today .caption{bottom:248px}.app.is-today .caption p,.app.is-today .caption h1{display:none}.console{position:absolute;left:0;right:0;bottom:0;height:236px;background:linear-gradient(#101313ee,#101313 13%);z-index:7;padding:0 22px 20px}.console-top{display:flex;align-items:center;justify-content:space-between;height:45px}.console-top p{font-size:10px;letter-spacing:1px;color:#c7cac1;margin:0}.today{display:flex;gap:5px;align-items:center;font-size:10px;min-height:44px;padding:0 1px 0 10px;color:#f0e8d8}.today iconify-icon{font-size:13px}.rail-wrap{position:relative;margin:3px 0 0}.rail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.frame{height:78px;padding:0;min-width:0;position:relative;opacity:.57;transition:opacity 140ms var(--ease);text-align:center}.frame[aria-pressed=true]{opacity:1}.thumb{height:53px;width:100%;background-image:url('./assets/memory-scenes.png');background-repeat:no-repeat;position:relative;border:1px solid #d7e0d219;border-radius:1px}.frame[aria-pressed=true] .thumb{border-color:#f2ead7;box-shadow:0 0 0 1px #f2ead74d}.frame time{font-size:9px;font-variant-numeric:tabular-nums;display:block;margin-top:9px;color:#d9dfd5;letter-spacing:.4px}.thumb.blank{background-image:none;background-color:#272d2b;display:grid;place-items:center;font-size:17px;font-weight:200;color:#b2b7ae}.ruler{height:8px;margin:6px 0 0;background:repeating-linear-gradient(90deg,#949e9457 0 1px,transparent 1px 5px);mask-image:linear-gradient(90deg,#000, #000)}.scrub{width:100%;height:38px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize;touch-action:none}.scrub::-webkit-slider-runnable-track{height:1px;background:#abb2a661}.scrub::-webkit-slider-thumb{-webkit-appearance:none;height:20px;width:4px;margin-top:-9.5px;border:0;border-radius:2px;background:#f6edda;box-shadow:0 0 0 8px #fff0}.scrub::-moz-range-track{height:1px;background:#abb2a661}.scrub::-moz-range-thumb{height:20px;width:4px;border:0;border-radius:2px;background:#f6edda}.console-bottom{display:flex;justify-content:space-between;align-items:center;color:#969f95;font-size:9px;letter-spacing:.5px;margin-top:0;gap:8px}.navigation{display:flex;gap:7px}.step{height:44px;width:44px;display:grid;place-items:center}.step iconify-icon{font-size:16px}.console-bottom .hint{line-height:1.8}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.app.dragging .caption{opacity:.75}.app.dragging .picture{cursor:grabbing}dialog{position:absolute;inset:auto 15px 18px;margin:0 auto;width:calc(100% - 30px);max-width:440px;max-height:70dvh;border:1px solid #ffffff20;background:#252b28;color:#eff1e8;border-radius:18px;padding:23px;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#07100d87;backdrop-filter:blur(6px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:15px}dialog h2{font-size:20px;font-weight:400;margin:0}dialog p{font-size:12px;line-height:1.9;color:#bdc8bb;margin:14px 0 0}dialog .close{height:44px;width:44px;display:grid;place-items:center;border-radius:50%;background:#ffffff0b}.app.motion-reduced *{transition:none!important}.app.motion-reduced .photo-layer{will-change:auto}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(max-height:680px){.picture{bottom:219px}.console{height:220px;padding-bottom:8px}.caption{bottom:223px}.caption h1{font-size:25px}.month-label{top:85px}.utility{height:74px;padding-top:7px}.app.is-today .caption{bottom:226px}.empty-today{inset:120px 20px 35px}.empty-today .line{height:45px;margin-bottom:15px}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const root=document.querySelector('.app'),range=document.querySelector('#timeRange'),picture=document.querySelector('#picture'),layerA=document.querySelector('#layerA'),layerB=document.querySelector('#layerB'),rail=document.querySelector('#rail'),reduce=matchMedia('(prefers-reduced-motion:reduce)');
 const records=[{day:2,scene:2,title:'走进一片绿',note:'林间散步'},{day:5,scene:0,title:'再看一眼海',note:'日子里的片刻'},{day:8,scene:2,title:'有光的森林',note:'放慢脚步'},{day:11,scene:1,title:'窗边的午后',note:'一杯咖啡的时间'},{day:13,scene:0,title:'去看海',note:'风把下午吹得很慢'},{day:15,scene:null,title:'今天',note:'新的回忆，展示后会留在这里'}];
 let value=4,drag=null,rangeOrigin=4,focusedBeforeDialog=null;
 function crop(el){const i=Number(el.dataset.scene);if(!Number.isInteger(i)||i<0)return;const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const d=Math.max(w,h);el.style.backgroundSize=`${d*3}px ${d}px`;el.style.backgroundPosition=`${-i*d-(d-w)/2}px ${(h-d)/2}px`;}
 function setScene(el,scene){if(scene===null){el.style.backgroundImage='none';el.dataset.scene='-1';return;}el.style.backgroundImage='';el.dataset.scene=scene;crop(el);}
 records.forEach((r,i)=>{const b=document.createElement('button');b.className='frame';b.dataset.index=i;b.setAttribute('aria-label',`9月${r.day}日${r.scene===null?'，今天暂无记录':'，'+r.title}`);b.innerHTML=`<div class="thumb ${r.scene===null?'blank':''}" ${r.scene===null?'':`data-scene="${r.scene}"`}>${r.scene===null?'·':''}</div><time>09.${String(r.day).padStart(2,'0')}</time>`;b.onclick=()=>commit(i);rail.appendChild(b);});
 function render(v,announce=false){value=Math.max(0,Math.min(5,Number(v)));range.value=value;const low=Math.floor(value),high=Math.min(5,Math.ceil(value)),fraction=value-low,index=Math.round(value),r=records[index];setScene(layerA,records[low].scene);setScene(layerB,records[high].scene);layerA.style.opacity=records[low].scene===null?'0':'1';layerB.style.opacity=records[high].scene===null?'0':String(reduce.matches?(fraction>=.5?1:0):fraction);if(high===5)layerA.style.opacity=String(1-fraction);root.classList.toggle('is-today',index===5);root.dataset.day=r.day;document.querySelector('#dayLabel').textContent=`09 / ${String(r.day).padStart(2,'0')}`;document.querySelector('#title').textContent=r.title;document.querySelector('#captionNote').textContent=r.note+' · 示例回忆';document.querySelector('#count').textContent=index===5?'今天尚无记录':`${index+1} / 5 段回忆`;range.setAttribute('aria-valuetext',`9月${r.day}日，${r.scene===null?'今天暂无记录':r.title}`);document.querySelectorAll('.frame').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));document.querySelector('#previous').disabled=value<=0;document.querySelector('#next').disabled=value>=5;if(announce)document.querySelector('#announcement').textContent=range.getAttribute('aria-valuetext');}
 function commit(v){render(Math.round(v),true);root.classList.remove('dragging');}
 range.addEventListener('pointerdown',()=>{rangeOrigin=value;root.classList.add('dragging');});range.addEventListener('input',e=>render(e.target.value));range.addEventListener('change',()=>commit(value));range.addEventListener('pointerup',()=>commit(value));range.addEventListener('pointercancel',()=>commit(rangeOrigin));
 function keyboard(e){const keys={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1};if(e.key in keys){e.preventDefault();commit(Math.round(value)+keys[e.key]);}else if(e.key==='Home'){e.preventDefault();commit(0);}else if(e.key==='End'){e.preventDefault();commit(5);}}
 range.addEventListener('keydown',keyboard);picture.addEventListener('keydown',keyboard);
 picture.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;drag={id:e.pointerId,x:e.clientX,start:value};picture.setPointerCapture(e.pointerId);root.classList.add('dragging');});picture.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;render(drag.start+(drag.x-e.clientX)/(picture.clientWidth*.5));});
 function endDrag(e,cancel){if(!drag||drag.id!==e.pointerId)return;const start=drag.start;drag=null;commit(cancel?start:value);if(picture.hasPointerCapture(e.pointerId))picture.releasePointerCapture(e.pointerId);}
 picture.addEventListener('pointerup',e=>endDrag(e,false));picture.addEventListener('pointercancel',e=>endDrag(e,true));picture.addEventListener('lostpointercapture',()=>{if(drag){const start=drag.start;drag=null;commit(start);}});
 document.querySelector('#today').onclick=()=>commit(5);document.querySelector('#recent').onclick=()=>commit(4);document.querySelector('#previous').onclick=()=>commit(Math.round(value)-1);document.querySelector('#next').onclick=()=>commit(Math.round(value)+1);
 const dialog=document.querySelector('#info');const messages={status:['客厅照片墙','已连接 · 示例状态。本 Demo 未连接真实设备。历史内容用于比较首页交互，不代表实际上屏回执。'],preferences:['偏好','这里进入已确认的偏好管理。此提案专注首页交互，偏好页保持现有产品结构。'],settings:['设置','设备与账户设置独立于偏好。连接状态始终显示在首页左上角。']};
 document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{focusedBeforeDialog=b;const m=messages[b.dataset.info];document.querySelector('#infoTitle').textContent=m[0];document.querySelector('#infoBody').textContent=m[1];dialog.showModal();});document.querySelector('#closeInfo').onclick=()=>dialog.close();dialog.addEventListener('close',()=>focusedBeforeDialog?.focus({preventScroll:true}));dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});
 const resize=new ResizeObserver(entries=>entries.forEach(e=>crop(e.target)));[layerA,layerB,...document.querySelectorAll('.thumb[data-scene]')].forEach(el=>resize.observe(el));reduce.addEventListener('change',()=>{root.classList.toggle('motion-reduced',reduce.matches);render(value);});root.classList.toggle('motion-reduced',reduce.matches);render(4);document.querySelectorAll('.thumb[data-scene]').forEach(crop);
});
</script>
</head>
<body><div class="app">
 <main class="picture" id="picture" tabindex="0" aria-label="拖动画面浏览回忆，也可使用方向键"><div class="photo-layer" id="layerA" aria-hidden="true"></div><div class="photo-layer" id="layerB" aria-hidden="true"></div><div class="empty-today"><div class="line" aria-hidden="true"></div><strong>给今天留一点期待</strong><p>新的回忆，<br>会在展示后留在这里。</p><button id="recent">回看最近一次 ↗</button></div></main>
 <header class="utility"><button class="connection" data-info="status" aria-label="连接状态，已连接，示例"><span class="dot"></span>已连接 <span class="sample">示例</span></button><nav class="nav" aria-label="首页功能"><button class="preferences" data-info="preferences">偏好</button><button class="settings" data-info="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button></nav></header>
 <div class="month-label"><strong>回忆日历</strong><span>2026 / 09</span><i class="film-corner" aria-hidden="true"></i></div>
 <div class="caption"><div class="date" id="dayLabel">09 / 13</div><h1 id="title">去看海</h1><p id="captionNote">风把下午吹得很慢 · 示例回忆</p></div>
 <section class="console" aria-label="回忆胶片"><div class="console-top"><p id="count">5 / 5 段回忆</p><button class="today" id="today">今天<iconify-icon icon="lucide:corner-up-right" aria-hidden="true"></iconify-icon></button></div><div class="rail-wrap"><div class="rail" id="rail"></div><div class="ruler" aria-hidden="true"></div><input class="scrub" id="timeRange" type="range" min="0" max="5" step="0.001" value="4" aria-label="拖动时间轨道浏览回忆"></div><div class="console-bottom"><span class="hint">拖动胶片，停在想回看的那一刻</span><div class="navigation"><button id="previous" class="step" aria-label="上一段回忆"><iconify-icon icon="lucide:arrow-left" aria-hidden="true"></iconify-icon></button><button id="next" class="step" aria-label="下一段回忆"><iconify-icon icon="lucide:arrow-right" aria-hidden="true"></iconify-icon></button></div></div></section>
 <span class="sr-only" id="announcement" role="status" aria-live="polite"></span><dialog id="info" aria-labelledby="infoTitle"><div class="dialog-head"><h2 id="infoTitle">设置</h2><button class="close" id="closeInfo" aria-label="关闭"><iconify-icon icon="lucide:x" aria-hidden="true"></iconify-icon></button></div><p id="infoBody"></p></dialog>
</div></body></html>
