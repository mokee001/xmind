<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>三种首页，三种交互 · 回忆日历</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#f0f0ed;background:#171a1c;--muted:#a1aaa9;--rule:#333a3c;--scale:1;--phone-width:393px;--phone-height:852px;-webkit-font-smoothing:antialiased;font-synthesis:none;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-width:300px}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a,button{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid #e3ddd0;outline-offset:4px}.canvas{padding:28px 30px 20px;min-height:100dvh;max-width:1400px;margin:auto}.header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--rule)}.eyebrow{margin:0 0 8px;font-size:10px;letter-spacing:.05em;color:#bec7c5}.eyebrow i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#aac5b8;vertical-align:1px;margin-right:7px}h1{font-size:22px;line-height:1.4;font-weight:500;letter-spacing:-.02em;margin:0}.archive-link{font-size:11px;color:#a1aaa9;padding:8px 0;white-space:nowrap}.archive-link span{margin-left:6px}.switcher{display:none}.prototypes{display:flex;gap:26px;align-items:flex-start;justify-content:center;margin-top:24px}.prototype{width:var(--phone-width);flex:0 0 var(--phone-width);min-width:0}.prototype-heading{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:0 1px 11px}.prototype-heading h2{font-size:12px;font-weight:500;letter-spacing:0;line-height:1.45;margin:0;white-space:nowrap}.number{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8c9996;font-size:10px;margin-right:7px}.open-link{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);white-space:nowrap;min-height:30px}.open-link svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.5}.device{width:var(--phone-width);height:var(--phone-height);overflow:hidden;border-radius:24px;background:#e9e7df;box-shadow:0 0 0 1px #b2bbb52b,0 14px 28px #0002;position:relative}iframe{display:block;width:393px;height:852px;border:0;transform:scale(var(--scale));transform-origin:top left;color-scheme:normal;background:#e9e7df}.instructions{font-size:11px;line-height:1.75;color:#a1aaa9;margin:13px 1px 0;letter-spacing:0}.instructions strong{font-weight:500;color:#d5ded9}.footnote{font-size:10px;color:#7e8a87;text-align:center;line-height:1.6;margin:18px 0 0}
    @media(hover:hover){a:hover{color:#fff}.switcher button:hover{background:#323a3c;color:#fff}}
    @media(max-width:1100px) and (min-width:901px){.canvas{padding-left:22px;padding-right:22px}.prototypes{gap:20px}.prototype-heading h2{font-size:11px}.number{margin-right:5px;font-size:9px}.open-link{font-size:9px}.instructions{font-size:10px}}
    @media(max-width:900px){
      .canvas{max-width:520px;height:100dvh;min-height:780px;display:flex;flex-direction:column;padding:14px 12px 12px;overflow:visible}.header{padding:0 2px;border:0;align-items:center;gap:8px;flex:none}.eyebrow{font-size:9px;letter-spacing:0;margin-bottom:6px}h1{font-size:16px;line-height:1.3}.archive-link{font-size:10px;padding:8px 0}.switcher{display:flex;gap:4px;padding:3px;border:1px solid var(--rule);background:#212729;border-radius:9px;margin-top:14px;flex:none}.switcher button{border:0;background:transparent;color:#a9b3b0;padding:10px 4px;border-radius:5px;font-size:11px;flex:1;white-space:nowrap;min-height:36px}.switcher button[aria-pressed="true"]{background:#3b4645;color:#f6f8f6}.prototypes{display:flex;align-items:stretch;flex:1;min-height:626px;margin-top:10px;gap:0}.prototype{width:100%;flex:1;display:flex;flex-direction:column;min-height:626px}.prototype:not(.is-active){display:none}.prototype-heading{flex:none;margin:0 3px 7px}.prototype-heading h2{font-size:11px}.number{font-size:9px}.open-link{font-size:10px;min-height:31px}.device{width:100%;height:auto;flex:1;min-height:560px;border-radius:17px}.device iframe{position:absolute;inset:0;width:100%;height:100%;transform:none}.instructions{font-size:10px;margin:9px 3px 0;flex:none}.footnote{font-size:9px;margin:10px 0 0;flex:none}
    }
    @media(max-width:350px){.canvas{padding-right:9px;padding-left:9px}.header h1{font-size:14px}.archive-link{font-size:9px}.switcher button{font-size:10px}.prototype-heading h2{font-size:10px}.instructions{font-size:9px}.number{margin-right:5px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
  </style>
  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const names=['paper','weave','film'];
      const buttons=[...document.querySelectorAll('[data-target]')];
      const screens=[...document.querySelectorAll('[data-prototype]')];
      const mobile=matchMedia('(max-width:900px)');
      let active=names.includes(location.hash.slice(1))?location.hash.slice(1):'paper';
      function setActive(name,updateHash=true){
        if(!names.includes(name))return;
        active=name;
        buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.target===name)));
        screens.forEach(screen=>{
          const chosen=screen.dataset.prototype===name;
          screen.classList.toggle('is-active',chosen);
          screen.inert=mobile.matches&&!chosen;
        });
        if(updateHash)history.replaceState(null,'','#'+name);
      }
      buttons.forEach((button,index)=>{
        button.addEventListener('click',()=>setActive(button.dataset.target));
        button.addEventListener('keydown',event=>{
          let next;
          if(event.key==='ArrowRight')next=(index+1)%buttons.length;
          else if(event.key==='ArrowLeft')next=(index+buttons.length-1)%buttons.length;
          else if(event.key==='Home')next=0;
          else if(event.key==='End')next=buttons.length-1;
          else return;
          event.preventDefault();buttons[next].focus();setActive(buttons[next].dataset.target);
        });
      });
      function fit(){
        setActive(active,false);
        if(mobile.matches)return;
        const container=document.querySelector('.canvas');
        const styles=getComputedStyle(container);
        const padding=parseFloat(styles.paddingLeft)+parseFloat(styles.paddingRight);
        const gap=parseFloat(getComputedStyle(document.querySelector('.prototypes')).gap);
        const availableWidth=(container.clientWidth-padding-gap*2)/3;
        const scale=Math.min(1,availableWidth/393,Math.max(.58,(innerHeight-232)/852));
        document.documentElement.style.setProperty('--scale',scale);
        document.documentElement.style.setProperty('--phone-width',`${393*scale}px`);
        document.documentElement.style.setProperty('--phone-height',`${852*scale}px`);
      }
      window.addEventListener('resize',fit,{passive:true});
      window.addEventListener('hashchange',()=>setActive(location.hash.slice(1)||'paper',false));
      setActive(active,false);fit();
    });
  </script>
</head>
<body>
<main class="canvas">
  <header class="header"><div><p class="eyebrow"><i aria-hidden="true"></i>可操作原型 · 示例内容</p><h1>三种首页，三种打开时间的方式</h1></div><a class="archive-link" href="../concepts/">上一轮概念图<span aria-hidden="true">↗</span></a></header>
  <nav class="switcher" aria-label="切换首页交互方案"><button type="button" data-target="paper" aria-controls="prototype-paper" aria-pressed="true">01 纸面</button><button type="button" data-target="weave" aria-controls="prototype-weave" aria-pressed="false">02 织毯</button><button type="button" data-target="film" aria-controls="prototype-film" aria-pressed="false">03 长卷</button></nav>
  <div class="prototypes">
    <section class="prototype is-active" id="prototype-paper" data-prototype="paper" aria-labelledby="title-paper"><div class="prototype-heading"><h2 id="title-paper"><span class="number">01</span>纸面 · 逐日翻阅</h2><a class="open-link" href="./paper.html" target="_blank" rel="noopener" aria-label="独立打开纸面逐日翻阅">独立打开<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 2 10"/></svg></a></div><div class="device"><iframe src="./paper.html" title="纸面：首页可操作原型，逐日翻阅" loading="eager"></iframe></div><p class="instructions"><strong>翻一页，过一天。</strong> 左右滑动纸面，点照片展开。</p></section>
    <section class="prototype" id="prototype-weave" data-prototype="weave" aria-labelledby="title-weave"><div class="prototype-heading"><h2 id="title-weave"><span class="number">02</span>织毯 · 整月探索</h2><a class="open-link" href="./weave.html" target="_blank" rel="noopener" aria-label="独立打开织毯整月探索">独立打开<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 2 10"/></svg></a></div><div class="device"><iframe src="./weave.html" title="织毯：首页可操作原型，整月探索" loading="eager"></iframe></div><p class="instructions"><strong>先看整月，再走进某天。</strong> 点 13 日，体验展开与收回。</p></section>
    <section class="prototype" id="prototype-film" data-prototype="film" aria-labelledby="title-film"><div class="prototype-heading"><h2 id="title-film"><span class="number">03</span>长卷 · 拖动定位</h2><a class="open-link" href="./film.html" target="_blank" rel="noopener" aria-label="独立打开长卷拖动定位">独立打开<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 2 10"/></svg></a></div><div class="device"><iframe src="./film.html" title="长卷：首页可操作原型，拖动定位" loading="eager"></iframe></div><p class="instructions"><strong>用时间轴寻找回忆。</strong> 拖动底部胶片，画面随日期变化。</p></section>
  </div>
  <p class="footnote">照片与连接状态均为示例 · 本轮仅比较首页布局与交互</p>
</main>
</body>
</html>
