mory-image .image-open{position:absolute;bottom:10px;right:10px;width:26px;height:26px;border:1px solid rgba(255,255,255,.55);border-radius:50%;color:white;display:grid;place-items:center;z-index:1;background:rgba(33,46,37,.12)}.memory-image .image-open iconify-icon{width:13px;height:13px;font-size:13px}.memory-label{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:9px}.memory-label strong{font-size:12px;font-weight:450}.memory-label span{font-size:8px;letter-spacing:.08em;color:#92968a;white-space:nowrap}.navigation{position:relative;z-index:11;display:flex;align-items:center;justify-content:space-between;margin:30px 27px 0;gap:15px}.nav-day{border:0;background:none;display:flex;align-items:center;gap:6px;padding:12px 0;font-size:11px}.nav-day iconify-icon{width:15px;height:15px;font-size:15px}.page-count{font-family:"Helvetica Neue",Arial,sans-serif;font-size:10px;color:#8a8d83;letter-spacing:.13em;font-variant-numeric:tabular-nums}.footer{min-height:44px;position:relative;z-index:11;display:flex;justify-content:center;align-items:center;height:39px;gap:10px;padding:0 24px;color:#93968a;font-size:10px;letter-spacing:.025em}.today-button{border:0;border-bottom:1px solid #969b8d;background:none;padding:4px 0;color:#606854;font-size:10px}.home-indicator{height:4px;width:104px;background:#33382f;border-radius:4px;margin:19px auto 12px;opacity:.45}.dialog-backdrop{position:fixed;z-index:30;inset:0;background:rgba(37,40,32,.32);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);padding:18px}.dialog-backdrop[hidden]{display:none}.dialog{position:relative;width:min(100%,430px);max-height:calc(100dvh - 52px);overflow:auto;background:#f8f7f2;padding:26px 24px 28px;box-shadow:0 20px 60px rgba(31,34,26,.18);border-radius:5px}.dialog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog h2{margin:0;font-size:19px;font-weight:450;letter-spacing:.03em}.close-dialog{border:1 <script>
document.addEventListener('DOMContentLoaded',()=>{
  const $=id=>document.getElementById(id);
  const page=$('page'), content=$('pageContent'), motion=matchMedia('(prefers-reduced-motion: reduce)');
  const entries={13:{title:'去看海',scene:0,description:'海风吹过的那个下午。'},11:{title:'窗边的午后',scene:50,description:'一杯咖啡，把下午留得很长。'},8:{title:'走进一片绿',scene:100,description:'沿着树影，慢慢走。'},5:{title:'潮水的声音',scene:0,description:'又一次，想起海。'},2:{title:'山林里的周末',scene:100,description:'日光穿过林间的那一刻。'}};
  const englishDays=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const chineseDays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const arrow='<iconify-icon icon="lucide:arrow-up-right" aria-hidden="true"></iconify-icon>';
  const imageObserver=new ResizeObserver(items=>items.forEach(({target})=>{const width=target.clientWidth,height=target.clientHeight,size=Math.max(width,height),index=Number(target.dataset.scene);target.style.backgroundSize=`${size*3}px ${size}px`;target.style.backgroundPosition=`${-(index*size+(size-width)/2)}px ${(height-size)/2}px`;}));
  let day=15, animation=null, gesture=null, ignoreClick=false, lastFocus=null;
  // The gesture owns its starting day. Repeated or foreign pointer events cannot accumulate flips.
  function render(){
    imageObserver.disconnect();
    const date=new Date(2026,8,day), record=entries[day];page.dataset.record=record?'true':'false';
    $('dayNumber').textContent=String(day).padStart(2,'0');$('weekday').textContent=englishDays[date.getDay()];
    $('pageSubtitle').textContent=day===15?'今天':chineseDays[date.getDay()];
    $('pageCount').textContent=String(day).padStart(2,'0')+' / 15';$('previousDay').disabled=day===1;$('nextDay').disabled=day===15;$('todayButton').hidden=day===15;
    page.setAttribute('aria-label',`2026 年 9 月 ${day} 日，${day===15?'今天':chineseDays[date.getDay()]}。${record?record.title:'暂无回忆记录'}。左右轻扫翻页`);
    if(record){
      content.innerHTML=`<button class="memory-image" id="memoryButton" data-scene="${record.scene/50}" style="background-position:${record.scene}% center" aria-label="打开 9 月 ${day} 日示例回忆：${record.title}"><span class="image-open">${arrow}</span></button><div class="memory-label"><strong>${record.title}</strong><span>已展示 · 示例</span></div>`;
      imageObserver.observe($('memoryButton'));
      $('memoryButton').addEventListener('click',()=>{if(!ignoreClick)openMemory();});
    }else{
      content.innerHTML=`<div class="empty-line"></div><p class="empty-message">${day===15?'今天，慢慢经过。<br>回忆会在它到来时留下。':'这一天，还没有留下回忆。'}</p>${day===15?`<button class="recent-button" id="recentButton">回看最近一次 ${arrow}</button>`:''}`;
      $('recentButton')?.addEventListener('click',()=>goTo(13));
    }
    $('announcement').textContent=`9 月 ${day} 日，${record?record.title:'暂无回忆记录'}`;
  }
  function settle(){const previousAnimation=animation;animation=null;previousAnimation?.cancel();page.style.transform='';page.style.opacity='';}
  function animatePage(frames,duration){
    const current=page.animate(frames,{duration,easing:'cubic-bezier(.2,0,0,1)'});animation=current;
    current.onfinish=()=>{if(animation===current)animation=null;};
  }
  function cancelGesture(){
    const previousGesture=gesture;gesture=null;
    if(previousGesture&&page.hasPointerCapture(previousGesture.id))page.releasePointerCapture(previousGesture.id);
    settle();
  }
  function goTo(next,dragOffset=null){
    cancelGesture();next=Math.max(1,Math.min(15,next));const previous=day;
    if(next===day){if(dragOffset!==null&&!motion.matches)animatePage([{transform:`translateX(${dragOffset*.17}px) rotateY(${dragOffset/28}deg)`},{transform:'none'}],200);return;}
    day=next;render();
    if(!motion.matches){const sign=next<previous?1:-1;animatePage([{transform:`translateX(${sign*24}px) rotateY(${sign*-13}deg)`,opacity:.65},{transform:'translateX(0) rotateY(0)',opacity:1}],320);}
  }
  $('previousDay').addEventListener('click',()=>goTo(day-1));$('nextDay').addEventListener('click',()=>goTo(day+1));$('todayButton').addEventListener('click',()=>goTo(15));
  page.addEventListener('pointerdown',event=>{
    if(gesture||event.isPrimary===false||event.button!==0||(event.target.closest('button')&&!event.target.closest('.memory-image')))return;
    settle();ignoreClick=false;
    gesture={id:event.pointerId,dayAtStart:day,startX:event.clientX,startY:event.clientY,dx:0,dragged:false,committed:false,startedAt:performance.now()};
  });
  page.addEventListener('pointermove',event=>{
    const active=gesture;if(!active||event.pointerId!==active.id||active.committed)return;
    active.dx=event.clientX-active.startX;const dy=event.clientY-active.startY;
    if(!active.dragged&&Math.abs(dy)>Math.abs(active.dx)+8){cancelGesture();return;}
    if(Math.abs(active.dx)>8&&!active.dragged){active.dragged=true;page.setPointerCapture(active.id);}
    if(active.dragged&&!motion.matches){const resistance=((active.dayAtStart===15&&active.dx>0)||(active.dayAtStart===1&&active.dx<0))?0.22:1;page.style.transform=`translateX(${active.dx*.17*resistance}px) rotateY(${active.dx/28*resistance}deg)`;}
  });
  function release(event){
    const active=gesture;if(!active||event.pointerId!==active.id||active.committed)return;
    // Consume before releasing capture or rendering: both can synchronously dispatch more events.
    active.committed=true;gesture=null;
    if(page.hasPointerCapture(active.id))page.releasePointerCapture(active.id);
    ignoreClick=active.dragged;
    const velocity=Math.abs(active.dx)/Math.max(1,performance.now()-active.startedAt);
    const shouldTurn=active.dragged&&(Math.abs(active.dx)>54||(Math.abs(active.dx)>24&&velocity>.45));
    const target=active.dayAtStart+(shouldTurn?(active.dx<0?-1:1):0);
    goTo(target,active.dx);
  }
  page.addEventListener('pointerup',release);
  page.addEventListener('pointercancel',event=>{if(gesture?.id===event.pointerId)cancelGesture();});
  page.addEventListener('lostpointercapture',event=>{if(gesture?.id===event.pointerId)cancelGesture();});
  page.addEventListener('click',event=>{if(ignoreClick){ignoreClick=false;event.preventDefault();event.stopImmediatePropagation();}},true);
  document.addEventListener('keydown',event=>{
    if(!$('dialogBackdrop').hidden||gesture)return;
    if(event.key==='ArrowLeft'){event.preventDefault();goTo(day-1);}
    if(event.key==='ArrowRight'){event.preventDefault();goTo(day+1);}
  });
  function openDialog(title,html){lastFocus=document.activeElement;$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialogBackdrop').hidden=false;$('closeDialog').focus();}
  function closeDialog(){$('dialogBody').querySelectorAll('.detail-image').forEach(element=>imageObserver.unobserve(element));$('dialogBackdrop').hidden=true;lastFocus?.focus();}
  $('closeDialog').addEventListener('click',closeDialog);$('dialogBackdrop').addEventListener('click',event=>{if(event.target===$('dialogBackdrop'))closeDialog();});
  document.addEventListener('keydown',event=>{if($('dialogBackdrop').hidden)return;if(event.key==='Escape'){event.preventDefault();closeDialog();}if(event.key==='Tab'){const focusable=[...$('dialogBackdrop').querySelectorAll('button:not(:disabled),[tabindex="0"]')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
  $('monthButton').addEventListener('click',()=>{
    let cells='<span></span><span></span>';for(let n=1;n<=30;n++)cells+=`<button data-date="${n}" ${n>15?'disabled':''} ${entries[n]?'data-record="true"':''} ${n===day?'aria-current="date"':''} aria-label="9 月 ${n} 日${n>15?'，未来日期':entries[n]?'，有示例回忆':'，暂无回忆记录'}">${n}</button>`;
    openDialog('2026 年 9 月',`<p>选一个日子，直接翻到那一页。</p><div class="directory-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="directory-grid">${cells}</div><p class="directory-note">日期下的圆点，代表已经展示过的示例回忆。</p>`);
    $('dialogBody').querySelectorAll('[data-date]:not(:disabled)').forEach(button=>button.addEventListener('click',()=>{closeDialog();goTo(Number(button.dataset.date));}));
  });
  function openMemory(){const record=entries[day];if(!record)return;openDialog('这一页的回忆',`<p class="detail-date">2026 / 09 / ${String(day).padStart(2,'0')} · 示例记录</p><div class="detail-image" data-scene="${record.scene/50}" role="img" aria-label="${record.title}，概念示例图" style="background-position:${record.scene}% center"></div><strong>${record.title}</strong><p>${record.description}</p><p class="detail-note" style="margin-top:15px">此处回看已展示内容。画面与上屏记录均为演示示例。</p>`);imageObserver.observe($('dialogBody').querySelector('.detail-image'));}
  const info={connection:['照片墙连接','此处常驻显示照片墙的连接状态。本 Demo 使用“已连接”示例，没有连接真实设备。'],preference:['偏好','从这里管理人物与内容偏好。首页可以随时进入；保存后，筛选会继续在后台完成。此版仅演示首页交互。'],settings:['设置','设备与账户管理在这里，与偏好是同级入口。连接状态始终保留在首页左上角。此版仅演示首页交互。']};
  document.querySelectorAll('[data-info]').forEach(button=>button.addEventListener('click',()=>{const item=info[button.dataset.info];openDialog(item[0],`<p>${item[1]}</p><button class="sheet-action" id="acknowledge">知道了</button>`);$('acknowledge').addEventListener('click',closeDialog);}));
  motion.addEventListener('change',()=>cancelGesture());render();
});
</script>

<body>
<div id="root">
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="status-line" aria-hidden="true"><span>9:41</span><div class="status-icons"><span class="signal">▂▄▆█</span><iconify-icon icon="lucide:wifi" aria-hidden="true"></iconify-icon><span class="battery"></span></div></div>
  <header class="app-header"><button class="connected" data-info="connection" aria-label="连接状态：已连接，示例">已连接 <span>· 示例</span></button><div class="header-actions"><button class="preference" data-info="preference">偏好</button><button class="settings" data-info="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button></div></header>
  <section class="intro"><h1>回忆日历</h1><button class="month-button" id="monthButton" aria-label="打开 2026 年 9 月日期目录">2026 / 09<iconify-icon icon="lucide:chevron-down" aria-hidden="true"></iconify-icon></button></section>
  <main class="stage" aria-label="一天一页的回忆日历">
    <div class="under-sheet" aria-hidden="true"></div><div class="under-sheet second" aria-hidden="true"></div>
    <article class="page" id="page" tabindex="0" aria-label="2026 年 9 月 15 日，今天。左右轻扫翻页">
      <div class="page-meta"><span id="weekday">TUESDAY</span><span>SEPTEMBER · 2026</span></div>
      <div class="date" id="dayNumber">15</div><p class="page-subtitle" id="pageSubtitle">今天</p>
      <div class="page-content" id="pageContent"></div>
    </article>
  </main>
