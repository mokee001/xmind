<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eeeae1">
<title>回忆织毯 · 月度地图</title>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
:root{--canvas:#eeeae1;--ink:#242e32;--muted:#696f6d;--fiber:#dbd8c9;--accent:#9d492f;--fast:120ms;--change:200ms;--large:320ms;--ease:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas)}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #245f80;outline-offset:4px}button:active{transform:scale(.98)}button{transition:background-color var(--fast) var(--ease),transform var(--fast) var(--ease)}[hidden]{display:none!important}.app{width:min(100%,480px);min-height:100dvh;margin:auto;padding:0 25px 24px;position:relative;overflow:hidden}.app::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.42' filter='url(%23n)'/%3E%3C/svg%3E")}.system-bar{height:39px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;padding:0 1px}.system-icons{display:flex;gap:5px;align-items:center}.system-icons iconify-icon{width:14px;height:14px}.topbar{height:50px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:2}.connection{border:0;background:none;padding:10px 0;font-size:11px;letter-spacing:.01em;white-space:nowrap}.connection .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#3d7766;margin-right:5px;vertical-align:2px}.nav-actions{display:flex;gap:14px;align-items:center}.nav-actions button{border:0;background:none;padding:10px 0;font-size:12px;min-width:32px;min-height:44px}.nav-actions .gear{width:28px;display:grid;place-items:center}.gear iconify-icon{height:19px;width:19px;stroke-width:1.5}.title-block{display:flex;align-items:flex-end;justify-content:space-between;margin:25px 0 25px}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--muted);margin:0 0 8px}.title-block h1{font-size:29px;line-height:1.2;font-weight:500;letter-spacing:-.07em;margin:0}.month-control{background:transparent;border:0;border-bottom:1px solid #8d9189;padding:4px 0 6px;font-size:12px;letter-spacing:.05em}.loom{position:relative;margin:0 0 12px;padding:0 0 11px;isolation:isolate}.loom::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#a9a38e 0 1px,transparent 1px 3px);mask-image:linear-gradient(#000,#0000);opacity:.55}.month-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;aspect-ratio:5/6;position:relative;background:#d8d5c7;isolation:isolate;box-shadow:0 8px 14px -13px #534b3d}.month-grid::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:4;box-shadow:inset 0 0 0 1px #5a4b3b15;background:repeating-linear-gradient(0deg,transparent 0 1px,#493b2514 1px 2px,transparent 2px 4px),repeating-linear-gradient(90deg,#ffffff17 0 1px,transparent 1px 3px);mix-blend-mode:multiply}.day{border:0;padding:0;position:relative;border-radius:0;min-width:0;isolation:isolate;background-color:var(--day-color,#d5d1bd);text-align:left;overflow:hidden;box-shadow:inset -.5px 0 #ede8d25e,inset 0 -.5px #ede8d259;color:#323a37}.day::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,#fff4 2px 3px,transparent 3px 4px),repeating-linear-gradient(90deg,#4336271c 0 1px,transparent 1px 3px);mix-blend-mode:multiply;z-index:2;pointer-events:none}.day .number{position:absolute;top:9px;left:10px;z-index:3;font-size:13px;font-weight:550;line-height:1;letter-spacing:-.03em}.day.record{color:white;background-image:linear-gradient(#14302b12,#062e3940),url('./assets/memory-scenes.png');background-size:100% 100%,300% 100%;background-position:center,var(--photo-position);background-repeat:no-repeat}.day.record::before{mix-blend-mode:normal;opacity:.7;background:repeating-linear-gradient(0deg,#e9e9d552 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#193f4338 0 1px,transparent 1px 3px)}.day.record .number{background:#112e3878;border-radius:1px;top:6px;left:6px;padding:3px 4px;font-weight:600;min-width:19px;text-align:center}.stitch{position:absolute;bottom:10px;right:10px;height:7px;width:7px;z-index:3;border:1.3px solid currentColor;transform:rotate(45deg)}.day.today{background:#be654c;color:#fff;box-shadow:inset 0 0 0 2px #7a352c}.day.today .today-label{position:absolute;bottom:10px;left:10px;font-size:9px;letter-spacing:.06em;z-index:3}.day.future{background:repeating-linear-gradient(90deg,#cfcbbc 0 1px,#e7e3d7 1px 4px);color:#747b75;cursor:default;box-shadow:none}.day.future::before{background:linear-gradient(#cac5b933,transparent);mix-blend-mode:normal}.day.future .number{font-weight:400;font-size:11px;opacity:.8}.day:hover:not(.future){filter:brightness(1.07)}.day:focus-visible{outline:2px solid #112c37;outline-offset:-3px;z-index:5}.day.record:focus-visible{outline-color:white}.day.future:active{transform:none}.loom-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:10px;color:var(--muted);margin:17px 0 0}.caption-legend{display:flex;align-items:center;gap:6px}.caption-legend i{width:5px;height:5px;display:inline-block;transform:rotate(45deg);border:1px solid #727a74}.overview-footer{margin-top:26px;padding-top:16px;border-top:1px solid #d1cec3;display:flex;justify-content:space-between;align-items:center}.overview-footer p{margin:0;font-size:12px;line-height:1.75;color:#5f6763}.overview-footer strong{color:var(--ink);font-size:12px;font-weight:500}.today-btn{background:transparent;border:1px solid #adafa4;border-radius:50%;height:44px;width:44px;font-size:11px;flex:none}.today-btn:hover{background:#dfdfd3}.fineprint{font-size:9px;color:#767d78;line-height:1.6;margin:20px 0 0;text-align:center}.selected-view{padding-top:20px}.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:9px 0;font-size:12px}.back iconify-icon{width:14px;height:14px}.selection-context{display:flex;gap:20px;align-items:center;margin:14px 0 24px}.mini-loom{width:79px;flex:none;aspect-ratio:5/6;display:grid;grid-template-columns:repeat(5,1fr);position:relative}.mini-day{background:var(--day-color,#d5d1bd);box-shadow:inset -.5px 0 #fff4,inset 0 -.5px #fff4}.mini-day.record{background-image:url('./assets/memory-scenes.png');background-size:300% 100%;background-position:var(--photo-position)}.mini-day.future{background:repeating-linear-gradient(90deg,#d0ccbd 0 1px,#e8e4d9 1px 3px);box-shadow:none}.mini-day.selected{position:relative;box-shadow:inset 0 0 0 2px var(--ink)}.mini-day.selected::after{content:"";position:absolute;inset:4px;background:var(--ink);border:1px solid #eee}.selected-heading .eyebrow{margin-bottom:6px}.selected-heading h2{font-weight:450;font-size:42px;line-height:1;margin:0;letter-spacing:-.08em}.selected-heading h2 span{font-size:16px;letter-spacing:.03em;margin-left:7px}.selected-heading p{font-size:10px;color:var(--muted);margin:10px 0 0}.memory-photo{height:clamp(230px,39dvh,340px);width:100%;background-image:url('./assets/memory-scenes.png');background-size:300% 100%;background-position:var(--photo-position);position:relative;box-shadow:0 5px 10px -9px #252d22}.memory-photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #2221}.detail-title{font-weight:500;font-size:23px;line-height:1.35;letter-spacing:-.05em;margin:20px 0 7px}.detail-copy{font-size:12px;color:#616a64;line-height:1.75;margin:0;max-width:28em}.detail-footer{margin-top:22px;padding-top:17px;border-top:1px solid #d1cec3;display:flex;align-items:center;justify-content:space-between}.detail-footer span{font-size:10px;color:#6d756e}.return-month{font-size:12px;background:transparent;border:0;padding:10px 0;text-decoration:underline;text-underline-offset:5px}.empty-weave{height:clamp(220px,35dvh,295px);position:relative;background:repeating-linear-gradient(90deg,#c9c7b8 0 1px,#dedbcf 1px 4px);display:flex;align-items:center;justify-content:center}.empty-weave::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(0deg,#c6c4b560 0 1px,#d9d7c38f 1px 4px);border-top:1px solid #b5b7a7}.empty-mark{font-size:74px;font-weight:300;color:#626e6950;position:relative;z-index:1;letter-spacing:-.07em}.empty-title{font-size:21px;margin-top:24px}.selected-view,.overview{animation:reveal var(--large) var(--ease)}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}dialog{background:#f6f4ed;border:1px solid #d4d3c8;border-radius:2px;color:var(--ink);padding:26px;max-width:340px;width:calc(100% - 44px);box-shadow:0 20px 60px #18352938}dialog::backdrop{background:#27342d65;backdrop-filter:blur(3px)}dialog h2{font-size:20px;font-weight:500;line-height:1.4;margin:0 0 12px}dialog p{font-size:13px;line-height:1.85;color:#606b62;margin:0}dialog button{display:block;min-height:44px;padding:11px 20px;margin:22px 0 0 auto;border:0;background:#2e3b35;color:#fff;border-radius:2px;font-size:12px}.status-note{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:max-content;max-width:calc(100% - 50px);background:#263831;color:white;font-size:12px;line-height:1.5;padding:12px 16px;border-radius:2px;z-index:8;pointer-events:none;text-align:center}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:360px){.app{padding:0 21px 20px}.title-block{margin-top:17px;margin-bottom:21px}.title-block h1{font-size:27px}.nav-actions{gap:10px}.connection{font-size:10px}.overview-footer{margin-top:20px}.selection-context{margin:10px 0 20px}}
@media(max-height:760px) and (min-width:361px){.app{padding-left:31px;padding-right:31px}.system-bar{height:30px}.topbar{height:44px}.title-block{margin:15px 0 20px}.title-block h1{font-size:27px}.overview-footer{margin-top:17px;padding-top:12px}.fineprint{margin-top:14px}.selection-context{margin:8px 0 17px}.selected-view{padding-top:10px}.memory-photo{height:30dvh}.detail-title{margin-top:15px}.detail-footer{margin-top:15px}}
@media(prefers-reduced-motion:reduce){:root{--fast:0ms;--change:0ms;--large:0ms}.selected-view,.overview{animation:none}button:active{transform:none}dialog::backdrop{backdrop-filter:none}}
.month-grid,.mini-loom{view-transition-name:weave-map}::view-transition-group(weave-map){animation-duration:var(--large);animation-timing-function:var(--ease)}::view-transition-old(root),::view-transition-new(root){animation-duration:var(--change)}
iconify-icon{display:inline-block;font-size:19px;vertical-align:middle}.system-icons iconify-icon,.back iconify-icon{font-size:14px}.connection,.nav-actions button,.month-control,.back,.return-month{min-height:44px;min-width:44px}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const root=document.querySelector('.app'),grid=document.querySelector('.month-grid'),mini=document.querySelector('.mini-loom'),overview=document.querySelector('.overview'),selected=document.querySelector('.selected-view'),dialog=document.querySelector('dialog');
  const memories={2:{scene:'forest',title:'走进一片安静',copy:'树影、山路，还有一起慢下来的那一天。'},5:{scene:'sea',title:'风从海面吹来',copy:'一些已经过去的日子，仍然留着海的颜色。'},8:{scene:'forest',title:'把绿色带回来',copy:'那天的脚步很轻，风也刚刚好。'},11:{scene:'cafe',title:'一杯咖啡的时间',copy:'不赶路的午后，也值得留在这里。'},13:{scene:'sea',title:'海边的那一天',copy:'阳光落在水面上，记得那时的好天气。'}};
  const positions={sea:'0% center',cafe:'50% center',forest:'100% center'},colors=['#c6c3a9','#37666b','#ba6d50','#b5bb9e','#5a8c92','#d2b77c','#a5a991','#4b6351','#ba8b63','#cab795','#80604a','#a2a58e','#517b83','#aeb4a2','#be654c'];
  let selectedDay=null,lastTrigger=null,noteTimer,viewTransition;
  const media=document.querySelector('.memory-photo');
  function coverScene(){const w=media.clientWidth,h=media.clientHeight;if(!w||!h)return;const d=Math.max(w,h),index=Number(media.dataset.scene||0);media.style.backgroundSize=`${d*3}px ${d}px`;media.style.backgroundPosition=`${-(index*d+(d-w)/2)}px ${(h-d)/2}px`;}
  const mediaResize=new ResizeObserver(coverScene);mediaResize.observe(media);
  function changeView(action){if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches){if(viewTransition)viewTransition.skipTransition();viewTransition=document.startViewTransition(action);}else action();}
  function makeDays(container,isMini=false){
    for(let d=1;d<=30;d++){
      const m=memories[d],el=document.createElement(isMini?'span':'button');
      el.className=(isMini?'mini-day':'day')+(m?' record':'')+(d===15?' today':'')+(d>15?' future':'');
      el.dataset.day=d;el.style.setProperty('--day-color',colors[d-1]||'#e7e3d7');
      if(m)el.style.setProperty('--photo-position',positions[m.scene]);
      if(!isMini){
        el.type='button';el.id='weave-day-'+d;
        el.setAttribute('aria-label',`9月${d}日${d===15?'，今天':''}，${m?'有示例回忆':d>15?'未来日期':'暂无回忆'}`);
        if(d===15)el.setAttribute('aria-current','date');
        if(d>15)el.setAttribute('aria-disabled','true');
        el.innerHTML=`<span class="number">${String(d).padStart(2,'0')}</span>${m?'<i class="stitch" aria-hidden="true"></i>':''}${d===15?'<span class="today-label">今天</span>':''}`;
        el.addEventListener('click',()=>{if(d>15){notify('未来的日子，留给真实发生的惊喜。');return;}openDay(d,el);});
        el.addEventListener('keydown',e=>{const shift={ArrowLeft:-1,ArrowRight:1,ArrowUp:-5,ArrowDown:5}[e.key];if(shift){e.preventDefault();document.querySelector('#weave-day-'+Math.max(1,Math.min(30,d+shift))).focus({preventScroll:true});}});
      }
      container.appendChild(el);
    }
  }
  makeDays(grid);makeDays(mini,true);
  function notify(text){const note=document.querySelector('.status-note');note.textContent=text;note.hidden=false;clearTimeout(noteTimer);noteTimer=setTimeout(()=>note.hidden=true,2800);}
  function openDay(day,trigger){
    selectedDay=day;lastTrigger=trigger||document.querySelector('#weave-day-'+day);const m=memories[day];
    document.querySelector('.selected-heading h2').innerHTML=`${String(day).padStart(2,'0')}<span>九月</span>`;
    document.querySelector('.selection-state').textContent=day===15?'今天 · 暂无展示记录':m?'已经走过的一天 · 示例回忆':'已经走过的一天';
    mini.querySelectorAll('.mini-day').forEach(el=>el.classList.toggle('selected',Number(el.dataset.day)===day));
    document.querySelector('.memory-content').hidden=!m;document.querySelector('.empty-content').hidden=!!m;
    if(m){media.dataset.scene={sea:0,cafe:1,forest:2}[m.scene];media.setAttribute('aria-label',m.scene==='sea'?'示例照片：海边':m.scene==='cafe'?'示例照片：咖啡时光':'示例照片：森林');document.querySelector('.detail-title').textContent=m.title;document.querySelector('.detail-copy').textContent=m.copy;}
    else{document.querySelector('.empty-mark').textContent=String(day).padStart(2,'0');document.querySelector('.empty-title').textContent=day===15?'今天，慢慢织进生活':'这一天，留一处空白';document.querySelector('.empty-copy').textContent=day===15?'日子还在继续。这里会留下已经展示过的回忆，接下来的惊喜，留给照片墙。':'这一天还没有展示记录。没有照片的日子，也可以安静地留在时间里。';}
    changeView(()=>{root.dataset.view='day';overview.hidden=true;selected.hidden=false;coverScene();document.querySelector('.back').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});
  }
  function backToMonth(){changeView(()=>{root.dataset.view='month';selected.hidden=true;overview.hidden=false;(lastTrigger||document.querySelector('#weave-day-15')).focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});});}
  document.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',backToMonth));
  document.querySelectorAll('[data-today]').forEach(el=>el.addEventListener('click',()=>openDay(15,document.querySelector('#weave-day-15'))));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.open&&!selected.hidden){e.preventDefault();backToMonth();}});
  const info={connection:['照片墙连接','这里是首页交互 Demo，连接状态为示例。正式产品会以设备实际连接状态和上屏回执为准。'],preferences:['偏好','在正式 App 中，这里进入偏好管理。本轮保留独立入口，专注体验整月鸟瞰与某一天的回忆。'],settings:['设置','设备与账户管理从这里进入，与偏好处于同一级。这份 Demo 不会更改你的实际设置。']};
  document.querySelectorAll('[data-info]').forEach(el=>el.addEventListener('click',()=>{const [title,copy]=info[el.dataset.info];dialog.querySelector('h2').textContent=title;dialog.querySelector('p').textContent=copy;dialog.showModal();}));
  dialog.querySelector('button').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
});
</script>
</head>
<body>
<div class="app" data-view="month">
  <div class="system-bar" aria-hidden="true"><span>9:41</span><span class="system-icons"><iconify-icon icon="lucide:signal" aria-hidden="true"></iconify-icon><iconify-icon icon="lucide:battery-full" aria-hidden="true"></iconify-icon></span></div>
  <header class="topbar"><button class="connection" type="button" data-info="connection"><i class="dot"></i>已连接 · 示例</button><div class="nav-actions"><button type="button" data-info="preferences">偏好</button><button class="gear" type="button" data-info="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button></div></header>
  <main>
    <section class="overview" aria-label="九月回忆织毯">
      <div class="title-block"><div><p class="eyebrow">2026 / MEMORY WEAVE</p><h1>九月的织物</h1></div><button class="month-control" type="button" data-today aria-label="本月，查看今天">本月 ↗</button></div>
      <div class="loom"><div class="month-grid" role="group" aria-label="2026 年 9 月，按日期从左到右排列"></div></div>
      <div class="loom-caption"><span class="caption-legend"><i aria-hidden="true"></i>有标记的日期，藏着回忆</span><span>01 — 30 SEP</span></div>
      <div class="overview-footer"><p><strong>日子正在织成自己的样子。</strong><br>余下的空白，留给还没发生的生活。</p><button class="today-btn" type="button" data-today>今天</button></div>
      <p class="fineprint">示例回忆 · 这里只回看已经展示过的内容</p>
    </section>
    <section class="selected-view" aria-label="某一天的回忆" hidden>
      <button class="back" type="button" data-back><iconify-icon icon="lucide:chevron-left" aria-hidden="true"></iconify-icon>回到整月</button>
      <div class="selection-context"><div class="mini-loom" aria-hidden="true"></div><div class="selected-heading"><p class="eyebrow">2026 / SEPTEMBER</p><h2>13<span>九月</span></h2><p class="selection-state">已经走过的一天 · 示例回忆</p></div></div>
      <div class="memory-content"><div class="memory-photo" role="img" aria-label="示例照片：海边"></div><h3 class="detail-title"></h3><p class="detail-copy"></p></div>
      <div class="empty-content" hidden><div class="empty-weave" aria-hidden="true"><span class="empty-mark">15</span></div><h3 class="detail-title empty-title"></h3><p class="detail-copy empty-copy"></p></div>
      <div class="detail-footer"><span>回忆织毯 · 示例体验</span><button class="return-month" type="button" data-back>收回织物中</button></div>
    </section>
  </main>
  <div class="status-note" role="status" hidden></div>
  <dialog aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p></p><button type="button">知道了</button></dialog>
</div>
</body>
</html>
