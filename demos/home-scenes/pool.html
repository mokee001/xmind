eight:600}.no-motion .water-photo,.no-motion .water-light,.no-motion .memory-print,.is-hidden .water-photo,.is-hidden .water-light,.is-hidden .memory-print{animation-play-state:paused}.no-motion .touch-ripple{animation:static-ripple 170ms ease-out forwards}.no-motion .memory-print{transform:rotate(var(--tilt,-6deg))}.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}.live-date{position:absolute;top:88px;left:11px;font-size:8px;writing-mode:vertical-rl;letter-spacing:2px;color:#748177;font-weight:500;z-index:4;pointer-events:none}
    @keyframes water-breathe{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.09) translate(-1.1%,.6%)}}
    @keyframes caustics-drift{from{transform:translate(-1%,0) rotate(-12deg) scale(1);opacity:.27}to{transform:translate(3%,2%) rotate(-8deg) scale(1.08);opacity:.4}}
    @keyframes print-buoy{from{transform:translateY(0) rotate(calc(var(--tilt,-6deg) - .65deg))}to{transform:translateY(-4px) rotate(calc(var(--tilt,-6deg) + .65deg))}}

  <script>
    document.addEventListener('DOMContentLoaded',()=>{
      const root=document.getElementById('pool-app');
      const scroll=document.getElementById('pool-scroll');
      const timeline=document.getElementById('timeline');
      const sheet=document.getElementById('info-sheet');
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
      const history={13:{kind:1,title:'一杯暖暖的日常'},11:{kind:4,title:'毛孩子的慢时光'},8:{kind:1,title:'一杯暖暖的日常'},5:{kind:3,title:'一点绿色的陪伴'},2:{kind:0,title:'有山的日子'}};
      const art=[
        '<rect width="120" height="100" fill="#e9e8da"/><circle cx="82" cy="25" r="10" fill="#c0ab73"/><path d="m0 76 42-42 35 27 18-15 25 30v24H0Z" fill="#9dada0"/><path d="m0 89 35-28 28 20 31-14 26 23v10H0Z" fill="#667d72"/><path d="m42 34 10 10-13-2-11 6Z" fill="#ecebe0"/>',
        '<rect width="120" height="100" fill="#eddfcf"/><ellipse cx="61" cy="80" rx="36" ry="5" fill="#d0bba2"/><path d="M36 36h45v26c0 24-45 24-45 0Z" fill="#af795d"/><path d="M81 42h8c18 0 18 22-8 22" fill="none" stroke="#af795d" stroke-width="7"/><path d="M48 13c-8 7 8 11 0 17m18-19c-8 7 8 11 0 17" fill="none" stroke="#c5b49e" stroke-width="2" stroke-linecap="round"/>',
        '<rect width="120" height="100" fill="#dbe4e0"/><circle cx="87" cy="27" r="12" fill="#d7c898"/><path d="M0 58q25-11 50 0t70 0v42H0" fill="#99b0aa"/><path d="M0 73q25-11 50 0t70 0" fill="none" stroke="#ecede0" stroke-width="2"/><path d="M0 88q25-11 50 0t70 0" fill="none" stroke="#7a9891" stroke-width="3"/>',
        '<rect width="120" height="100" fill="#e8e6d8"/><path d="M60 87 65 23" stroke="#859372" stroke-width="2"/><path d="M64 53C24 44 25 13 64 53Z" fill="#a0ad89"/><path d="M62 67C26 68 28 38 62 67Z" fill="#87966f"/><path d="M64 46C98 51 102 19 64 46Z" fill="#798d73"/><path d="M65 31C45 14 50 2 65 31Z" fill="#b0b58d"/><path d="M44 74h33l-3 25H48Z" fill="#c4b99f"/>',
        '<rect width="120" height="100" fill="#e6e2dc"/><path d="m38 33-8-20 22 10m19 1 21-11-7 22" fill="#b3a89b"/><ellipse cx="61" cy="51" rx="30" ry="30" fill="#c7bcad"/><path d="m49 44 1 1m23-1 1 1" stroke="#645d56" stroke-width="4" stroke-linecap="round"/><path d="m58 55 4 3 4-3m-4 3v5m-7 0q7 7 14 0M34 54l-17-3m17 11-17 4m72-12 17-3m-17 11 17 4" fill="none" stroke="#84796d" stroke-width="1.5"/><ellipse cx="60" cy="92" rx="37" ry="10" fill="#d5ccbc"/>'
      ];
      const svg=kind=>'<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+art[kind]+'</svg>';
      let memoryIndex=0;
      timeline.innerHTML=Array.from({length:15},(_,index)=>{
        const day=15-index,record=history[day],position=['right','left','mid'][memoryIndex%3];
        if(record) memoryIndex++;
        return '<section class="pool-day" data-day="'+day+'" aria-label="2026年9月'+day+'日"><button class="date-tick'+(day===15?' is-selected':'')+'" data-date="'+day+'" aria-label="9月'+day+'日'+(day===15?'，今天':record?'，查看示例回忆':'，暂无记录')+'"'+(day===15?' aria-current="date"':'')+'>'+String(day).padStart(2,'0')+'</button><span class="minor-ticks" aria-hidden="true"><i></i><i></i><i></i></span>'+(day===15?'<button class="today-water" data-date="15" aria-label="今天，尚无已展示记录"><strong>今天</strong><small>留一点期待</small></button><span class="water-whisper">新的回忆，<br>会在展示后留下。</span>':'')+(record?'<button class="memory-print '+position+'" data-memory="'+day+'" aria-label="查看9月'+day+'日示例回忆，'+record.title+'">'+svg(record.kind)+'<span class="print-caption"><strong>'+record.title+'</strong><time datetime="2026-09-'+String(day).padStart(2,'0')+'">09.'+String(day).padStart(2,'0')+'</time></span><span class="print-stamp">示例回忆 · SEPTEMBER</span></button>':'')+'</section>';
      }).join('');
      let previousFocus=null;
      function openSheet(title,body){
        previousFocus=document.activeElement;
        document.getElementById('sheet-title').textContent=title;
        document.getElementById('sheet-content').innerHTML=body;
        if(!sheet.open) sheet.showModal();
      }
      function closeSheet(){sheet.close();}
      function openDate(day){
        setActiveDay(day);
        const record=history[day];
        if(record){openSheet(record.title,'<p class="sheet-meta">2026.09.'+String(day).padStart(2,'0')+' · 示例回忆</p><div class="sheet-art">'+svg(record.kind)+'</div><p>留在这一天的一点美好。</p><small>这里使用插画演示回看体验，并非真实设备的展示记录。</small>');}
        else if(day===15){openSheet('给今天留一点期待','<p>今天还没有已展示的回忆。照片墙展示后，它们会留在这里。</p><small>未来的内容保持留白。这是一版首页视觉演示。</small>');}
        else{openSheet('9 月 '+day+' 日','<p>这一天暂无已展示记录。</p><small>有回忆的日子会留在水面上，空白的日子也值得被保留。</small>');}
      }
      function showRipple(event){
        if(event.clientX===0&&event.clientY===0)return;
        const rect=root.getBoundingClientRect(),ring=document.createElement('i');
        ring.className='touch-ripple';ring.style.setProperty('--x',(event.clientX-rect.left)+'px');ring.style.setProperty('--y',(event.clientY-rect.top)+'px');
        document.getElementById('ripple-layer').appendChild(ring);
        ring.addEventListener('animationend',()=>ring.remove(),{once:true});
      }
      let hintTimeout;
      function setHint(message){const hint=document.getElementById('hint');hint.textContent=message;hint.classList.add('visible');clearTimeout(hintTimeout);hintTimeout=setTimeout(()=>hint.classList.remove('visible'),2200);}
      timeline.addEventListener('click',event=>{
        const memory=event.target.closest('[data-memory]'),date=event.target.closest('[data-date]');
        if(memory){showRipple(event);openDate(Number(memory.dataset.memory));}
        else if(date){openDate(Number(date.dataset.date));}
        else showRipple(event);
      });
      document.getElementById('status-button').addEventListener('click',()=>openSheet('客厅照片墙','<p class="status-detail"><span class="status-dot"></span>已连接 · 示例状态</p><p>连接状态会一直显示在首页左上角。设备与账户管理可以从右上角的设置进入。</p><small>本提案未连接真实设备。</small>'));
      document.getElementById('preferences-button').addEventListener('click',()=>openSheet('偏好','<p>在正式产品中，这里进入现有的偏好管理。你可以调整想看到的内容与人物。</p><small>本次仅对比首页的视觉与时间体验，偏好页沿用已确认的结构。</small>'));
      document.getElementById('settings-button').addEventListener('click',()=>openSheet('设置','<p>在正式产品中，这里进入现有的设备与账户设置。</p><p>设置与偏好各自独立；连接状态始终留在首页。</p><small>这版提案不会改动你的真实设备或账户。</small>'));
      document.getElementById('close-sheet').addEventListener('click',closeSheet);
      document.getElementById('sheet-done').addEventListener('click',closeSheet);
      sheet.addEventListener('click',event=>{if(event.target===sheet){const r=sheet.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeSheet();}});
      sheet.addEventListener('close',()=>{if(previousFocus&&previousFocus.isConnected)previousFocus.focus({preventScroll:true});});
      document.getElementById('today-button').addEventListener('click',()=>{setActiveDay(15);scroll.scrollTo({top:0,behavior:reduce.matches?'instant':'smooth'});setHint('回到今天 · 9 月 15 日');});
      let manuallyPaused=false;
      function syncMotion(){const paused=manuallyPaused||reduce.matches;root.classList.toggle('no-motion',paused);const button=document.getElementById('motion-button');button.setAttribute('aria-pressed',String(paused));button.setAttribute('aria-label',reduce.matches?'系统已减少动态效果':paused?'播放水面动画':'暂停水面动画');button.innerHTML='<iconify-icon icon="lucide:'+(paused?'play':'pause')+'" aria-hidden="true"></iconify-icon>';}
      document.getElementById('motion-button').addEventListener('click',()=>{if(reduce.matches){setHint('已跟随系统，减少动态效果');return;}manuallyPaused=!manuallyPaused;syncMotion();setHint(manuallyPaused?'水面已静止':'水面继续流动');});
      reduce.addEventListener('change',syncMotion);syncMotion();
      document.addEventListener('visibilitychange',()=>root.classList.toggle('is-hidden',document.hidden));
      let pending=false,activeDay=15;
      function setActiveDay(day){activeDay=day;document.querySelectorAll('.date-tick').forEach(button=>button.classList.toggle('is-selected',Number(button.dataset.date)===activeDay));document.getElementById('current-date').textContent='09.'+String(activeDay).padStart(2,'0');document.getElementById('date-announcement').textContent='正在回看2026年9月'+activeDay+'日';}
      function updateDate(){pending=false;const focusY=scroll.scrollTop+36;let nextDay=15;timeline.querySelectorAll('.pool-day').forEach(day=>{if(timeline.offsetTop+day.offsetTop<=focusY)nextDay=Number(day.dataset.day);});if(nextDay!==activeDay)setActiveDay(nextDay);}
      scroll.addEventListener('scroll',()=>{if(!pending){pending=true;requestAnimationFrame(updateDate);}},{passive:true});
    });
  </script>

<body>
  <div id="pool-app">
    <div class="environment" aria-hidden="true"><div class="water-photo"></div><div class="water-depth"></div><div class="water-light"></div><div class="water-light second"></div></div>
    <div class="coping" aria-hidden="true"></div>
    <header class="utility flex items-center justify-between">
      <button id="status-button" class="status" aria-label="连接状态：已连接，示例"><span class="status-dot"></span><span>已连接</span><span class="example">示例</span></button>
      <nav class="nav-peer flex items-center" aria-label="首页功能">
        <button id="preferences-button" class="nav-button" aria-label="偏好"><iconify-icon icon="lucide:sliders-horizontal" aria-hidden="true"></iconify-icon><span>偏好</span></button>
        <button id="settings-button" class="nav-button gear" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon></button>
      </nav>
    </header>
    <main class="pool-scroll" id="pool-scroll" tabindex="0" aria-label="九月回忆时间轴，向上滑动回看更早的日期">
      <section class="month-intro">
        <div><span class="month-number">09</span><span class="month-year">2026</span></div>
        <div class="month-name"><h1>回忆日历</h1><p>日子，轻轻浮起。</p><small>5 天 · 示例回忆</small></div>
      </section>
      <div class="timeline" id="timeline"></div>
      <div class="month-end"><strong>九月的起点</strong><small>让回忆慢慢浮现</small></div>
    </main>
    <span class="live-date" id="current-date" aria-hidden="true">09.15</span>
    <div class="ripple-layer" id="ripple-layer" aria-hidden="true"></div>
    <div class="hint" id="hint" role="status"></div>
    <div class="fixed-foot">
      <div class="foot-note">向上滑 · 回到那些日子</div>
      <div class="foot-actions">
        <button id="motion-button" class="round-action" aria-label="暂停水面动画" aria-pressed="false"><iconify-icon icon="lucide:pause" aria-hidden="true"></iconify-icon></button>
        <button id="today-button" class="round-action today-action" aria-label="回到今天"><iconify-icon icon="lucide:arrow-up" aria-hidden="true"></iconify-icon><span>今天</span></button>
      </div>
    </div>
    <span class="sr-only" id="date-announcement" role="status" aria-live="polite">正在回看2026年9月15日</span>
    <dialog id="info-sheet" class="sheet" aria-labelledby="sheet-title"><div class="sheet-inner"><span class="sheet-grip"></span><div class="sheet-top"><h2 id="sheet-title"></h2><button id="close-sheet" class="sheet-close" aria-label="关闭"><iconify-icon icon="lucide:x" aria-hidden="true"></iconify-icon></button></div><div id="sheet-content" class="sheet-content"></div><button id="sheet-done" class="primary-action">回到水面</button></div></dialog>
  </div>
</body>
</html>
