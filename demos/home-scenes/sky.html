<style>

before{content:"";position:absolute;left:53px;top:16px;bottom:60px;width:1px;background:linear-gradient(#e6f4ff00,#e6f4ff88 5%,#e6f4ff50 90%,transparent)}.memory-day{position:relative;min-height:248px;padding-top:23px}.date-point{position:absolute;left:0;top:10px;width:51px;display:flex;align-items:center;flex-direction:column;background:#236da51c;padding:6px 0 11px;border-radius:18px;backdrop-filter:blur(7px);text-shadow:0 1px 10px #174b6b}.date-point strong{font-family:"Helvetica Neue",Arial,sans-serif;font-size:27px;font-weight:300;line-height:1.2}.date-point small{font-size:8px;letter-spacing:1px;margin-top:4px}.date-point:after{content:"";width:4px;height:4px;border-radius:50%;background:#fff;position:absolute;bottom:-3px}.memory-window{display:block;margin:0 0 0 79px;width:205px;max-width:calc(100% - 75px);padding:7px 7px 12px;background:#ffffff21;border:1px solid #ffffff75;border-radius:4px;box-shadow:0 18px 32px #0c3a5735;backdrop-filter:blur(12px);text-align:left;transform:rotate(3deg);transition:transform .2s ease}.memory-day:nth-child(2n) .memory-window{margin-left:64px;transform:rotate(-4deg)}.memory-window:hover{transform:rotate(0)}.memory-picture{width:100%;height:125px;overflow:hidden;border-radius:1px;background:#deeae2}.memory-picture svg{display:block;width:100%;height:100%;object-fit:cover}.memory-caption{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 0;gap:5px;font-size:11px;text-shadow:0 1px 7px #184c6380}.memory-caption small{font-size:8px;white-space:nowrap;color:#eef5fa}.closing-note{font-size:10px;line-height:1.8;letter-spacing:1px;text-align:center;padding:20px 25px 300px;color:#f2f6fa;text-shadow:0 1px 8px #103758}
.scene-footer{position:absolute;left:20px;right:20px;bottom:max(17px,env(safe-area-inset-bottom));padding:12px 14px 10px;border-radius:23px;border:1px solid #fff4;background:#16456661;backdrop-filter:blur(24px);box-shadow:0 10px 30px #12364b1c}.footer-heading{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#edf8ff;letter-spacing:1px;margin-bottom:7px}.footer-heading button{background:none;font-size:10px;min-height:24px;padding:0 3px}.phase-list{display:flex;gap:3px;align-items:center}.phase-list button{flex:1;border-radius:18px;padding:9px 4px;min-height:35px;font-size:11px;background:transparent;color:#eaf5fd}.phase-list button[aria-pressed="true"]{color:#23476a;background:#fffffff0;box-shadow:0 2px 12px #09334720}.phase-list .ambient-toggle{max-width:38px;padding:7px 0}.phase-list .ambient-toggle iconify-icon{font-size:16px}.footer-heading .return-today{border-left:1px solid #ffffff38;padding-left:10px;margin-left:9px}.current-date{font-variant-numeric:tabular-nums}.date-dock{position:absolute;right:24px;top:111px;z-index:4;background:#16466558;padding:7px 10px;border:1px solid #fff3;border-radius:20px;font-size:10px;backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .15s}.date-dock.shown{opacity:1;pointer-events:auto}.modal-layer{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;background:#061a3980;backdrop-filter:blur(10px);padding:18px}.modal-layer[hidden]{display:none}.sheet{width:100%;max-height:80dvh;overflow:auto;background:#edf5fa;color:#24455c;border-radius:25px;padding:20px 20px 24px;box-shadow:0 12px 60px #061a3950}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.sheet h2{font-weight:500;font-size:21px;letter-spacing:.5px}.close-sheet{display:grid;place-items:center;border-radius:50%;background:#dce8ef;min-height:44px;width:44px;color:#24455c}.sheet-body p{font-size:12px;line-height:1.9;color:#557085;margin-top:12px}.sheet-body .detail-picture{overflow:hidden;border-radius:10px;aspect-ratio:1.2;background:#dae4df}.detail-picture svg{width:100%;height:100%;display:block}.sheet-body strong{font-size:16px;font-weight:500;display:block;margin-top:17px}.note-small{font-size:10px!important;color:#718998!important}.app.motion-reduced .clouds{animation:none}.app.motion-reduced .dawn,.app.motion-reduced .sunset,.app.motion-reduced .night,.app.motion-reduced .stars,.app.motion-reduced .moon{transition:none}.app.motion-reduced .journey{scroll-behavior:auto}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-height:690px){.today-scene{height:300px;padding-top:17px}.day-hero{font-size:105px;margin-top:18px}.moment{margin-top:18px}.scene-footer{bottom:11px}.journey{bottom:115px}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const root=document.querySelector('.app'),scroller=document.querySelector('.journey'),modal=document.querySelector('.modal-layer'),heading=document.querySelector('#sheet-title'),body=document.querySelector('.sheet-body');
 const art=[`<svg viewBox="0 0 120 100" aria-hidden="true"><rect width="120" height="100" fill="#dbe4e0"/><circle cx="87" cy="27" r="12" fill="#d7c898"/><path d="M0 58q25-11 50 0t70 0v42H0" fill="#99b0aa"/><path d="M0 73q25-11 50 0t70 0" fill="none" stroke="#ecede0" stroke-width="2"/><path d="M0 88q25-11 50 0t70 0" fill="none" stroke="#7a9891" stroke-width="3"/></svg>`,`<svg viewBox="0 0 120 100" aria-hidden="true"><rect width="120" height="100" fill="#e9e8da"/><circle cx="82" cy="25" r="10" fill="#c0ab73"/><path d="m0 76 42-42 35 27 18-15 25 30v24H0Z" fill="#9dada0"/><path d="m0 89 35-28 28 20 31-14 26 23v10H0Z" fill="#667d72"/><path d="m42 34 10 10-13-2-11 6Z" fill="#ecebe0"/></svg>`,`<svg viewBox="0 0 120 100" aria-hidden="true"><rect width="120" height="100" fill="#eddfcf"/><ellipse cx="61" cy="80" rx="36" ry="5" fill="#d0bba2"/><path d="M36 36h45v26c0 24-45 24-45 0Z" fill="#af795d"/><path d="M81 42h8c18 0 18 22-8 22" fill="none" stroke="#af795d" stroke-width="7"/><path d="M48 13c-8 7 8 11 0 17m18-19c-8 7 8 11 0 17" fill="none" stroke="#c5b49e" stroke-width="2" stroke-linecap="round"/></svg>`];
 const records=[{day:13,title:'去看一看海',art:0},{day:11,title:'有山的日子',art:1},{day:8,title:'慢下来的一杯',art:2},{day:5,title:'再见一片海',art:0},{day:2,title:'山间的午后',art:1}];
 document.querySelector('.past-flow').innerHTML=records.map((r,i)=>`<section class="memory-day" data-day="${r.day}" aria-label="9月${r.day}日"><div class="date-point"><strong>${r.day}</strong><small>九月</small></div><button class="memory-window" data-memory="${i}" aria-label="查看9月${r.day}日的示例回忆：${r.title}"><div class="memory-picture">${art[r.art]}</div><span class="memory-caption"><span>${r.title}</span><small>示例回忆 ↗</small></span></button></section>`).join('');
 let restoreFocus,dayCycle=null,cycleIndex=1,manual=false,paused=false; const phases=['dawn','day','sunset','night']; const reduce=matchMedia('(prefers-reduced-motion: reduce)'); root.classList.toggle('motion-reduced',reduce.matches);
 function setPhase(phase){root.dataset.phase=phase;document.querySelectorAll('[data-phase-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.phaseChoice===phase)));}
 function stopCycle(){clearInterval(dayCycle);dayCycle=null;document.querySelector('#cycle').textContent='体验一天';}
 function closeModal(){modal.hidden=true;restoreFocus?.focus({preventScroll:true});}
 function openModal(title,html){restoreFocus=document.activeElement;heading.textContent=title;body.innerHTML=html;modal.hidden=false;document.querySelector('.close-sheet').focus();}
 document.querySelector('.close-sheet').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
 document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=[...modal.querySelectorAll('button,[href],input')];if(e.shiftKey&&document.activeElement===focusables[0]){e.preventDefault();focusables.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus()}}});
 document.querySelector('.past-flow').addEventListener('click',e=>{const b=e.target.closest('[data-memory]');if(!b)return;const r=records[Number(b.dataset.memory)];openModal(`九月${r.day}日`,`<div class="detail-picture">${art[r.art]}</div><strong>${r.title}</strong><p>示例回忆 · 插画示意</p><p class="note-small">这里回看已经发生的展示。概念中的日期与插画仅作示意，不代表设备上屏回执。</p>`)});
 document.querySelector('[data-info="connection"]').onclick=()=>openModal('客厅照片墙', '<strong>已连接 · 示例</strong><p>连接状态会一直留在首页左上角。</p><p class="note-small">当前为场景概念预览，未连接真实设备。</p>');
 document.querySelector('[data-info="preferences"]').onclick=()=>openModal('偏好','<strong>仍然直接进入偏好管理</strong><p>人物、内容和展示范围沿用已确认的偏好页面。本次只探索首页。</p>');
 document.querySelector('[data-info="settings"]').onclick=()=>openModal('设置','<strong>设备与账户管理</strong><p>设置与偏好同级，保持独立入口。场景变化不会把连接状态藏进设置。</p>');
 document.querySelectorAll('[data-phase-choice]').forEach(b=>b.onclick=()=>{manual=true;stopCycle();setPhase(b.dataset.phaseChoice)});
 document.querySelector('#cycle').onclick=()=>{if(dayCycle){stopCycle();return}if(reduce.matches){openModal('光线体验','<p>系统已开启减少动态效果。可以直接选择清晨、白昼、黄昏或夜晚，静态查看不同光线。</p>');return}manual=true;paused=false;root.classList.remove('paused');document.querySelector('#pause').setAttribute('aria-label','暂停动态');document.querySelector('#pause').innerHTML='<iconify-icon icon="lucide:pause"></iconify-icon>';cycleIndex=0;setPhase(phases[0]);document.querySelector('#cycle').textContent='暂停流逝';dayCycle=setInterval(()=>{cycleIndex=(cycleIndex+1)%4;setPhase(phases[cycleIndex])},3600)};
 document.querySelector('#pause').onclick=()=>{paused=!paused;root.classList.toggle('paused',paused);document.querySelector('#pause').setAttribute('aria-label',paused?'继续动态':'暂停动态');document.querySelector('#pause').innerHTML=`<iconify-icon icon="lucide:${paused?'play':'pause'}"></iconify-icon>`;if(paused)stopCycle()};
 function goToday(){scroller.scrollTo({top:0,behavior:reduce.matches?'instant':'smooth'});manual=false;stopCycle();setPhase('day')}
 document.querySelectorAll('[data-today]').forEach(b=>b.onclick=goToday);
 const sections=[...document.querySelectorAll('.memory-day')];let positions=[];function measure(){positions=sections.map(el=>el.offsetTop+document.querySelector('.past-flow').offsetTop)}measure();addEventListener('resize',measure);
 let ticking=false;scroller.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=scroller.scrollTop;let day=15;positions.forEach((p,i)=>{if(y+180>=p)day=records[i].day});document.querySelector('.current-date').textContent=`九月${day}日`;document.querySelector('.date-dock').classList.toggle('shown',y>200);document.querySelector('.date-dock').textContent=`9月${day}日 · 回到今天`;
 if(!manual&&!paused&&y<=140)setPhase('day');if(!manual&&!paused&&!reduce.matches&&y>140){const progress=(y-140)/480;const fraction=progress-Math.floor(progress);setPhase(phases[Math.floor(fraction*4)])}ticking=false})},{passive:true});
 reduce.addEventListener('change',()=>{root.classList.toggle('motion-reduced',reduce.matches);if(reduce.matches)stopCycle()});document.addEventListener('visibilitychange',()=>{root.classList.toggle('paused',document.hidden||paused);if(document.hidden)stopCycle()});
 setPhase('day');
});
</script>

<body><div class="app relative overflow-hidden" data-phase="day">
<div class="world" aria-hidden="true"><div class="clouds"></div><div class="blue"></div><div class="dawn"></div><div class="sunset"></div><div class="night"></div><div class="stars"></div><div class="moon"></div></div>
<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="status-icons"><iconify-icon icon="lucide:signal"></iconify-icon><iconify-icon icon="lucide:wifi"></iconify-icon><iconify-icon icon="lucide:battery-full"></iconify-icon></span></div>
<header class="topbar"><button class="connection" data-info="connection" aria-label="连接状态，已连接，示例"><i></i>已连接 <small>示例</small></button><div class="navlinks"><button class="nav-button" data-info="preferences"><iconify-icon icon="lucide:sliders-horizontal"></iconify-icon>偏好</button><button class="nav-button gear" aria-label="设置" data-info="settings"><iconify-icon icon="lucide:settings"></iconify-icon></button></div></header>
<button class="date-dock" data-today>九月15日 · 回到今天</button>
<main class="journey" tabindex="0" aria-label="日子的纵向时间轴"><section class="today-scene" aria-label="2026年9月15日，今天"><p class="brandline">回 忆 日 历</p><h1 class="day-hero">15</h1><p class="today-context">九月 · 2026 &nbsp; / &nbsp; 星期二</p><p class="moment">让日子，慢慢经过。</p><p class="scroll-cue">向上滑，回到那些日子 <iconify-icon icon="lucide:move-up"></iconify-icon></p></section><div class="past-flow"></div><p class="closing-note">往后的相遇，留给生活。<br>示例内容 · 光线为场景表达，不是历史天气。</p></main>
<div class="scene-footer"><div class="footer-heading"><span>光线体验 <span aria-hidden="true">·</span> <span class="current-date">九月15日</span></span><span><button id="cycle">体验一天</button><button class="return-today" data-today>今天 ↗</button></span></div><div class="phase-list"><button data-phase-choice="dawn" aria-pressed="false">清晨</button><button data-phase-choice="day" aria-pressed="true">白昼</button><button data-phase-choice="sunset" aria-pressed="false">黄昏</button><button data-phase-choice="night" aria-pressed="false">夜晚</button><button class="ambient-toggle" id="pause" aria-label="暂停动态"><iconify-icon icon="lucide:pause"></iconify-icon></button></div></div>

</div></body></html>
