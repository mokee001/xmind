<body>
<div class="app" id="app" data-view="month">
<header class="topbar"><button class="connection" data-open="connection"><i></i>已连接 · 示例</button><div class="actions"><button data-open="preferences">偏好</button><button class="settings" data-open="settings" aria-label="设置"><iconify-icon icon="lucide:settings-2"></iconify-icon><span class="fallback">设置</span></button></div></header>
<div class="heading"><div class="month"><h1>09</h1><span>月</span></div><div class="month-info"><strong>2026</strong>回看已展示的日子</div></div>
<main class="viewport" id="viewport" tabindex="0" aria-label="九月回忆影像，可双指缩放或点击照片进入某天">
<div class="world" id="world"></div>
<section class="today-state" id="todayState" hidden><span class="today-date">15</span><h2>今天还在继续。</h2><p>还没有新的展示记录。下次的内容，留给照片墙。</p><button id="backToMonth">回看这个月</button><span class="tiny">9月15日 · 示例状态</span></section>
</main>
<footer class="navigation"><div class="nav-top"><p class="status-copy" id="statusCopy">5 个日子<span>照片已在屏幕展示过</span></p><button class="today" id="todayButton">15 · 今天</button><button class="see-full" id="seeFull">看完整照片 ↗</button></div><div class="nav-bottom"><button class="zoom-btn active" id="monthButton">一整月</button><div class="zoom-control"><iconify-icon icon="lucide:minus" aria-hidden="true"></iconify-icon><input id="zoomRange" type="range" min="0" max="100" value="0" aria-label="从整月放大到某天"><iconify-icon icon="lucide:plus" aria-hidden="true"></iconify-icon></div><button class="zoom-btn" id="dayButton">这一天</button></div><p class="hint" id="hint">双指展开，走近一天 · 点照片也可以</p><p class="sample">演示影像与展示记录</p></footer>
<p class="announcement" role="status" id="announcement"></p>
<dialog id="infoSheet" aria-labelledby="infoTitle"><div class="sheet-head"><h2 id="infoTitle"></h2><button class="close" data-close>关闭</button></div><p class="sheet-copy" id="infoCopy"></p><div id="infoRows"></div></dialog>
<dialog id="preferenceSheet" aria-labelledby="prefsTitle"><div class="sheet-head"><h2 id="prefsTitle">偏好</h2><button class="close" data-close>关闭</button></div><button class="sheet-edit" id="managePrefs">管理偏好</button><h3 class="section-title">想多看到什么</h3><p class="preference-note">未选择时，由我们安排。</p><div class="options" id="topics"></div><h3 class="section-title">不想看到谁</h3><p class="preference-note">默认所有人都可出现，只选择想避开的人。</p><div class="options" id="people"></div><p class="prefs-footer">人物为演示示例。偏好仅保存在此浏览器，不改变照片墙的真实设置。</p></dialog>
<dialog class="full-photo" id="fullPhoto" aria-labelledby="fullTitle"><div class="sheet-head"><h2 id="fullTitle"></h2><button class="close" data-close>关闭</button></div><div class="photo-space"><div class="image" id="fullImage" role="img"></div></div><p>示例回忆 · 保留完整构图</p><button class="return" data-close>返回刚才的位置</button></dialog>
<script>
(()=>{
const $=s=>document.querySelector(s),world=$('#world'),viewport=$('#viewport'),root=$('#app');
const records=[{day:13,scene:0,name:'一起去看海',x:15,y:10,w:350,h:464},{day:11,scene:1,name:'午后的颜色',x:419,y:40,w:255,h:374},{day:8,scene:2,name:'在院子里',x:415,y:455,w:259,h:389},{day:5,scene:3,name:'坐一会儿',x:24,y:538,w:323,h:430},{day:2,scene:5,name:'抬头的瞬间',x:403,y:894,w:255,h:172}];
// Stable coordinates keep the same photos in place from month to day; no new dataset is loaded on zoom.
const W=720,H=1090;world.style.height=H+'px';let s=.5,x=0,y=0,min=.3,max=1.8,selected=0,progress=0,animateTimer,down=null,lastClickUntil=0;
const points=new Map();let pinch=null;
function crop(el,scene){const w=el.clientWidth,h=el.clientHeight;if(!w||!h)return;const tw=Math.max(w,h*.75),th=tw/0.75;el.style.backgroundSize=`${tw*3}px ${th*2}px`;el.style.backgroundPosition=`${-(scene%3*tw+(tw-w)/2)}px ${-(Math.floor(scene/3)*th+(th-h)/2)}px`;el.dataset.scene=scene;}
const observer=new ResizeObserver(entries=>entries.forEach(e=>{if(e.target.dataset.scene!==undefined)crop(e.target,Number(e.target.dataset.scene));}));
records.forEach((r,i)=>{const b=document.createElement('button');b.className='memory';b.dataset.day=r.day;b.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;b.setAttribute('aria-label',`进入9月${r.day}日：${r.name}`);b.setAttribute('aria-pressed','false');b.innerHTML=`<span class="image" data-scene="${r.scene}" role="img" aria-label="示例照片：${r.name}"></span><span class="caption"><strong>${String(r.day).padStart(2,'0')}</strong><small>${r.name}</small></span>`;b.addEventListener('click',()=>{if(performance.now()<lastClickUntil)return;focusDay(i);});world.appendChild(b);observer.observe(b.querySelector('.image'));});
function measure(){min=Math.min((viewport.clientWidth-20)/W,(viewport.clientHeight-22)/H);max=Math.max(min*4,1.6);}
function fit(){return{x:(viewport.clientWidth-W*min)/2,y:Math.max(3,(viewport.clientHeight-H*min)/2),s:min};}
function focal(i){const r=records[i],scale=Math.min((viewport.clientWidth-44)/r.w,(viewport.clientHeight-35)/r.h);return{s:scale,x:(viewport.clientWidth-r.w*scale)/2-r.x*scale,y:(viewport.clientHeight-r.h*scale)/2-r.y*scale};}
function bounded(){const bw=W*s,bh=H*s;x=bw<=viewport.clientWidth?(viewport.clientWidth-bw)/2:Math.min(35,Math.max(viewport.clientWidth-bw-35,x));y=bh<=viewport.clientHeight?(viewport.clientHeight-bh)/2:Math.min(35,Math.max(viewport.clientHeight-bh-35,y));}
function apply(animated=false){clearTimeout(animateTimer);world.classList.toggle('animated',animated);world.style.transform=`translate(${x}px,${y}px) scale(${s})`;root.dataset.scale=s.toFixed(4);world.style.setProperty('--scale',s);root.dataset.day=records[selected].day;root.dataset.view=progress>.2?'day':'month';root.classList.toggle('zoomed',progress>.2);$('#zoomRange').value=Math.round(progress*100);$('#monthButton').classList.toggle('active',progress<.2);$('#dayButton').classList.toggle('active',progress>=.2);world.querySelectorAll('.memory').forEach((b,i)=>b.setAttribute('aria-pressed',String(progress>.2&&i===selected)));const r=records[selected];$('#statusCopy').innerHTML=progress>.2?`9月${r.day}日<span>${r.name}</span>`:'5 个日子<span>照片已在屏幕展示过</span>';$('#hint').textContent=progress>.2?'拖动看看附近 · 收拢回到整月':'双指展开，走近一天 · 点照片也可以';if(animated)animateTimer=setTimeout(()=>world.classList.remove('animated'),560);}
function overview(animated=true){$('#todayState').hidden=true;world.hidden=false;$('#zoomRange').disabled=false;measure();const f=fit();s=f.s;x=f.x;y=f.y;progress=0;apply(animated);$('#announcement').textContent='回到9月，5个已经展示过的日子';}
function focusDay(i){$('#todayState').hidden=true;world.hidden=false;$('#zoomRange').disabled=false;selected=i;const f=focal(i);s=f.s;x=f.x;y=f.y;progress=1;apply(true);$('#announcement').textContent=`9月${records[i].day}日，${records[i].name}`;}
function rangeTo(v){$('#todayState').hidden=true;world.hidden=false;progress=v;const a=fit(),b=focal(selected);s=a.s+(b.s-a.s)*v;x=a.x+(b.x-a.x)*v;y=a.y+(b.y-a.y)*v;apply(false);}
function zoomAt(scale,cx,cy){const next=Math.max(min,Math.min(max,scale)),ratio=next/s;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;s=next;bounded();const cxw=(viewport.clientWidth/2-x)/s,cyw=(viewport.clientHeight/2-y)/s;selected=records.reduce((best,r,i)=>Math.hypot(r.x+r.w/2-cxw,r.y+r.h/2-cyw)<Math.hypot(records[best].x+records[best].w/2-cxw,records[best].y+records[best].h/2-cyw)?i:best,selected);progress=Math.max(0,Math.min(1,(s-min)/(focal(selected).s-min)));apply(false);}
function local(e){const r=viewport.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function resetPinch(){if(points.size===2){const [a,b]=[...points.values()];pinch={dist:Math.hypot(a.x-b.x,a.y-b.y),s,mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};}}
viewport.addEventListener('pointerdown',e=>{if(e.button!==0||!$('#todayState').hidden)return;const p=local(e);points.set(e.pointerId,p);down={id:e.pointerId,p,x,y,moved:false};if(points.size===2)resetPinch();});
viewport.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;const p=local(e);points.set(e.pointerId,p);if(points.size===2&&pinch){const [a,b]=[...points.values()],dist=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(pinch.s*dist/Math.max(1,pinch.dist),(a.x+b.x)/2,(a.y+b.y)/2);lastClickUntil=performance.now()+350;return;}if(!down||e.pointerId!==down.id)return;const dx=p.x-down.p.x,dy=p.y-down.p.y;if(Math.hypot(dx,dy)<5&&!down.moved)return;down.moved=true;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging');x=down.x+dx;y=down.y+dy;bounded();const cxw=(viewport.clientWidth/2-x)/s,cyw=(viewport.clientHeight/2-y)/s;selected=records.reduce((best,r,i)=>Math.hypot(r.x+r.w/2-cxw,r.y+r.h/2-cyw)<Math.hypot(records[best].x+records[best].w/2-cxw,records[best].y+records[best].h/2-cyw)?i:best,selected);apply();});
function release(e){if(down?.moved||pinch)lastClickUntil=performance.now()+350;points.delete(e.pointerId);if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);if(points.size<2)pinch=null;down=null;viewport.classList.remove('dragging');}
viewport.addEventListener('pointerup',release);viewport.addEventListener('pointercancel',release);viewport.addEventListener('pointerleave',e=>{if(!viewport.hasPointerCapture(e.pointerId))release(e);});
viewport.addEventListener('wheel',e=>{if(!$('#todayState').hidden)return;e.preventDefault();const p=local(e);zoomAt(s*Math.exp(-e.deltaY*.002),p.x,p.y);},{passive:false});
viewport.addEventListener('keydown',e=>{if(['+','=','-','Escape','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='Escape')overview();else if(e.key==='+'||e.key==='=')zoomAt(s*1.15,viewport.clientWidth/2,viewport.clientHeight/2);else if(e.key==='-')zoomAt(s/1.15,viewport.clientWidth/2,viewport.clientHeight/2);else if(e.key==='ArrowLeft')focusDay(Math.min(4,selected+1));else if(e.key==='ArrowRight')focusDay(Math.max(0,selected-1));});
$('#zoomRange').addEventListener('input',e=>rangeTo(Number(e.target.value)/100));$('#monthButton').onclick=()=>overview();$('#dayButton').onclick=()=>focusDay(selected);$('#backToMonth').onclick=()=>overview();$('#todayButton').onclick=()=>{$('#todayState').hidden=false;world.hidden=true;root.dataset.view='today';root.dataset.day='15';$('#statusCopy').innerHTML='9月15日<span>今天暂无展示记录</span>';$('#hint').textContent='接下来的内容，只在照片墙揭晓';$('#zoomRange').disabled=true;$('#announcement').textContent='今天暂无展示记录';};
new ResizeObserver(()=>{if(progress<.2)overview(false);else focusDay(selected);}).observe(viewport);
$('#seeFull').onclick=()=>{const r=records[selected];$('#fullTitle').textContent=`9月${r.day}日 · ${r.name}`;$('#fullImage').dataset.scene=r.scene;$('#fullImage').setAttribute('aria-label',`示例照片：${r.name}`);$('#fullPhoto').showModal();requestAnimationFrame(()=>crop($('#fullImage'),r.scene));};observer.observe($('#fullImage'));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
const infos={connection:['照片墙','连接状态仅用于演示。正式 App 会持续显示设备的真实连接状态。',[['客厅的照片墙','示例设备'],['设备回执','本 Demo 未连接设备']]],settings:['设置','设备和账户管理始终可从首页直接打开。',[['设备管理','1 台示例设备'],['账户','演示账户'],['照片访问','演示授权状态']]]};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open==='preferences'){renderPrefs(false);$('#preferenceSheet').showModal();return;}const info=infos[b.dataset.open];$('#infoTitle').textContent=info[0];$('#infoCopy').textContent=info[1];$('#infoRows').innerHTML=info[2].map(([a,v])=>`<div class="sheet-row"><span>${a}</span><small>${v}</small></div>`).join('');$('#infoSheet').showModal();});
let saved={topics:[],people:[]},draft,editing=false;try{const stored=JSON.parse(localStorage.getItem('echooo-studies-prefs')||'null');if(stored&&Array.isArray(stored.topics)&&Array.isArray(stored.people))saved=stored;}catch{}
function renderPrefs(edit){editing=edit;draft=JSON.parse(JSON.stringify(saved));$('#preferenceSheet').classList.toggle('editing',edit);$('#managePrefs').textContent=edit?'保存':'管理偏好';for(const [key,values] of [['topics',['一起出游','家人朋友','小动物']],['people',['人物 1','人物 2','人物 3']]]){const box=$('#'+key);box.innerHTML='';values.forEach((name,i)=>{const label=document.createElement('label');label.className='option';label.dataset.selected=String(draft[key].includes(i));label.innerHTML=`<input type="checkbox" ${draft[key].includes(i)?'checked':''} ${edit?'':'disabled'}><span>${name}</span>`;label.querySelector('input').onchange=e=>{draft[key]=e.target.checked?[...draft[key],i]:draft[key].filter(n=>n!==i);label.dataset.selected=String(e.target.checked);};box.appendChild(label);});}}
$('#managePrefs').onclick=()=>{if(!editing)renderPrefs(true);else{saved=draft;try{localStorage.setItem('echooo-studies-prefs',JSON.stringify(saved));}catch{}renderPrefs(false);}};
overview(false);
})();
</script>
