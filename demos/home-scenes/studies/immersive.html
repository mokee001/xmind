<script>

  const icon=(name,fallback)=>`<iconify-icon icon="lucide:${name}" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">${fallback}</span>`;

  function assignScene(element,at){const item=dates[at],image=element.querySelector('.image'),empty=element.querySelector('.empty-message');element.classList.toggle('empty',item.scene===null);empty.hidden=item.scene!==null;empty.inert=item.scene!==null;if(item.scene!==null){image.dataset.scene=item.scene;crop(image);}element.dataset.date=item.day;}
  function label(){const item=dates[index];$('dayNumber').textContent='09/'+String(item.day).padStart(2,'0');$('dateWeekday').textContent=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date(2026,8,item.day).getDay()];$('dateStatus').textContent=item.day===15?'今天':'已展示 · 示例';$('memoryTitle').textContent=item.day===15?'':item.title;$('fullButton').disabled=item.scene===null;$('hintText').textContent=item.day===15?'向上滑，回看':index===dates.length-1?'向下滑，回看':'上下滑，回看';document.querySelectorAll('[data-rail]').forEach(button=>{if(Number(button.dataset.rail)===index)button.setAttribute('aria-current','date');else button.removeAttribute('aria-current');});stage.setAttribute('aria-label',`9 月 ${item.day} 日，${item.title}。上下轻扫切换日期，长按查看完整照片`);$('announce').textContent=`9 月 ${item.day} 日，${item.title}`;}
  function stopAnimation(){token++;if(raf)cancelAnimationFrame(raf);raf=0;}
  function clearHold(){if(longTimer)clearTimeout(longTimer);longTimer=0;}
  function cancelGesture(){clearHold();const active=gesture;gesture=null;if(active&&stage.hasPointerCapture(active.id))stage.releasePointerCapture(active.id);}
  function prepareIncoming(target){if(target===index||target<0||target>=dates.length){incoming=null;sceneB.hidden=true;sceneB.inert=true;return;}sceneB.hidden=false;if(incoming!==target){incoming=target;assignScene(sceneB,target);}sceneB.inert=true;}
  function paintSlide(){sceneA.style.transform=`translate3d(0,${offset}px,0)`;if(incoming!==null){const direction=incoming>index?1:-1;sceneB.style.transform=`translate3d(0,${offset+direction*stage.clientHeight}px,0)`;}}
  function finishSlide(target){index=target;offset=0;incoming=null;assignScene(sceneA,index);sceneA.style.transform='';sceneB.hidden=true;sceneB.inert=true;sceneB.style.transform='';label();}
  function goTo(target){
    target=Math.max(0,Math.min(dates.length-1,target));stopAnimation();cancelGesture();const from=offset,start=performance.now(),run=token;prepareIncoming(target);const end=target===index?0:(target>index?-1:1)*stage.clientHeight;
    if(reduced.matches){finishSlide(target);return;}
    function frame(now){if(run!==token)return;const p=Math.min(1,(now-start)/290),t=1-Math.pow(1-p,3);offset=from+(end-from)*t;paintSlide();if(p<1)raf=requestAnimationFrame(frame);else{raf=0;finishSlide(target);}}

  });

  });
  function pointerEnd(event){const active=gesture;if(!active||active.id!==event.pointerId)return;gesture=null;clearHold();if(stage.hasPointerCapture(active.id))stage.releasePointerCapture(active.id);suppressClick=active.moved||held;const velocity=Math.abs(active.dy)/Math.max(1,performance.now()-active.time),commit=active.moved&&(Math.abs(offset)>stage.clientHeight*.12||(Math.abs(active.dy)>28&&velocity>.45));goTo(commit?active.indexAtStart+(offset<0?1:-1):active.indexAtStart);}
  stage.addEventListener('pointerup',pointerEnd);stage.addEventListener('pointercancel',event=>{if(gesture?.id===event.pointerId){cancelGesture();goTo(index);}});stage.addEventListener('lostpointercapture',event=>{if(gesture?.id===event.pointerId){cancelGesture();goTo(index);}});stage.addEventListener('click',event=>{if(suppressClick&&event.detail!==0){suppressClick=false;event.preventDefault();event.stopImmediatePropagation();}else suppressClick=false;},true);
  stage.addEventListener('wheel',event=>{if(!$('fullView').hidden||!$('sheetShade').hidden||gesture)return;event.preventDefault();const now=performance.now();if(now-lastWheelEvent>150)wheelTotal=0;lastWheelEvent=now;if(now-lastWheel<350)return;wheelTotal+=event.deltaY;if(Math.abs(wheelTotal)>=36){const direction=wheelTotal>0?1:-1;wheelTotal=0;lastWheel=now;goTo(index+direction);}},{passive:false});
  document.querySelectorAll('[data-rail]').forEach(button=>button.addEventListener('click',()=>goTo(Number(button.dataset.rail))));document.querySelectorAll('[data-latest]').forEach(button=>button.addEventListener('click',()=>goTo(1)));
  function openFull(){
    if(dates[index].scene===null)return;stopAnimation();cancelGesture();finishSlide(index);fullFocus=document.activeElement;const item=dates[index];$('appContent').inert=true;$('fullView').hidden=false;$('fullView').inert=false;$('fullPhoto').dataset.scene=item.scene;crop($('fullPhoto'));$('fullDate').textContent='2026 / 09 / '+String(item.day).padStart(2,'0');$('fullTitle').textContent=item.title;$('closeFull').focus({preventScroll:true});
  }
  function closeFull(){$('fullView').hidden=true;$('fullView').inert=true;$('appContent').inert=false;fullFocus?.focus({preventScroll:true});}
  $('fullButton').addEventListener('click',openFull);$('closeFull').addEventListener('click',closeFull);
  function escapeHTML(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function drawPreferences(){
    const prefs=edit?draft:preferences,topics=['日常','旅行','自然','宠物'],people=['人物 1','人物 2','人物 3'];
    const chip=(label,selected,kind)=>edit?`<button class="chip ${selected?'selected':''}" data-kind="${kind}" data-value="${label}" aria-pressed="${selected}"><span>${label}</span><span class="check-box" aria-hidden="true">${selected?'✓':''}</span></button>`:`<span class="chip readonly ${selected?'selected':''}">${escapeHTML(label)}</span>`;
    $('sheetBody').innerHTML=`<section class="field-block"><h3 class="field-title">想看到的内容</h3><div class="chips">${topics.map(topic=>chip(topic,prefs.topics.includes(topic),'topics')).join('')}</div></section><section class="field-block"><h3 class="field-title">不想看到谁</h3>${edit?'<p class="field-note">选中要排除的人物。其余人物默认允许。</p>':''}<div class="chips">${edit?people.map(person=>chip(person,prefs.excluded.includes(person),'excluded')).join(''):prefs.excluded.length?prefs.excluded.map(person=>chip(person,true,'excluded')).join(''):'<p class="sheet-copy small">没有排除的人物</p>'}</div></section><p class="preferences-note">人物为示例。偏好仅保存在本预览，不改变后台筛选或真实设备内容。</p>`;
    $('manageButton').textContent=edit?'保存':'管理';$('manageButton').classList.toggle('editing',edit);$('manageButton').setAttribute('aria-label',edit?'保存偏好':'管理偏好');

  }
  function openSheet(type){
    stopAnimation();cancelGesture();finishSlide(index);returnFocus=document.activeElement;sheetType=type;edit=false;draft=null;$('appContent').inert=true;$('sheetShade').hidden=false;$('sheetShade').inert=false;$('manageButton').hidden=type!=='preferences';
    if(type==='preferences'){$('sheetTitle').textContent='偏好';drawPreferences();}

  document.querySelectorAll('[data-sheet]').forEach(button=>button.addEventListener('click',()=>openSheet(button.dataset.sheet)));$('closeSheet').addEventListener('click',closeSheet);$('sheetShade').addEventListener('click',event=>{if(event.target===$('sheetShade'))closeSheet();});
  document.addEventListener('keydown',event=>{

});
</script>

<body>
<div id="root">
  <div id="appContent">
    <main class="photo-stage" id="photoStage" tabindex="0" aria-label="上下轻扫切换回忆"><div class="scene" id="sceneA"><div class="image" data-scene="0"></div><div class="empty-message" hidden inert><h2>今天还没有<br>留下回忆。</h2><button data-latest>回看 9 月 13 日</button></div></div><div class="scene" id="sceneB" hidden inert><div class="image" data-scene="1"></div><div class="empty-message" hidden inert><h2>今天还没有<br>留下回忆。</h2><button data-latest>回看 9 月 13 日</button></div></div></main>
    <div class="scrim" aria-hidden="true"></div>
    <header class="topbar"><button class="connection" data-sheet="connection"><span class="status-dot"></span>已连接 <small>· 示例</small></button><div class="top-actions"><button class="preferences" data-sheet="preferences">偏好</button><button class="settings" data-sheet="settings" aria-label="设置"><iconify-icon icon="lucide:settings" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">⚙</span></button></div></header>
    <div class="identity">回忆</div>
    <nav class="date-rail" aria-label="九月日期"><button class="rail-month" data-sheet="directory" id="dateDirectory" aria-label="打开九月日期目录">九月</button><button class="date-dot" data-rail="0" aria-label="9月15日，今天暂无回忆">15</button><button class="date-dot" data-rail="1" aria-label="9月13日" aria-current="date">13</button><button class="date-dot" data-rail="2" aria-label="9月11日">11</button><button class="date-dot" data-rail="3" aria-label="9月8日">08</button><button class="date-dot" data-rail="4" aria-label="9月5日">05</button><button class="date-dot" data-rail="5" aria-label="9月2日">02</button></nav>
    <section class="bottom-info" aria-label="当前回忆"><h1 class="date-heading"><span class="date-number" id="dayNumber">09/13</span><span class="date-context"><span id="dateWeekday">星期日</span><span id="dateStatus">已展示 · 示例</span></span></h1><p class="memory-title" id="memoryTitle">海边</p><div class="bottom-actions"><span class="swipe-hint"><iconify-icon icon="lucide:move-vertical" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">↕</span><span id="hintText">上下滑，回看</span></span><button class="full-button" id="fullButton"><iconify-icon icon="lucide:expand" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">⛶</span>完整照片</button></div></section>
    <span class="sr-only" id="announce" aria-live="polite"></span>
  </div>
  <section class="full-view" id="fullView" hidden inert role="dialog" aria-modal="true" aria-label="完整照片"><div class="full-top"><button class="full-close" id="closeFull"><iconify-icon icon="lucide:arrow-left" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">←</span>返回</button><span class="full-date" id="fullDate"></span></div><div class="full-center"><div class="full-photo" id="fullPhoto" data-scene="0" role="img" aria-label="当前回忆完整构图示例"></div></div><div class="full-caption"><span id="fullTitle"></span><span>示例照片</span></div></section>
  <div class="sheet-shade" id="sheetShade" hidden inert><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet-header"><h2 id="sheetTitle"></h2><div class="sheet-header-actions"><button class="manage-button" id="manageButton" hidden>管理</button><button class="sheet-close" id="closeSheet" aria-label="关闭"><iconify-icon icon="lucide:x" aria-hidden="true"></iconify-icon><span class="icon-fallback" aria-hidden="true">×</span></button></div></div><div id="sheetBody"></div></section></div>
</div>
</body>
</html>
