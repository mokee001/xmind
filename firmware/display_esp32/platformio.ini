; PlatformIO 工程配置 —— ESP32-S3-WROOM-1 + ST7262 800x480 RGB 屏
; 用 VS Code + PlatformIO 插件可直接编译烧录。
; 若用 Arduino IDE，则忽略此文件：手动装 lib_deps 里的三个库，
; 并在“工具”里把 PSRAM 设为 OPI PSRAM、Flash 设 16MB。

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- ESP32-S3 + OPI PSRAM（800x480 帧缓冲必须）---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononsoftware/GFX Library for Arduino
    bitbank2/JPEGDEC
    links2004/WebSockets
