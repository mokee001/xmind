[platformio]
default_envs = waveshare_e6

[env:waveshare_e6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 32MB
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi
; Keep a conservative 16MB application layout within the physical 32MB flash.
board_build.partitions = default_16MB.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

[env:reterminal_e1002]
extends = env:waveshare_e6
extra_scripts = pre:tools/guard_e1002_upload.py
upload_speed = 460800
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_e1002.csv
build_src_filter = +<*> -<panel_13in3e6.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -D PHOTOWALL_RETERMINAL_E1002=1
; Do not use the default upload action: it writes boot_app0 at 0xe000, which
; is inside this board's factory NVS partition. Use tools/flash_e1002.py.
